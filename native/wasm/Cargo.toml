[package]
name = "wingtip-wasm"
version = "0.1.0"
edition = "2021"
publish = false
description = "The engine for the web app: one WebAssembly function, a rule by name with JSON in and out (web/src/lib/engine)"

[lib]
name = "wingtip_wasm"
crate-type = ["cdylib"]

# None but the engine: no wasm-bindgen, so building it takes only cargo
# and the wasm32-unknown-unknown target, and the JavaScript side is the
# few lines of web/src/lib/engine/engine.ts.
[dependencies]
wingtip-engine = { path = "../engine" }
