[package]
name = "vfr_native"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "vfr_native"
crate-type = ["cdylib"]

[dependencies]
# The arrays come in by the buffer protocol (abi3 has it from 3.11): no
# numpy crate, nor its ndarray, to keep up with.
pyo3 = { version = "0.29.3", features = ["extension-module", "abi3-py311"] }

[profile.release]
lto = true
codegen-units = 1

# CI's tests build this rather than the release profile: a quicker
# compile, the same answers.
[profile.ci]
inherits = "release"
lto = false
codegen-units = 16
