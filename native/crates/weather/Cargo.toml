[package]
name = "wingtip-weather"
version = "0.1.0"
edition = "2021"
publish = false
description = "The weather and NOTAM products as sent, read strictly: METAR, TAF, winds aloft, NOTAMs, TFRs, a field's forecast flight category and when a report stops counting"

[lib]
name = "wingtip_weather"

# Only the engine's own crates, below this one (native/README.md):
# plain Rust, so the phones carry it as it is.
[dependencies]
wingtip-geo = { path = "../geo" }
