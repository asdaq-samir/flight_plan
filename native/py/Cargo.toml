[package]
name = "wingtip_native"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "wingtip_native"
crate-type = ["cdylib"]

[dependencies]
wingtip-engine = { path = "../engine" }
# The arrays come in by the buffer protocol (abi3 has it from 3.11): no
# numpy crate, nor its ndarray, to keep up with.
pyo3 = { version = "0.29.3", features = ["extension-module", "abi3-py311"] }
