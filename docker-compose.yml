# Shared, not copy-pasted into each service below -- three of the
# Python services (planning-service, model-service, crewai-agent) had
# byte-identical healthcheck timing and the identical required-env
# line for ANTHROPIC_API_KEY, which meant a change to either (say, a
# longer start_period, or a reworded failure message) only actually
# landing wherever someone remembered to also paste it. `x-` prefixed
# keys are Compose's own convention for a block that exists purely to
# be referenced by anchor -- ignored as a service definition, kept for
# `<<`/`*` to pull from.
x-python-healthcheck: &python-healthcheck
  interval: 5s
  timeout: 5s
  retries: 10
  start_period: 10s

# `:-` rather than `:?`, which this was until it was tried from a clean
# checkout. Compose interpolates the whole file before it decides what to
# start, so a required-variable marker anywhere in it fails every command
# -- `docker compose up webapp`, and even `docker compose config`. That
# put an Anthropic key in front of the map, the planner and the chart
# tiles, none of which call an LLM at all. The services that genuinely
# need a key are behind the `ai` profile below and refuse to start
# without one themselves, which is the same fail-fast a level later.
x-anthropic-api-key: &anthropic-api-key ${ANTHROPIC_API_KEY:-}

services:
  ml:
    build:
      context: .
      dockerfile: docker/Dockerfile.ml
    ports:
      # 127.0.0.1-bound, not 0.0.0.0 -- this and every other non-webapp
      # port below are local-debugging conveniences, not a public surface
      # (webapp is the only intended front door, see
      # PlannerProxyController.java's own docstring). Binding to
      # localhost keeps `docker compose up` safe to run on a shared or
      # internet-reachable host without also publishing an
      # unauthenticated Jupyter/DB/service port to it.
      - "127.0.0.1:8888:8888"
    volumes:
      - .:/workspace

  # One-shot jobs, not services: behind the `pipeline` profile so a plain
  # `docker compose up` never starts them. It used to start both -- and
  # the training image's default command is a full all-core retrain,
  # which then overwrote the candidate model the registry compares next.
  # Naming one still works as before: `docker compose run --rm
  # pipeline-training retrain`, `docker compose build pipeline-processing
  # pipeline-training` (the images the Airflow DAG runs).
  pipeline-processing:
    build:
      context: .
      dockerfile: docker/Dockerfile.processing
    profiles: ["pipeline"]
    volumes:
      - .:/workspace

  pipeline-training:
    build:
      context: .
      dockerfile: docker/Dockerfile.training
    profiles: ["pipeline"]
    volumes:
      - .:/workspace

  airflow:
    build:
      context: .
      dockerfile: docker/Dockerfile.airflow
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      # data/ only -- promotion writes data/models -- and never the code:
      # the DAGs and src are baked into the image (docker/Dockerfile.airflow),
      # because this container holds the host's Docker socket and the
      # repo is writable from ml, the pipeline jobs, planning-service and
      # the agents. Code read from the repo here would run whatever any
      # of them had written.
      - ./data:/opt/project/data
      # airflow_home_v3, not airflow_home: the 2.x airflow.cfg this volume
      # held has no [api_auth]/jwt_secret -- a value Airflow 3's api-server
      # requires and refuses to autogenerate into an existing cfg file. A
      # fresh volume gets a fresh cfg with the new default; the old one is
      # left on disk, unreferenced, same fallback pattern as pgdata_pg18.
      - airflow_home_v3:/opt/airflow
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      # Where the DAG and vfr are is the image's to say (it put them there).
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      # DockerOperator launches sibling containers via the mounted host
      # socket -- their -v mounts are resolved by the HOST's Docker daemon,
      # so they need the HOST's path to this project, not a path inside
      # this container.
      PROJECT_HOST_PATH: ${PWD}
      # The DAG's DockerOperator tasks run the pipeline images Compose
      # built for this project -- named <project>-pipeline-processing
      # and <project>-pipeline-training, the project being this
      # directory's name unless COMPOSE_PROJECT_NAME says otherwise.
      PIPELINE_IMAGE_PREFIX: ${COMPOSE_PROJECT_NAME:-flight_plan}
    command: standalone

  db:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_DB: vfr_route
      POSTGRES_USER: vfr
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vfr}
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vfr -d vfr_route"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      # pg18, not pg16: a Postgres major-version bump can't read an
      # existing data directory in place, so this is a new volume
      # (migrated via pg_dump/pg_restore, not initdb) rather than the
      # old pgdata -- which still exists, untouched, as a fallback.
      # Mounted at /var/lib/postgresql (not .../data): the postgres
      # image changed its expected layout at 18, to a pg_ctlcluster-
      # style major-version-specific subdirectory under the mount
      # point, specifically so a future in-place pg_upgrade --link has
      # no mount-boundary issue. Mounting at .../data (the pre-18
      # convention) makes the 18 entrypoint refuse to start.
      - pgdata_pg18:/var/lib/postgresql

  # The developer console's one door onto Docker (docker/dev-services):
  # which of four services are running, and starting one that is not.
  # It holds the socket so planning-service doesn't, and answers those
  # two requests for those four names in this project, nothing else --
  # no create, no exec, no other container.
  #
  # It replaced tecnativa/docker-socket-proxy with CONTAINERS and POST
  # granted, which the proxy's own rules turn into every method on every
  # /containers path, `POST /containers/create` included: a privileged
  # container with the host's / mounted, from anything that could reach
  # it. And everything could, because every service shared one network.
  # This one sits on `docker-control` alone, which only planning-service
  # also joins; webapp, ml and the rest cannot resolve it.
  dev-services:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev-services
    environment:
      DEV_SERVICES: ml,airflow,model-service,nav-log-agent
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks: [docker-control]
    restart: unless-stopped

  planning-service:
    # Planning and chart vision: reads FAA sectional tiles, walks the great
    # circle, selects checkpoints and computes the dead-reckoning nav log.
    # Serves no pages -- the front end is built into webapp's jar, and the
    # browser reaches this only through webapp's /api/planner/* proxy.
    # Mounts the project so it can write a new corridor's candidates and
    # features into data/processed, the same directory model-service reads
    # its feature stores from.
    build:
      context: .
      dockerfile: planning-service/Dockerfile
    ports:
      - "127.0.0.1:8084:8000"
    # docker-control as well as the default network: the only service
    # besides dev-services itself that can reach the sidecar.
    networks: [default, docker-control]
    volumes:
      - .:/workspace
      # Airflow's own home, read-only, for the one file /api/retrain
      # needs: the admin password Airflow's standalone mode generates.
      - airflow_home_v3:/airflow-home:ro
    environment:
      PYTHONPATH: /workspace/src
      MODEL_SERVICE_URL: http://model-service:8000
      # Not the host's Docker socket -- the dev-services sidecar above,
      # which routers/devservices.py asks which of four services are up
      # and to start one.
      DEV_SERVICES_URL: http://dev-services:8000
      # The clock the chart refresh's night-time window (see
      # planning-service/app/main.py) is read against: the desk this
      # runs on, not UTC.
      TZ: ${TZ:-America/Chicago}
      # /api/checkpoint-notes: one Claude call per checkpoint that has
      # no saved note yet.
      ANTHROPIC_API_KEY: *anthropic-api-key
      # /api/status probes these; /api/retrain starts the training DAG.
      # All optional -- the AWS task sets none of them.
      NAV_LOG_AGENT_URL: http://nav-log-agent:8000
      CREWAI_AGENT_URL: http://crewai-agent:8000
      AIRFLOW_URL: http://airflow:8080
      AIRFLOW_PASSWORDS_FILE: /airflow-home/simple_auth_manager_passwords.json.generated
    depends_on:
      model-service:
        condition: service_healthy
    healthcheck:
      <<: *python-healthcheck
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]

  model-service:
    build: ./model-service
    ports:
      - "127.0.0.1:8000:8000"
    # Mounted at SageMaker's own paths rather than at the project layout:
    # /opt/ml/model is where SageMaker places a model artifact for an
    # inference container, so the service reads the same location locally
    # and on AWS and needs no code change to move. Read-only -- serving
    # never writes to either.
    volumes:
      - ./data/models/current:/opt/ml/model:ro
      - ./data/processed:/opt/ml/features:ro
      # PyTorch/TensorFlow/Spark's own artifacts (vfr.model_candidates,
      # trained one-off inside the `ml` image, see that module's
      # docstring) -- read-only for the same reason as the two above.
      - ./data/models/candidates:/opt/ml/candidates:ro
    # No curl/wget in the python:3.13-slim base -- a stdlib urllib call
    # needs neither, and /ping is the same real "did the model actually
    # load" check SageMaker itself would use.
    healthcheck:
      <<: *python-healthcheck
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ping')"]

  nav-log-agent:
    # Behind a profile because it is opt-in and wants a bearer token of
    # its own (below), not because it needs an Anthropic key -- its MCP
    # tools fetch the planner's nav log and do the memory lookup with no
    # LLM at all, and leave the narrative to whichever agent connected. Only `generate_nav_log_briefing` spends credit.
    # Start it with `--profile ai`, or by naming it
    # (`docker compose up -d nav-log-agent`), which enables its profile.
    profiles: ["ai"]
    build:
      context: .
      dockerfile: nav-log-agent/Dockerfile
    ports:
      - "127.0.0.1:8082:8000"
    volumes:
      - .:/workspace
    depends_on:
      db:
        condition: service_healthy
      planning-service:
        condition: service_healthy
    environment:
      PYTHONPATH: /workspace/src
      ANTHROPIC_API_KEY: *anthropic-api-key
      # The MCP server's own bearer-token gate -- see app/main.py's
      # BearerAuthMiddleware. Unset, the server exits on startup saying
      # so ("refuses to start unauthenticated") rather than coming up
      # open, so the check that used to happen at compose-parse time
      # still happens loudly, one step later -- and now only for the
      # people actually starting this service.
      NAV_LOG_AGENT_API_KEY: ${NAV_LOG_AGENT_API_KEY:-}
      # The nav log is the planner's own (vfr.planner_client), not one
      # this agent assembles, so the one a pilot sees is the one it briefs.
      PLANNING_SERVICE_URL: http://planning-service:8000
      # The db's own password, as the webapp's datasource has it.
      DATABASE_URL: postgresql://vfr:${POSTGRES_PASSWORD:-vfr}@db:5432/vfr_route

  crewai-agent:
    # Behind the same `ai` profile as nav-log-agent, and for the same
    # reason: every one of its crew's steps is a Claude call.
    profiles: ["ai"]
    build:
      context: .
      dockerfile: crewai-agent/Dockerfile
    # No published port -- the image's own command is app.server, a thin
    # HTTP wrapper only ever called by webapp over the internal docker
    # network (crewai-agent:8000), the same no-auth-of-its-own design as
    # planning-service. The one-shot CLI is
    # `docker compose run --rm crewai-agent python -m app.main ...`.
    volumes:
      - .:/workspace
    depends_on:
      planning-service:
        condition: service_healthy
    environment:
      PYTHONPATH: /workspace/src
      ANTHROPIC_API_KEY: *anthropic-api-key
      # The same planner nav log nav-log-agent briefs (vfr.planner_client).
      PLANNING_SERVICE_URL: http://planning-service:8000
    healthcheck:
      <<: *python-healthcheck
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]

  webapp:
    # Context is the repo root: the image builds web/ and bakes the
    # bundle into the jar, so this one service serves both.
    build:
      context: .
      dockerfile: springboot-app/Dockerfile
    # This machine only. With no sign-in configured (the local default)
    # every planner write is open to whoever reaches this port, so a
    # port on every interface put retrain, builds and chart refreshes in
    # the hands of anyone on the same Wi-Fi. A phone on the LAN adds
    # docker-compose.phone.yml, which publishes these two on every
    # interface and says what that opens.
    ports:
      - "127.0.0.1:8080:8080"
      # HTTPS, for a phone on the same Wi-Fi: only answers once
      # infra/local-https/make-certs.sh has written the certificate
      # (see HttpsConnectorConfig); otherwise the port is simply closed.
      - "127.0.0.1:8443:8443"
    volumes:
      - webapp-cds:/cds
      - ./infra/local-https/certs:/certs:ro
    depends_on:
      db:
        condition: service_healthy
      planning-service:
        condition: service_healthy
    # Ready means Spring's readiness group (the app and its database)
    # says UP -- 20-30 s after the container starts, during which the
    # pages 404. `docker compose up --wait` holds until this passes, so
    # a test run started after it never meets a half-booted server.
    # bash's /dev/tcp, not curl: the JRE image has neither curl nor
    # wget. And CMD, not CMD-SHELL, which runs dash, where /dev/tcp
    # does not exist.
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/8080 &&
          printf 'GET /actuator/health/readiness HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3 &&
          grep -q '"status":"UP"' <&3
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 90s
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/vfr_route
      SPRING_DATASOURCE_USERNAME: vfr
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-vfr}
      PLANNER_SERVICE_URL: http://planning-service:8000
      # Local start-up time, not a production setting. The class-data
      # archive (kept on the webapp-cds volume, see the Dockerfile) lets
      # a restart of the same jar skip the class loading and
      # verification it already did; C1-only JIT starts faster and
      # this proxy never runs hot enough locally to miss C2. The AWS
      # task definition sets neither.
      JAVA_TOOL_OPTIONS: -XX:+AutoCreateSharedArchive -XX:SharedArchiveFile=/cds/webapp.jsa -XX:TieredStopAtLevel=1
      # The flight planning drawer's narrative popover (ComparisonProxyController) --
      # neither is in `depends_on` above, unlike planning-service: that
      # popover is a developer-facing extra, not core to planning a
      # route, so webapp must still start cleanly with nav-log-agent/
      # crewai-agent down (it just reports
      # "unavailable" per-framework, same 502-on-unreachable pattern
      # PlannerProxyController already uses).
      NAV_LOG_AGENT_URL: http://nav-log-agent:8000
      # Optional here unlike nav-log-agent's own copy of this var (that
      # one still fails fast -- an unprotected MCP server would be a
      # real regression, not a degraded feature): blank just means the
      # comparison panel's LangGraph call 401s and reports unavailable.
      NAV_LOG_AGENT_API_KEY: ${NAV_LOG_AGENT_API_KEY:-}
      CREWAI_AGENT_URL: http://crewai-agent:8000
      # Sign-in with Google/Apple, optional unlike ANTHROPIC_API_KEY
      # above: `docker compose up` must still work with none of these
      # set (the `oauth` Spring profile stays inactive and OIDC sign-in
      # is just not offered), but real values in the shell or a .env
      # file now actually reach OAuthClientsConfig instead of going
      # nowhere. Apple needs all four of its own to activate -- see that
      # class's own javadoc for what each one is and where it comes from
      # in Apple's developer portal.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      APPLE_TEAM_ID: ${APPLE_TEAM_ID:-}
      APPLE_KEY_ID: ${APPLE_KEY_ID:-}
      APPLE_SERVICES_ID: ${APPLE_SERVICES_ID:-}
      APPLE_PRIVATE_KEY: ${APPLE_PRIVATE_KEY:-}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
      # The magic-link email flow's own sender -- independent of the
      # `oauth` profile above (see application.yml's own comment);
      # unset, MagicLinkController still runs, it just logs instead of
      # actually sending on every request.
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-no-reply@northflyers.com}
      # Where the emailed sign-in link points (e.g. https://10.0.0.218:8443
      # for the phone). Required once MAIL_HOST is set -- the webapp will
      # not start without it -- because a link built from the request's
      # own Host header points wherever the caller said.
      APP_PUBLIC_BASE_URL: ${APP_PUBLIC_BASE_URL:-}
      # The HTTPS port for a phone on the same Wi-Fi (HttpsConnectorConfig):
      # the certificate infra/local-https/make-certs.sh writes, read
      # only once that file exists. HSTS off: this machine's plain port
      # must keep working after the HTTPS one has been used once.
      APP_HTTPS_KEYSTORE: ${APP_HTTPS_KEYSTORE:-/certs/webapp.p12}
      APP_HTTPS_KEYSTORE_PASSWORD: ${WEBAPP_KEYSTORE_PASSWORD:-changeit}
      APP_HSTS: "false"
      # No sign-in is configured here, so without this every planner
      # write (picks, notes, builds, retrain) and the narrative would be
      # refused: an unconfigured deployment refuses callers. Locally the
      # ports above are this machine's alone, which is what makes open
      # writes acceptable. See SecurityConfig.
      APP_OPEN_WRITES: "true"

networks:
  # dev-services and planning-service only (see dev-services above).
  # Internal: nothing on it needs to reach outside the host.
  docker-control:
    internal: true

volumes:
  # Neither pgdata nor airflow_home is referenced by any service anymore
  # (superseded by pgdata_pg18 / airflow_home_v3) -- both left declared,
  # and left on disk, purely as un-deleted fallbacks from their respective
  # major-version migrations.
  pgdata:
  pgdata_pg18:
  airflow_home:
  airflow_home_v3:
  # webapp's JVM class-data archive -- see JAVA_TOOL_OPTIONS on webapp.
  webapp-cds:
