services:
  ml:
    build:
      context: .
      dockerfile: docker/Dockerfile.ml
    ports:
      - "8888:8888"
    volumes:
      - .:/workspace

  pipeline-processing:
    build:
      context: .
      dockerfile: docker/Dockerfile.processing
    volumes:
      - .:/workspace

  pipeline-training:
    build:
      context: .
      dockerfile: docker/Dockerfile.training
    volumes:
      - .:/workspace

  airflow:
    build:
      context: .
      dockerfile: docker/Dockerfile.airflow
    ports:
      - "8081:8080"
    volumes:
      - .:/opt/airflow/project
      - airflow_home:/opt/airflow
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/project/airflow/dags
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      PYTHONPATH: /opt/airflow/project/src
      # DockerOperator launches sibling containers via the mounted host
      # socket -- their -v mounts are resolved by the HOST's Docker daemon,
      # so they need the HOST's path to this project, not this container's
      # own /opt/airflow/project view of it.
      PROJECT_HOST_PATH: ${PWD}
    command: standalone

  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: vfr_route
      POSTGRES_USER: vfr
      POSTGRES_PASSWORD: vfr
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  planner-ui:
    # The route planner -- two idents in, a chart with course, checkpoints
    # and nav log out. The one human-facing surface of the project.
    # Mounts the project so it can write a new corridor's candidates and
    # features into data/processed, which is the same directory
    # model-service reads its feature stores from.
    build:
      context: .
      dockerfile: planner-ui/Dockerfile
    ports:
      - "8084:8000"
    volumes:
      - .:/workspace
    environment:
      PYTHONPATH: /workspace/src
      MODEL_SERVICE_URL: http://model-service:8000
    depends_on:
      - model-service

  model-service:
    build: ./model-service
    ports:
      - "8000:8000"
    # Mounted at SageMaker's own paths rather than at the project layout:
    # /opt/ml/model is where SageMaker places a model artifact for an
    # inference container, so the service reads the same location locally
    # and on AWS and needs no code change to move. Read-only -- serving
    # never writes to either.
    volumes:
      - ./data/models/current:/opt/ml/model:ro
      - ./data/processed:/opt/ml/features:ro

  nav-log-agent:
    build:
      context: .
      dockerfile: nav-log-agent/Dockerfile
    ports:
      - "8082:8000"
    volumes:
      - .:/workspace
    depends_on:
      - db
      - model-service
    environment:
      PYTHONPATH: /workspace/src
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?Set ANTHROPIC_API_KEY in your shell or a .env file}
      MODEL_SERVICE_URL: http://model-service:8000
      DATABASE_URL: postgresql://vfr:vfr@db:5432/vfr_route

  crewai-agent:
    build:
      context: .
      dockerfile: crewai-agent/Dockerfile
    volumes:
      - .:/workspace
    depends_on:
      - model-service
    environment:
      PYTHONPATH: /workspace/src
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?Set ANTHROPIC_API_KEY in your shell or a .env file}
      MODEL_SERVICE_URL: http://model-service:8000

  webapp:
    build: ./springboot-app
    ports:
      - "8080:8080"
    depends_on:
      - db
      - model-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/vfr_route
      SPRING_DATASOURCE_USERNAME: vfr
      SPRING_DATASOURCE_PASSWORD: vfr
      MODEL_SERVICE_URL: http://model-service:8000

volumes:
  pgdata:
  airflow_home:
