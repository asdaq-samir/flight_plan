# The project's name, which its images, containers and volumes carry
# (wingtip-webapp, wingtip_pgdata): fixed here, not taken from the folder
# it is run from, so a checkout under another name -- a worktree -- runs
# the same stack (the owner renamed the app Wingtip, 2026-11-06).
name: wingtip

# Shared, not copy-pasted into each service below -- the Python
# services (planning-service and, once, model-service and the agents) had
# byte-identical healthcheck timing and the identical required-env
# line for ANTHROPIC_API_KEY, which meant a change to either (say, a
# longer start_period, or a reworded failure message) only actually
# landing wherever someone remembered to also paste it. `x-` prefixed
# keys are Compose's own convention for a block that exists purely to
# be referenced by anchor -- ignored as a service definition, kept for
# `<<`/`*` to pull from.
x-python-healthcheck: &python-healthcheck
  interval: 5s
  timeout: 5s
  retries: 10
  start_period: 10s

# `:-` rather than `:?`, which this was until it was tried from a clean
# checkout. Compose interpolates the whole file before it decides what to
# start, so a required-variable marker anywhere in it fails every command
# -- `docker compose up webapp`, and even `docker compose config`. That
# put an Anthropic key in front of the map, the planner and the chart
# tiles, none of which call an LLM at all. The planner's Claude features
# (the narrative, checkpoint notes, the assistant, the words) answer
# without one by saying the model cannot be reached.
x-anthropic-api-key: &anthropic-api-key ${ANTHROPIC_API_KEY:-}

# Every long-running service below restarts with Docker (restart:
# unless-stopped): after a reboot, Docker Desktop brings back whatever
# was running -- the phone's ports included, since it is the same
# container -- and a service someone stopped stays stopped. The
# pipeline jobs are one-shot and have none.
#
# One file for every way the stack runs on a machine of one's own; the
# phone, the LAN and front-end work used to be overlays of their own
# (docker-compose.phone.yml, .lan.yml, .web-dev.yml), which every `up`
# had to name again, and an `up` that forgot one quietly took the phone's
# ports away or served the image's bundle. They are settings now, read
# from .env (or the shell), so the stack is whatever .env says it is:
#
#   The phone, over the Wi-Fi (https://<this Mac's LAN address>:8443):
#     PUBLISH_ADDRESS=0.0.0.0     webapp's two ports and the sign-in inbox
#                                 on every interface, not loopback
#     PHONE_BASE_URL=https://<this Mac's LAN address>:8443
#                                 where the emailed sign-in link points
#     MAILPIT_UI_AUTH=<user>:<password>
#                                 the inbox's password: it holds sign-in
#                                 links, the developer's among them
#     The last two are required once PUBLISH_ADDRESS is set; compose
#     refuses to start without them. See infra/local-https for the
#     certificate.
#   The developer's doors from another device:
#     DEV_PUBLISH_ADDRESS=0.0.0.0 the planner's port (8084) and Jupyter's
#                                 (8888), which answer without
#                                 authentication -- Jupyter runs code --
#                                 so a network you control, for as long as
#                                 you need it. The database is never
#                                 published beyond loopback.
#   Front-end work without rebuilding the image:
#     COMPOSE_PROFILES=web-dev    starts web-build (vite --watch into
#                                 web/dist)
#     WEB_DIST_MOUNT=/app/static/app
#                                 and the webapp serves web/dist in place
#                                 of the bundle in its image
#
# Unset, every port is on 127.0.0.1 and the webapp serves its own bundle.

services:
  # wingtip's Python base (docker/Dockerfile.base): Python, wingtip's own
  # requirements and its Rust extension, built once and named by every
  # image that imports wingtip as its `wingtip-base` context
  # (`service:base` below), so `docker compose build planning-service`
  # builds it first, from this checkout, with nothing pulled from a
  # registry. Never run: scaled to zero, so `up` starts none of it. Not
  # behind a profile, because compose leaves a profiled service out of the
  # project, and a context naming it is then "an unknown service" (the
  # e2e job's `up` failed on exactly that).
  base:
    scale: 0
    build:
      context: .
      dockerfile: docker/Dockerfile.base
      target: base

  # Jupyter, for the notebooks: on demand, behind its own profile, so a
  # plain `docker compose up` leaves its image and its memory alone.
  # `docker compose up ml` (a service named on the command line starts
  # whatever its profile), or the developer console's System tab, which
  # starts its container once it has one (dev-services).
  ml:
    profiles: ["notebooks"]
    build:
      context: .
      dockerfile: docker/Dockerfile.ml
      additional_contexts:
        wingtip-base: service:base
    ports:
      # 127.0.0.1-bound, not 0.0.0.0 -- this and every other non-webapp
      # port below are local-debugging conveniences, not a public surface
      # (webapp is the only intended front door, see
      # PlannerProxyController.java's own docstring). Binding to
      # localhost keeps `docker compose up` safe to run on a shared or
      # internet-reachable host without also publishing an
      # unauthenticated Jupyter/DB/service port to it.
      - "${DEV_PUBLISH_ADDRESS:-127.0.0.1}:8888:8888"
    volumes:
      - .:/workspace

  # One-shot jobs, not services: behind the `pipeline` profile so a plain
  # `docker compose up` never starts them. It used to start both -- and
  # the training image's default command is a full all-core retrain,
  # which then overwrote the candidate model the registry compares next.
  # Naming one still works as before: `docker compose run --rm
  # pipeline-training retrain`, or the whole training run, every stage in
  # order: `docker compose run --rm pipeline-training run`.
  pipeline-processing:
    build:
      context: .
      dockerfile: docker/Dockerfile.processing
      additional_contexts:
        wingtip-base: service:base
    profiles: ["pipeline"]
    volumes:
      - .:/workspace

  pipeline-training:
    build:
      context: .
      dockerfile: docker/Dockerfile.training
      additional_contexts:
        wingtip-base: service:base
    profiles: ["pipeline"]
    volumes:
      - .:/workspace

  # The training run (`python -m wingtip.pipeline run`: both models'
  # stages in order, each promoted only if it beats the one serving), as
  # a container the developer console's Retrain starts through
  # dev-services -- which can start a container but never create one, so
  # `docker compose create retrain` makes it once. Behind the `pipeline`
  # profile and with no restart, so `docker compose up` never starts a
  # run; started again, it runs again. It replaced Airflow (the owner,
  # 2026-11-06): a scheduler, a web server and a metadata database for
  # a DAG that had no schedule and was only ever started from here.
  retrain:
    build:
      context: .
      dockerfile: docker/Dockerfile.training
      additional_contexts:
        wingtip-base: service:base
    profiles: ["pipeline"]
    command: ["run"]
    volumes:
      - .:/workspace

  db:
    restart: unless-stopped
    image: pgvector/pgvector:pg18@sha256:c29f30688a9ad961691bdf0ec1650717cc132a5814619d80f80463d6e4c42e47
    environment:
      POSTGRES_DB: wingtip
      POSTGRES_USER: wingtip
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wingtip}
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wingtip -d wingtip"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      # pg18, not pg16: a Postgres major-version bump can't read an
      # existing data directory in place, so this is a new volume
      # (migrated via pg_dump/pg_restore, not initdb).
      # Mounted at /var/lib/postgresql (not .../data): the postgres
      # image changed its expected layout at 18, to a pg_ctlcluster-
      # style major-version-specific subdirectory under the mount
      # point, specifically so a future in-place pg_upgrade --link has
      # no mount-boundary issue. Mounting at .../data (the pre-18
      # convention) makes the 18 entrypoint refuse to start.
      - pgdata_pg18:/var/lib/postgresql

  # The developer console's one door onto Docker (docker/dev-services):
  # which of the services it may start are running, and starting one.
  # It holds the socket so planning-service doesn't, and answers those
  # two requests for those names in this project, nothing else --
  # no create, no exec, no other container.
  #
  # It replaced tecnativa/docker-socket-proxy with CONTAINERS and POST
  # granted, which the proxy's own rules turn into every method on every
  # /containers path, `POST /containers/create` included: a privileged
  # container with the host's / mounted, from anything that could reach
  # it. And everything could, because every service shared one network.
  # This one sits on `docker-control` alone, which only planning-service
  # also joins; webapp, ml and the rest cannot resolve it.
  dev-services:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev-services
    environment:
      DEV_SERVICES: ml,retrain
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks: [docker-control]
    restart: unless-stopped

  planning-service:
    restart: unless-stopped
    # Planning and chart vision: reads FAA sectional tiles, walks the great
    # circle, selects checkpoints and computes the dead-reckoning nav log.
    # Serves no pages -- the front end is built into webapp's jar, and the
    # browser reaches this only through webapp's /api/planner/* proxy.
    # Mounts the project so it can write a new corridor's candidates and
    # features into data/processed, and read the chart model a retrain
    # promotes into data/models/chart/current, which it scores with
    # in-process (app.chart_scorer) and reads again when it changes.
    build:
      context: .
      dockerfile: planning-service/Dockerfile
      additional_contexts:
        wingtip-base: service:base
    ports:
      - "${DEV_PUBLISH_ADDRESS:-127.0.0.1}:8084:8000"
    # docker-control as well as the default network: the only service
    # besides dev-services itself that can reach the sidecar.
    networks: [default, docker-control]
    volumes:
      - .:/workspace
    environment:
      PYTHONPATH: /workspace/src
      # Not the host's Docker socket -- the dev-services sidecar above,
      # which routers/devservices.py asks which services are up and to
      # start one, the training run (retrain) among them.
      DEV_SERVICES_URL: http://dev-services:8000
      # The clock the chart refresh's night-time window (see
      # planning-service/app/main.py) is read against: the desk this
      # runs on, not UTC.
      TZ: ${TZ:-America/Chicago}
      # The planner's Claude calls: /api/checkpoint-notes (one per
      # checkpoint with no saved note yet), the briefing's narrative
      # (/api/briefing/narrative), the assistant and the words.
      ANTHROPIC_API_KEY: *anthropic-api-key
      # The map's Google overlay (routers/basemaps): a browser key for
      # Google's Map Tiles API, none by default.
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      # ADS-B Exchange through RapidAPI, the traffic's fallback where
      # adsb.lol turns the planner away (wingtip.traffic): off without it.
      ADSBX_RAPIDAPI_KEY: ${ADSBX_RAPIDAPI_KEY:-}
      # The FAA's SWIM feeds (app.swim): STDDS's terminal radar tracks; off
      # without them. The owner's SCDS subscription's login and queue.
      SWIM_HOST: ${SWIM_HOST:-}
      SWIM_USERNAME: ${SWIM_USERNAME:-}
      SWIM_PASSWORD: ${SWIM_PASSWORD:-}
      SWIM_VPN_STDDS: ${SWIM_VPN_STDDS:-}
      SWIM_QUEUE_STDDS: ${SWIM_QUEUE_STDDS:-}
      SWIM_VPN_FNS: ${SWIM_VPN_FNS:-}
      SWIM_QUEUE_FNS: ${SWIM_QUEUE_FNS:-}
      SWIM_HOST_TFMS: ${SWIM_HOST_TFMS:-}
      SWIM_VPN_TFMS: ${SWIM_VPN_TFMS:-}
      SWIM_QUEUE_TFMS: ${SWIM_QUEUE_TFMS:-}
      # Traces to Jaeger, with the tracing profile up and TRACING=1 (see
      # the jaeger service below); unset, the planner sends none.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${TRACING:+http://jaeger:4318}
      OTEL_SERVICE_NAME: planner
    healthcheck:
      <<: *python-healthcheck
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]

  # Where the local stack's sign-in emails go: an inbox of its own at
  # http://localhost:8025, sent nowhere. A mail host is what makes
  # signing in possible, so the local stack runs the way a deployment
  # does (SignInOptions' SIGN_IN): writes need a session, the training
  # workspace and the developer console need the developer role
  # (APP_DEVELOPER_EMAILS below). PUBLISH_ADDRESS opens the inbox to the
  # Wi-Fi, behind MAILPIT_UI_AUTH's password, for signing in on the phone.
  # Set MAIL_HOST and the rest in .env to send real mail instead.
  mailpit:
    restart: unless-stopped
    image: axllent/mailpit:v1.31.3@sha256:ed9b00c609e77e99c79b93f1178255ebc271868920f2c69a8d166bd5634ed10d
    ports:
      - "${PUBLISH_ADDRESS:-127.0.0.1}:8025:8025"
    environment:
      # The inbox's password, required once PUBLISH_ADDRESS opens it to
      # the network (the inner :? is read only then); none on loopback.
      MP_UI_AUTH: ${PUBLISH_ADDRESS:+${MAILPIT_UI_AUTH:?set MAILPIT_UI_AUTH=<user>:<password> in .env -- the inbox holds sign-in links}}
      # The webapp always authenticates to its mail host
      # (application.yml): take whatever it sends, over the plain
      # connection, since nothing leaves this machine.
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
      # Off unless .env says otherwise: mail for the addresses matching
      # MAILPIT_RELAY_TO (a regular expression, e.g. your own) also goes
      # on to their real inbox through an external SMTP server, so a
      # sign-in link arrives where you read mail. Everything else, the
      # e2e suite's addresses included, stays here. Relaying from the
      # inbox by hand is held to the same addresses, since the inbox is
      # open to the Wi-Fi for the phone. The From is rewritten to
      # the relay account, which iCloud and most providers require.
      MP_SMTP_RELAY_HOST: ${MAILPIT_RELAY_HOST:-}
      MP_SMTP_RELAY_PORT: ${MAILPIT_RELAY_PORT:-587}
      MP_SMTP_RELAY_STARTTLS: "true"
      MP_SMTP_RELAY_AUTH: ${MAILPIT_RELAY_AUTH:-plain}
      MP_SMTP_RELAY_USERNAME: ${MAILPIT_RELAY_USERNAME:-}
      MP_SMTP_RELAY_PASSWORD: ${MAILPIT_RELAY_PASSWORD:-}
      MP_SMTP_RELAY_OVERRIDE_FROM: ${MAILPIT_RELAY_USERNAME:-}
      MP_SMTP_RELAY_MATCHING: ${MAILPIT_RELAY_TO:-}
      MP_SMTP_RELAY_ALLOWED_RECIPIENTS: ${MAILPIT_RELAY_TO:-}

  webapp:
    restart: unless-stopped
    # Context is the repo root: the image builds web/ and bakes the
    # bundle into the jar, so this one service serves both.
    build:
      context: .
      dockerfile: springboot-app/Dockerfile
    # This machine only, like everything else here, unless
    # PUBLISH_ADDRESS (the top of this file) publishes these two on
    # every interface for a phone on the LAN, and the inbox behind a
    # password.
    ports:
      - "${PUBLISH_ADDRESS:-127.0.0.1}:8080:8080"
      # HTTPS, for a phone on the same Wi-Fi: only answers once
      # infra/local-https/make-certs.sh has written the certificate
      # (see HttpsConnectorConfig); otherwise the port is simply closed.
      - "${PUBLISH_ADDRESS:-127.0.0.1}:8443:8443"
    volumes:
      - webapp-cds:/cds
      - ./infra/local-https/certs:/certs:ro
      # The bundle vite builds into web/dist, served in place of the
      # image's where WEB_DIST_MOUNT=/app/static/app (the web-dev
      # profile's web-build keeps it built); otherwise mounted aside,
      # where the webapp never reads it.
      - ./web/dist:${WEB_DIST_MOUNT:-/web-dist}:ro
    depends_on:
      db:
        condition: service_healthy
      planning-service:
        condition: service_healthy
      mailpit:
        condition: service_started
    # Ready means Spring's readiness group (the app and its database)
    # says UP -- 20-30 s after the container starts, during which the
    # pages 404. `docker compose up --wait` holds until this passes, so
    # a test run started after it never meets a half-booted server.
    # bash's /dev/tcp, not curl: the JRE image has neither curl nor
    # wget. And CMD, not CMD-SHELL, which runs dash, where /dev/tcp
    # does not exist.
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/8080 &&
          printf 'GET /actuator/health/readiness HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3 &&
          grep -q '"status":"UP"' <&3
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 90s
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/wingtip
      SPRING_DATASOURCE_USERNAME: wingtip
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-wingtip}
      PLANNER_SERVICE_URL: http://planning-service:8000
      # Traces to Jaeger with TRACING=1, the planner's calls under the
      # webapp's (see the jaeger service); off otherwise.
      MANAGEMENT_TRACING_ENABLED: ${TRACING:-false}
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "1.0"
      MANAGEMENT_OTLP_TRACING_ENDPOINT: http://jaeger:4318/v1/traces
      # Local start-up time, not a production setting. The class-data
      # archive (kept on the webapp-cds volume, see the Dockerfile) lets
      # a restart of the same jar skip the class loading and
      # verification it already did; C1-only JIT starts faster and
      # this proxy never runs hot enough locally to miss C2. The AWS
      # task definition sets neither.
      JAVA_TOOL_OPTIONS: -XX:+AutoCreateSharedArchive -XX:SharedArchiveFile=/cds/webapp.jsa -XX:TieredStopAtLevel=1
      # Sign-in with Google/Apple, optional unlike ANTHROPIC_API_KEY
      # above: `docker compose up` must still work with none of these
      # set (the `oauth` Spring profile stays inactive and OIDC sign-in
      # is just not offered), but real values in the shell or a .env
      # file now actually reach OAuthClientsConfig instead of going
      # nowhere. Apple needs all four of its own to activate -- see that
      # class's own javadoc for what each one is and where it comes from
      # in Apple's developer portal.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      APPLE_TEAM_ID: ${APPLE_TEAM_ID:-}
      APPLE_KEY_ID: ${APPLE_KEY_ID:-}
      APPLE_SERVICES_ID: ${APPLE_SERVICES_ID:-}
      APPLE_PRIVATE_KEY: ${APPLE_PRIVATE_KEY:-}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
      # The magic-link email flow's own sender -- independent of the
      # `oauth` profile above (see application.yml's own comment). The
      # local inbox by default (mailpit above), which accepts any login;
      # a real mail server needs all four set in .env.
      MAIL_HOST: ${MAIL_HOST:-mailpit}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_USERNAME: ${MAIL_USERNAME:-local}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-local}
      MAIL_FROM: ${MAIL_FROM:-no-reply@northflyers.com}
      # Where the emailed sign-in link points. Required once a mail host
      # is set -- the webapp will not start without it -- because a link
      # built from the request's own Host header points wherever the
      # caller said. PHONE_BASE_URL points it at this Mac's LAN address
      # so the link opens on the phone, and is required once
      # PUBLISH_ADDRESS publishes the webapp (the :? inside is read
      # only then).
      APP_PUBLIC_BASE_URL: ${PHONE_BASE_URL:-${PUBLISH_ADDRESS:+${PHONE_BASE_URL:?set PHONE_BASE_URL=https://<this Mac's LAN address>:8443 in .env}}${APP_PUBLIC_BASE_URL:-http://localhost:8080}}
      # Whose pilot is a developer: the address the e2e suite signs in
      # as (web/e2e/auth.setup.ts), and whichever APP_DEVELOPER_EMAILS in
      # .env adds -- yours, comma-separated.
      APP_DEVELOPER_EMAILS: developer@example.com,${APP_DEVELOPER_EMAILS:-}
      # The speed lab's token, for a lab run sent to this stack (SpeedController).
      APP_SPEED_LAB_TOKEN: ${APP_SPEED_LAB_TOKEN:-}
      # The emailed link's throttle, per address and per caller, loose
      # here: a Playwright run asks for a handful, and a morning of runs
      # would meet the deployed limits of 5 and 20 an hour.
      APP_MAGIC_LINK_PER_ADDRESS_PER_HOUR: "60"
      APP_MAGIC_LINK_PER_CLIENT_PER_HOUR: "200"
      # The paid calls' daily allowance (narratives, generating notes),
      # loose here for the same reason: the e2e suite asks for notes on
      # most runs, though for a collected route they are already written
      # and cost nothing. Deployed, 40 a day each per pilot.
      APP_PAID_CALLS_PER_DAY: "500"
      # The HTTPS port for a phone on the same Wi-Fi (HttpsConnectorConfig):
      # the certificate infra/local-https/make-certs.sh writes, read
      # only once that file exists. HSTS off: this machine's plain port
      # must keep working after the HTTPS one has been used once.
      # Opened with the webapp's default password, which is the one
      # make-certs.sh writes it with.
      APP_HTTPS_KEYSTORE: ${APP_HTTPS_KEYSTORE:-/certs/webapp.p12}
      APP_HSTS: "false"

  # Front-end work without the image: vite in watch mode keeping web/dist
  # built as the source changes, which the webapp serves where
  # WEB_DIST_MOUNT=/app/static/app (above) -- read per request
  # (APP_STATIC_LOCATION, see WebMvcConfig), so a build is served the
  # moment vite has written it, no image, no restart. A saved file is
  # rebuilt in a second or two (`docker compose logs -f web-build` shows
  # each build). The image build (the bundle, then the jar) and the JVM's
  # start were the minute and a half between a change and a test. `npm run
  # types` first when an API schema changed. The image is still what
  # ships; CI builds its own. Behind the `web-dev` profile:
  # COMPOSE_PROFILES=web-dev in .env, or `--profile web-dev`.
  web-build:
    profiles: ["web-dev"]
    image: node:26-slim@sha256:5adad64f9a1fca2d51972caa65983634c8a774eb300d72b20f7f2a0f60368072
    working_dir: /w
    volumes:
      - ./web:/w
    # VITE_KEEP_OUTDIR (read by vite.config.ts): watch mode would
    # otherwise clear the directory the webapp is serving from at every
    # rebuild, and a page loading that instant would get nothing.
    environment:
      VITE_KEEP_OUTDIR: "1"
    command: ["npx", "--no-install", "vite", "build", "--watch", "--outDir", "dist"]
    restart: unless-stopped

  # Traces of a request from the webapp down through the planner to every
  # source it asks (aviationweather.gov, the FAA, the USGS),
  # in Jaeger's UI on http://localhost:16686:
  #
  #   TRACING=true docker compose --profile tracing up -d jaeger webapp planning-service
  #
  # Without TRACING neither service sends a span.
  jaeger:
    profiles: ["tracing"]
    image: jaegertracing/jaeger:2.11.0@sha256:b585df1b6299bbbd16bf7c679da30389349736e4b6bc8f4f500142a75bf26ca8
    ports:
      - "127.0.0.1:16686:16686"
    restart: unless-stopped

networks:
  # dev-services and planning-service only (see dev-services above).
  # Internal: nothing on it needs to reach outside the host.
  docker-control:
    internal: true

volumes:
  pgdata_pg18:
  # webapp's JVM class-data archive -- see JAVA_TOOL_OPTIONS on webapp.
  webapp-cds:
