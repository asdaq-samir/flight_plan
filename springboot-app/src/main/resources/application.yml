spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/vfr_route}
    username: ${SPRING_DATASOURCE_USERNAME:vfr}
    password: ${SPRING_DATASOURCE_PASSWORD:vfr}
  jpa:
    # ddl-auto: update is a stub-pass simplification (auto-creates/updates
    # the routes table from the entity) -- a real deployment would use
    # Flyway/Liquibase migrations instead, deferred until this stops being
    # a stub.
    hibernate:
      ddl-auto: update
    open-in-view: false

model-service:
  base-url: ${MODEL_SERVICE_URL:http://localhost:8000}

server:
  port: 8080
