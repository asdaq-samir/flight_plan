spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/vfr_route}
    username: ${SPRING_DATASOURCE_USERNAME:vfr}
    password: ${SPRING_DATASOURCE_PASSWORD:vfr}
  jpa:
    # Flyway (db/migration/) owns schema now -- validate just checks the
    # entity mapping still matches what Flyway created, it doesn't touch
    # the schema itself.
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

# Sign-in with Google lives in the `oauth` profile
# (application-oauth.yml), not here. Spring Boot validates the client
# registration eagerly and refuses to start on an empty client id, so
# declaring it unconditionally would make credentials a requirement for
# running the app at all. Absent the profile, SecurityConfig registers no
# login and the pilot-scoped endpoints answer 401 -- closed, not open.

# The Python planner: chart vision, course, checkpoints and nav log.
# Reached only through this service, which is what lets it publish no port
# of its own.
planner-service:
  base-url: ${PLANNER_SERVICE_URL:http://localhost:8084}

model-service:
  base-url: ${MODEL_SERVICE_URL:http://localhost:8000}
  # Set only on AWS (see WebappTaskDefinition in
  # infra/cloudformation/template.yaml) -- its presence is what switches
  # ModelServiceClient from a plain HTTP call to SageMaker Runtime's
  # InvokeEndpoint API. Empty locally, so base-url above is what's used.
  sagemaker-endpoint-name: ${SAGEMAKER_ENDPOINT_NAME:}

server:
  port: 8080
  # Trusts X-Forwarded-Proto/-Host/-Port from the ALB doing TLS
  # termination, so the app sees itself as HTTPS -- without this,
  # Spring Security's HSTS header writer (only fires on a request it
  # considers secure) would silently never send HSTS in production. A
  # no-op locally: nothing sends those headers without a proxy in front.
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      # /actuator/health/liveness + /actuator/health/readiness -- Fargate/
      # ALB target-group health checks should hit /readiness (fails if the
      # DB connection pool can't reach RDS); Kubernetes-style liveness/
      # readiness split, but works the same way for ECS.
      probes:
        enabled: true
      group:
        # Spring Boot's own readiness group defaults to readinessState
        # alone -- an app-process-is-up signal, not a dependency check.
        # "db" is the auto-configured DataSource health contributor;
        # without adding it here, a pool that can't reach RDS would
        # still report ready, defeating the ALB check's whole purpose.
        readiness:
          include: readinessState,db
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
