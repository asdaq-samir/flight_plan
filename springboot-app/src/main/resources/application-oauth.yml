# Sign-in with Google. Activate with SPRING_PROFILES_ACTIVE=oauth once
# GOOGLE_CLIENT_ID and GOOGLE_CLIENT_SECRET are set.
#
# Separate from application.yml because Spring Boot validates this
# registration as it starts and refuses an empty client id -- so keeping
# it here is what lets the app run, and its tests pass, without
# credentials, while still failing closed: with no registration there is
# no way to sign in, and everything pilot-scoped answers 401.
#
# The redirect URI to register with Google is
# {baseUrl}/login/oauth2/code/google -- http://localhost:8080/login/oauth2/code/google
# in development.
spring:
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: openid,email,profile
