# Opt in to using the planner from a phone on the same Wi-Fi.
#
#   docker compose -f docker-compose.yml -f docker-compose.phone.yml up -d
#
# docker-compose.yml publishes webapp on this machine's loopback only.
# This file publishes its two ports on every interface, so the phone can
# reach https://<this Mac's LAN address>:8443 (see infra/local-https for
# the certificate it needs).
#
# Read this before using it: with no sign-in configured, which is the
# local default, every planner write is open to anyone on the network --
# picks, notes, corridor builds, a retrain, a chart refresh -- because
# docker-compose.yml sets APP_OPEN_WRITES for the local stack. That is
# the trade this file makes: a network you trust, for as long as you
# are testing on the phone. The plain `docker compose up -d` puts the
# loopback-only binding back.
#
# Unlike docker-compose.lan.yml this opens nothing but webapp: no
# Jupyter, no Airflow, no direct planner port.
services:
  webapp:
    ports: !override
      - "8080:8080"
      - "8443:8443"
