# Opt in to using the planner from a phone on the same Wi-Fi.
#
#   docker compose -f docker-compose.yml -f docker-compose.phone.yml up -d
#
# docker-compose.yml publishes webapp and the local sign-in inbox
# (mailpit) on this machine's loopback only. This file publishes webapp's
# two ports on every interface, so the phone can reach
# https://<this Mac's LAN address>:8443 (see infra/local-https for the
# certificate it needs), points the emailed sign-in link there, and
# opens the inbox to the Wi-Fi so the phone can read it. Two settings in
# .env, both required:
#
#   PHONE_BASE_URL=https://<this Mac's LAN address>:8443
#   MAILPIT_UI_AUTH=<user>:<password>
#
# The password is not a formality: the inbox holds sign-in links, and
# the developer's is among them. With it, the rest of the planner is as
# closed from the Wi-Fi as it is anywhere -- writes need a session and
# the developer's workspace needs the role. The plain
# `docker compose up -d` puts the loopback-only bindings back.
#
# Unlike docker-compose.lan.yml this opens nothing else: no Jupyter, no
# Airflow, no direct planner port.
services:
  webapp:
    ports: !override
      - "8080:8080"
      - "8443:8443"
    environment:
      APP_PUBLIC_BASE_URL: ${PHONE_BASE_URL:?set PHONE_BASE_URL=https://<this Mac's LAN address>:8443 in .env}
  mailpit:
    ports: !override
      - "8025:8025"
    environment:
      MP_UI_AUTH: ${MAILPIT_UI_AUTH:?set MAILPIT_UI_AUTH=<user>:<password> in .env -- the inbox holds sign-in links}
