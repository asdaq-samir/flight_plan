<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Wingtip Maps' app icon, full bleed (the platform rounds it): a
       piece of sectional chart (lowland, a lake, a terrain band, a
       road) with the mark at its centre, a high-wing airplane seen from
       above in the dashed airspace ring (the owner's pick A, 2026-11-04).
       No double hyphen in a comment: XML forbids it, and an image loader
       refuses the file. -->
  <rect width="64" height="64" fill="#D7E8C6"/>
  <path d="M0 0 H30 C26 8 18 13 9 15 C5 16 2 18 0 21 Z" fill="#A9CDEB"/>
  <path d="M38 64 C42 54 50 49 64 47 V64 Z" fill="#E9DDBF"/>
  <path d="M-2 50 C14 44 22 52 34 46 S54 30 66 32" fill="none" stroke="#FFFFFF" stroke-width="1.6" opacity="0.9"/>
  <circle cx="32" cy="32" r="21" fill="none" stroke="#A3266F" stroke-width="3.2" stroke-dasharray="7.6 3.4" transform="rotate(-100.4 32 32)"/>
  <!-- The airplane twice: white and wider under it, as a halo off the chart. -->
  <g transform="translate(32 32.5) scale(0.64) translate(-32 -31.5)" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="7" stroke-linejoin="round">
    <path d="M32 12 C34.2 12 35 14.5 35 18 L34.2 44 L33 51 L31 51 L29.8 44 L29 18 C29 14.5 29.8 12 32 12 Z"/>
    <rect x="9" y="23" width="46" height="6.5" rx="3"/>
    <rect x="23" y="45" width="18" height="4.5" rx="2.2"/>
  </g>
  <g transform="translate(32 32.5) scale(0.64) translate(-32 -31.5)" fill="#14284B" stroke="#14284B" stroke-width="1.5" stroke-linejoin="round">
    <path d="M32 12 C34.2 12 35 14.5 35 18 L34.2 44 L33 51 L31 51 L29.8 44 L29 18 C29 14.5 29.8 12 32 12 Z"/>
    <rect x="9" y="23" width="46" height="6.5" rx="3"/>
    <rect x="23" y="45" width="18" height="4.5" rx="2.2"/>
  </g>
</svg>
