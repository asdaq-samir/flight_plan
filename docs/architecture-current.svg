  <line x1="1010" y1="202" x2="1010" y2="240" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="1010" y1="292" x2="1010" y2="330" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 890 176 H 850 V 351 H 890" fill="none" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="815" y="266" font-size="10" fill="#555" transform="rotate(-90 815 266)">pgvector memory</text>

  <!-- nav-log-agent / crewai-agent -> model-service -->
  <path d="M 890 176 H 820 V 266 H 790" fill="none" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 890 266 H 790" fill="none" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ================= Dev group ================= -->
  <rect x="40" y="540" width="380" height="110" rx="10" fill="#f0f0f0" stroke="#888" stroke-width="1.5" stroke-dasharray="6 4"/>
