  <rect x="70" y="580" width="320" height="52" rx="6" fill="#ffffff" stroke="#888" stroke-width="1.5"/>
  <text x="230" y="601" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">ml</text>
  <text x="230" y="619" text-anchor="middle" font-size="11" fill="#555">Jupyter · notebooks 01-08</text>

