[tool.pytest.ini_options]
# Same pythonpath pattern as the root project's own pyproject.toml: "."
# (this directory) so `from app.main import app` resolves the same way
# the Dockerfile's WORKDIR does, and "../src" so `from wingtip import ...`
# (app/main.py's own import) resolves the way it does inside the
# container (PYTHONPATH=/workspace/src).
pythonpath = [".", "../src"]
# The root pyproject.toml is not read from here (this file is the rootdir), so
# its settings are repeated: no cache of the last run, unknown marks are errors.
addopts = "-p no:cacheprovider --strict-markers"
markers = [
    "order_dependent: passes only in the order it was written in; kept out of the random order (pytest_guards.py), and listed to be fixed",
]
