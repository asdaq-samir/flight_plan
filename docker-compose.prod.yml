# The production stack: one EC2 server behind CloudFront
# (infra/cloudformation/template.yaml, docs/README-AWS.md). A file of its
# own rather than an overlay on docker-compose.yml, which is the
# development stack -- source mounted, Mailpit, Airflow, the agents' dev
# ports -- none of which a production server should inherit by accident.
#
# What is not here, on purpose:
# - Mailpit: sign-in mail goes through Amazon SES (MAIL_* below).
# - crewai-agent: the same briefing nav-log-agent writes.
# - Airflow and the pipelines: retraining runs on the owner's machine.
# - web-build and dev-services: development tools.
# - Chart tile drawing: CHARTS_AUTO_REFRESH=0. A scheduled Fargate Spot
#   task draws each 56-day cycle once and publishes it to S3, and the
#   map fetches tiles from CloudFront (CHART_TILES_URL), so this 4 GB
#   server never draws the whole country.
#
# Run on the server, from /srv/flight_plan with its .env beside this
# file (infra/server/env.example lists every key):
#   docker compose -f docker-compose.prod.yml up -d

# Every service's log to CloudWatch (the stack's ServerLogGroup), a
# stream per container: the server's own disk keeps none, and what went
# wrong is read in the console or with `aws logs tail`.
x-restart: &restart
  restart: unless-stopped
  logging:
    driver: awslogs
    options:
      # deploy.sh writes both; the rehearsal's overlay logs locally instead,
      # so they are not demanded here.
      awslogs-region: ${AWS_REGION:-}
      awslogs-group: ${LOG_GROUP:-}
      # A CloudWatch or IAM fault then drops log lines; the default,
      # blocking, would fail a container's start.
      mode: non-blocking
      max-buffer-size: 4m
      tag: "{{.Name}}"

services:
  # TLS for the origin, and the only door in: CloudFront reaches the
  # server over HTTPS, with a secret header Caddy checks (the security
  # group admits only CloudFront's addresses as well).
  caddy:
    <<: *restart
    image: caddy:2.10-alpine
    ports: ["80:80", "443:443"]
    environment:
      ORIGIN_HOST: ${ORIGIN_HOST}
      PUBLIC_HOST: ${PUBLIC_HOST}
      ORIGIN_SECRET: ${ORIGIN_SECRET:?set ORIGIN_SECRET in .env}
    volumes:
      - ./infra/server/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on: [webapp]

  db:
    <<: *restart
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_DB: vfr_route
      POSTGRES_USER: vfr
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vfr -d vfr_route"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - /srv/flight_plan/postgres:/var/lib/postgresql

  model-service:
    <<: *restart
    image: ${IMAGE_REGISTRY}/model-service:${IMAGE_TAG:-latest}
    volumes:
      - /srv/flight_plan/data/models/chart/current:/opt/ml/chart-model:ro
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ping')"]
      interval: 10s
      timeout: 5s
      retries: 12

  planning-service:
    <<: *restart
    image: ${IMAGE_REGISTRY}/planning-service:${IMAGE_TAG:-latest}
    # No access log: its lines carry each request's query, and the
    # Nearest list asks with the pilot's own position, which would then
    # sit in CloudWatch for a month (docs/privacy-inventory.md). The
    # planner's own log says what it did.
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--no-access-log"]
    # FAA data, the corridor's chart sheets for reading checkpoints, and
    # the planner's caches: on the server's disk, kept across deploys.
    volumes:
      - /srv/flight_plan/data:/workspace/data
      # The stock aircraft profiles are the repository's, so they follow
      # each deploy; the image has none, and the data folder above is the
      # server's own.
      - ./data/aircraft:/workspace/data/aircraft:ro
    environment:
      MODEL_SERVICE_URL: http://model-service:8000
      NAV_LOG_AGENT_URL: http://nav-log-agent:8000
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      CHARTS_AUTO_REFRESH: "0"
      CHART_TILES_URL: https://${PUBLIC_HOST}/tiles
      TZ: America/Chicago
    depends_on:
      model-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 10s
      timeout: 5s
      retries: 60

  nav-log-agent:
    <<: *restart
    image: ${IMAGE_REGISTRY}/nav-log-agent:${IMAGE_TAG:-latest}
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      # Generated by the stack (AgentKeySecret): the agent refuses to
      # start without one rather than serve its MCP endpoint open.
      NAV_LOG_AGENT_API_KEY: ${NAV_LOG_AGENT_API_KEY:?set NAV_LOG_AGENT_API_KEY in .env}
      PLANNING_SERVICE_URL: http://planning-service:8000
      DATABASE_URL: postgresql://vfr:${POSTGRES_PASSWORD}@db:5432/vfr_route
    depends_on:
      db:
        condition: service_healthy
      planning-service:
        condition: service_healthy

  webapp:
    <<: *restart
    image: ${IMAGE_REGISTRY}/webapp:${IMAGE_TAG:-latest}
    depends_on:
      db:
        condition: service_healthy
      planning-service:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/8080 &&
          printf 'GET /actuator/health/readiness HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3 &&
          grep -q '"status":"UP"' <&3
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/vfr_route
      SPRING_DATASOURCE_USERNAME: vfr
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      PLANNER_SERVICE_URL: http://planning-service:8000
      NAV_LOG_AGENT_URL: http://nav-log-agent:8000
      NAV_LOG_AGENT_API_KEY: ${NAV_LOG_AGENT_API_KEY}
      # The webapp is reached only through Caddy over the server's own
      # network: plain HTTP inside, TLS at Caddy and at CloudFront.
      APP_PUBLIC_BASE_URL: https://${PUBLIC_HOST}
      APP_HSTS: "true"
      APP_DEVELOPER_EMAILS: ${APP_DEVELOPER_EMAILS:-}
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_FROM: ${MAIL_FROM}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      APPLE_TEAM_ID: ${APPLE_TEAM_ID:-}
      APPLE_KEY_ID: ${APPLE_KEY_ID:-}
      APPLE_SERVICES_ID: ${APPLE_SERVICES_ID:-}
      APPLE_PRIVATE_KEY: ${APPLE_PRIVATE_KEY:-}
      # "oauth" turns on Sign in with Google and Apple (OAuthClientsConfig).
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=40 -XX:TieredStopAtLevel=1

volumes:
  caddy-data:
