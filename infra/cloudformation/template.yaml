AWSTemplateFormatVersion: "2010-09-09"
Description: >
  VFR Nav Log Platform -- target AWS architecture from docs/architecture-aws.svg.
  Deploys into an existing VPC (bring-your-own-network, a common constraint in
  real orgs, and it keeps this template focused on the application-level
  resources) -- ECS Fargate (Spring Boot API, nav-log-agent, crewai-agent,
  and a self-hosted Airflow) behind an ALB, RDS PostgreSQL, a SageMaker
  Endpoint for the trained model, and the Go Lambda "Retrain Trigger" behind
  an HTTP API. Not yet deployed anywhere -- see docs/README-AWS.md's
  "Infrastructure as code" section for what has and hasn't been verified
  about this template specifically.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Networking (existing VPC)
        Parameters:
          - VpcId
          - PublicSubnetIds
          - PrivateSubnetIds
      - Label:
          default: Container images (already pushed to ECR by CI -- see .github/workflows/ci.yml)
        Parameters:
          - WebappImageUri
          - PlanningServiceImageUri
          - ModelServiceImageUri
          - NavLogAgentImageUri
          - CrewaiAgentImageUri
          - AirflowImageUri
      - Label:
          default: Database
        Parameters:
          - DBInstanceClass
          - DBAllocatedStorageGb
          - DBName
          - DBUsername
      - Label:
          default: SageMaker
        Parameters:
          - ModelArtifactS3Uri
          - SageMakerInstanceType
      - Label:
          default: Gen AI (nav-log-agent / crewai-agent)
        Parameters:
          - AnthropicApiKeySecretArn
          - NavLogAgentApiKeySecretArn
      - Label:
          default: Pipeline data (read/written by SageMaker Processing/Training Jobs)
        Parameters:
          - DataS3BucketName
      - Label:
          default: Retrain Trigger (Lambda)
        Parameters:
          - LambdaCodeS3Bucket
          - LambdaCodeS3Key
          - AirflowDagId
          - AirflowCredentialsSecretArn
      - Label:
          default: Public ingress (optional -- omit both to skip HTTPS/custom domain)
        Parameters:
          - DomainName
          - CertificateArn

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
  PublicSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: For the ALB and the Lambda's API Gateway (HTTP API is regional, not VPC-attached, but listed for symmetry/clarity of intent).
  PrivateSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: For the ECS service, RDS instance, and the Lambda's VPC config (so it can reach Airflow privately).

  WebappImageUri:
    Type: String
    Description: Full ECR image URI for webapp, e.g. <account>.dkr.ecr.<region>.amazonaws.com/<repo>/webapp:latest
  PlanningServiceImageUri:
    Type: String
    Description: Full ECR image URI for planning-service -- chart vision, checkpoint selection and the nav log. Internal only; webapp proxies to it and nothing else reaches it.
  ModelServiceImageUri:
    Type: String
    Description: Full ECR image URI for model-service -- this is what SageMaker actually runs, see ModelArtifactS3Uri below.
  NavLogAgentImageUri:
    Type: String
    Description: Full ECR image URI for nav-log-agent.
  CrewaiAgentImageUri:
    Type: String
    Description: Full ECR image URI for crewai-agent -- registered as a standalone task definition, not a standing service; run on demand with `aws ecs run-task`, matching its local one-shot CLI role.
  AirflowImageUri:
    Type: String
    Description: Full ECR image URI for the AWS-hosted Airflow image (docker/Dockerfile.airflow.aws, not docker/Dockerfile.airflow -- see that file's header comment for why they differ).

  DBInstanceClass:
    Type: String
    Default: db.t4g.micro
  DBAllocatedStorageGb:
    Type: Number
    Default: 20
  DBName:
    Type: String
    Default: vfr_route
  DBUsername:
    Type: String
    Default: vfr

  ModelArtifactS3Uri:
    Type: String
    Description: s3://bucket/key to the trained model.tar.gz -- produced by pipeline-training's retrain(), once one exists (see docs/README.md's Status section on why none does yet).
  SageMakerInstanceType:
    Type: String
    Default: ml.t2.medium

  AnthropicApiKeySecretArn:
    Type: String
    Description: ARN of an existing Secrets Manager secret holding the raw Anthropic API key as its secret value (plaintext, not JSON) -- used by nav-log-agent and crewai-agent.
  NavLogAgentApiKeySecretArn:
    Type: String
    Description: ARN of an existing Secrets Manager secret holding the shared bearer token nav-log-agent's own MCP endpoint checks (nav-log-agent/app/main.py's BearerAuthMiddleware) -- the ALB routes /mcp/* to it with no auth of its own in front, so this is the only thing stopping an unauthenticated caller from running billed Claude calls and writing to the briefing store.

  DataS3BucketName:
    Type: String
    Description: S3 bucket holding pipeline data (candidates/features/labels in, trained models out) -- read and written by the SageMaker Processing/Training Jobs Airflow launches (airflow/dags/vfr_pipeline_aws_dag.py). Can be the same bucket ModelArtifactS3Uri's model.tar.gz lives in.

  LambdaCodeS3Bucket:
    Type: String
    Description: Where infra/lambda-retrain-trigger's compiled `bootstrap` binary (zipped) has been uploaded -- this template doesn't build/upload it, see that directory's own notes.
  LambdaCodeS3Key:
    Type: String
    Default: retrain-trigger/bootstrap.zip
  AirflowDagId:
    Type: String
    Default: vfr_pipeline_aws
  AirflowCredentialsSecretArn:
    Type: String
    Description: 'ARN of an existing Secrets Manager secret shaped {"username": "...", "password": "..."} for Airflow''s REST API basic auth.'

  DomainName:
    Type: String
    Default: ""
    Description: e.g. northflyers.com -- leave blank to skip the Route53 record and serve over the ALB's own DNS name.
  CertificateArn:
    Type: String
    Default: ""
    Description: ACM certificate ARN for HTTPS -- leave blank to serve HTTP only on the ALB (fine for initial testing, not for real public traffic).

Conditions:
  HasCertificate: !Not [!Equals [!Ref CertificateArn, ""]]
  HasDomainName: !Not [!Equals [!Ref DomainName, ""]]

Resources:
  # ---------------------------------------------------------------------
  # Security groups
  # ---------------------------------------------------------------------
  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: ALB -- public HTTP/HTTPS ingress
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - !If
          - HasCertificate
          - IpProtocol: tcp
            FromPort: 443
            ToPort: 443
            CidrIp: 0.0.0.0/0
          - !Ref AWS::NoValue

  EcsServiceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: webapp Fargate tasks -- only reachable from the ALB
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          SourceSecurityGroupId: !Ref AlbSecurityGroup

  NavLogAgentSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: nav-log-agent Fargate task -- reachable from the ALB (path-based /mcp/* route, see AlbMcpListenerRule)
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8000
          ToPort: 8000
          SourceSecurityGroupId: !Ref AlbSecurityGroup

  PlanningServiceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: planning-service Fargate tasks -- reachable only from webapp, never the ALB
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        # No ALB rule on purpose. This service is the browser's data source
        # but never its destination: the front end calls webapp, which
        # proxies to here (PlannerProxyController). Same reasoning as
        # RdsSecurityGroup below -- reachable from the one thing that
        # needs it, and nothing else.
        - IpProtocol: tcp
          FromPort: 8000
          ToPort: 8000
          SourceSecurityGroupId: !Ref EcsServiceSecurityGroup

  CrewaiAgentSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: crewai-agent task -- one-shot CLI via aws ecs run-task, outbound only, no ingress needed
      VpcId: !Ref VpcId

  AirflowSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Airflow Fargate task -- reachable only from the Retrain Trigger Lambda
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          SourceSecurityGroupId: !Ref LambdaSecurityGroup

  AirflowEfsSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Airflow EFS-backed metadata volume -- reachable only from the Airflow task
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 2049
          ToPort: 2049
          SourceSecurityGroupId: !Ref AirflowSecurityGroup

  RdsSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: RDS PostgreSQL -- only reachable from webapp and nav-log-agent
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref EcsServiceSecurityGroup
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref NavLogAgentSecurityGroup

  LambdaSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Retrain Trigger Lambda -- outbound only, to reach Airflow privately
      VpcId: !Ref VpcId

  # ---------------------------------------------------------------------
  # IAM
  # ---------------------------------------------------------------------
  EcsTaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Shared by every ECS task definition in this stack -- pulls images from ECR (managed policy) and reads the startup secrets each container needs.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: ReadStartupSecrets
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  - !GetAtt Database.MasterUserSecret.SecretArn
                  - !Ref AnthropicApiKeySecretArn
                  - !Ref NavLogAgentApiKeySecretArn

  EcsTaskRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Assumed by the running webapp container itself -- needs to call the SageMaker endpoint.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: InvokeSageMakerEndpoint
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: sagemaker:InvokeEndpoint
                Resource: !Ref SageMakerEndpoint

  GenAiTaskRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Assumed by nav-log-agent and crewai-agent -- both call the SageMaker endpoint for checkpoints, same as webapp (see model_client.py in each).
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: InvokeSageMakerEndpoint
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: sagemaker:InvokeEndpoint
                Resource: !Ref SageMakerEndpoint

  SageMakerJobRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Passed to SageMaker Processing/Training Jobs by Airflow's SageMakerProcessingOperator/SageMakerTrainingOperator (airflow/dags/vfr_pipeline_aws_dag.py) -- what each job runs as, distinct from AirflowTaskRole below, which is what launches them.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: sagemaker.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: PipelineDataAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:ListBucket
                Resource:
                  - !Sub "arn:aws:s3:::${DataS3BucketName}"
                  - !Sub "arn:aws:s3:::${DataS3BucketName}/*"
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/sagemaker/*"

  AirflowTaskRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Assumed by the running Airflow container -- launches/monitors SageMaker Processing and Training Jobs, and mounts its EFS-backed metadata volume.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: RunSageMakerJobs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                # CreateProcessingJob/CreateTrainingJob don't support
                # resource-level restriction -- job names are chosen at
                # creation time (see the run_id-suffixed names in
                # vfr_pipeline_aws_dag.py), so "*" is what AWS itself
                # requires here, not a broadened grant of convenience.
                Action:
                  - sagemaker:CreateProcessingJob
                  - sagemaker:DescribeProcessingJob
                  - sagemaker:StopProcessingJob
                  - sagemaker:CreateTrainingJob
                  - sagemaker:DescribeTrainingJob
                  - sagemaker:StopTrainingJob
                  - sagemaker:ListTags
                Resource: "*"
              - Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt SageMakerJobRole.Arn
        - PolicyName: MountEfs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - elasticfilesystem:ClientMount
                  - elasticfilesystem:ClientWrite
                Resource: !GetAtt AirflowEfs.Arn
        - PolicyName: AllowExecuteCommand
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                # Required for AirflowService's EnableExecuteCommand above --
                # this is the standard, AWS-documented policy shape for it,
                # not scoped down further because the SSM data channel APIs
                # themselves don't support resource-level restriction.
                Action:
                  - ssmmessages:CreateControlChannel
                  - ssmmessages:CreateDataChannel
                  - ssmmessages:OpenControlChannel
                  - ssmmessages:OpenDataChannel
                Resource: "*"

  SageMakerExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: sagemaker.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ReadModelArtifact
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub
                  - "arn:aws:s3:::${BucketAndKey}"
                  - BucketAndKey: !Select [1, !Split ["s3://", !Ref ModelArtifactS3Uri]]

  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
      Policies:
        - PolicyName: ReadAirflowSecret
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref AirflowCredentialsSecretArn

  # ---------------------------------------------------------------------
  # Database -- RDS-managed master password (Secrets Manager), same
  # Postgres 16 + pgvector setup as the local `db` service.
  # ---------------------------------------------------------------------
  Database:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Metadata:
      cfn-lint:
        config:
          ignore_checks:
            - W3691 # EngineVersion below is a moving target (RDS deprecates old
              # minor versions on its own schedule); no live AWS access from
              # this environment to check the actual current list. Verify with
              # `aws rds describe-db-engine-versions --engine postgres
              # --query "DBEngineVersions[].EngineVersion"` before first deploy
              # and bump this if needed -- don't trust it's still valid as-is.
    Properties:
      Engine: postgres
      EngineVersion: "17.4"
      DBInstanceClass: !Ref DBInstanceClass
      AllocatedStorage: !Ref DBAllocatedStorageGb
      DBName: !Ref DBName
      MasterUsername: !Ref DBUsername
      ManageMasterUserPassword: true
      VPCSecurityGroups: [!Ref RdsSecurityGroup]
      DBSubnetGroupName: !Ref DbSubnetGroup
      PubliclyAccessible: false
      BackupRetentionPeriod: 7

  DbSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Private subnets for RDS
      SubnetIds: !Ref PrivateSubnetIds

  # ---------------------------------------------------------------------
  # Service discovery -- gives Airflow a stable, predictable internal DNS
  # name (airflow.vfr-route.internal) so RetrainTriggerFunction below has
  # a real address to call, without a manually-supplied URL parameter.
  # ---------------------------------------------------------------------
  ServiceDiscoveryNamespace:
    Type: AWS::ServiceDiscovery::PrivateDnsNamespace
    Properties:
      Name: vfr-route.internal
      Vpc: !Ref VpcId

  AirflowServiceDiscoveryService:
    Type: AWS::ServiceDiscovery::Service
    Properties:
      Name: airflow
      NamespaceId: !Ref ServiceDiscoveryNamespace
      DnsConfig:
        DnsRecords:
          - Type: A
            TTL: 10
      HealthCheckCustomConfig:
        FailureThreshold: 1

  PlanningServiceDiscoveryService:
    Type: AWS::ServiceDiscovery::Service
    Properties:
      Name: planning-service
      NamespaceId: !Ref ServiceDiscoveryNamespace
      DnsConfig:
        DnsRecords:
          - Type: A
            TTL: 10
      HealthCheckCustomConfig:
        FailureThreshold: 1
      # Resolves as planning-service.vfr-route.internal, which is what
      # webapp's planner-service.base-url is set to below -- the AWS
      # counterpart of the Compose hostname it defaults to locally.

  # ---------------------------------------------------------------------
  # EFS -- Airflow's metadata database (SQLite, same as `standalone` mode
  # locally) needs to survive a Fargate task restart, which ephemeral task
  # storage doesn't. One task (DesiredCount: 1 on AirflowService below), so
  # SQLite-on-EFS is a deliberately simple fit here, not a general-purpose
  # multi-writer setup.
  # ---------------------------------------------------------------------
  AirflowEfs:
    Type: AWS::EFS::FileSystem
    Properties:
      Encrypted: true
      FileSystemTags:
        - Key: Name
          Value: vfr-route-airflow

  # Assumes exactly two private subnets, matching the "at least two
  # Availability Zones" guidance in docs/README-AWS.md's deploy runbook.
  AirflowEfsMountTargetA:
    Type: AWS::EFS::MountTarget
    Properties:
      FileSystemId: !Ref AirflowEfs
      SubnetId: !Select [0, !Ref PrivateSubnetIds]
      SecurityGroups: [!Ref AirflowEfsSecurityGroup]

  AirflowEfsMountTargetB:
    Type: AWS::EFS::MountTarget
    Properties:
      FileSystemId: !Ref AirflowEfs
      SubnetId: !Select [1, !Ref PrivateSubnetIds]
      SecurityGroups: [!Ref AirflowEfsSecurityGroup]

  AirflowEfsAccessPoint:
    Type: AWS::EFS::AccessPoint
    Properties:
      FileSystemId: !Ref AirflowEfs
      # Matches the `airflow` user the apache/airflow base image itself
      # runs as (UID/GID 50000), so files EFS creates are owned by the
      # same user the container's own process runs as.
      PosixUser:
        Uid: "50000"
        Gid: "0"
      RootDirectory:
        Path: /airflow
        CreationInfo:
          OwnerUid: "50000"
          OwnerGid: "0"
          Permissions: "0755"

  # ---------------------------------------------------------------------
  # ECS Fargate -- webapp (Spring Boot API)
  # ---------------------------------------------------------------------
  EcsCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: vfr-route

  WebappLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /ecs/vfr-route-webapp
      RetentionInDays: 30

  WebappTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: vfr-route-webapp
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: "512"
      Memory: "1024"
      ExecutionRoleArn: !GetAtt EcsTaskExecutionRole.Arn
      TaskRoleArn: !GetAtt EcsTaskRole.Arn
      ContainerDefinitions:
        - Name: webapp
          Image: !Ref WebappImageUri
          PortMappings:
            - ContainerPort: 8080
          Environment:
            - Name: SPRING_DATASOURCE_URL
              Value: !Sub "jdbc:postgresql://${Database.Endpoint.Address}:${Database.Endpoint.Port}/${DBName}"
            - Name: SPRING_DATASOURCE_USERNAME
              Value: !Ref DBUsername
            - Name: SAGEMAKER_ENDPOINT_NAME
              Value: !GetAtt SageMakerEndpoint.EndpointName
              # Presence alone switches ModelServiceClient.java from a plain
              # HTTP call to SageMaker Runtime's InvokeEndpoint API -- see
              # that class. Unset locally, so local dev is unaffected.
            - Name: PLANNER_SERVICE_URL
              Value: http://planning-service.vfr-route.internal:8000
              # The name application.yml reads -- planner-service.base-url
              # is set from ${PLANNER_SERVICE_URL}. Without this the proxy
              # would fall back to localhost:8084, which on Fargate is the
              # webapp container talking to itself.
          Secrets:
            - Name: SPRING_DATASOURCE_PASSWORD
              ValueFrom: !Sub "${Database.MasterUserSecret.SecretArn}:password::"
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref WebappLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: webapp

  WebappService:
    Type: AWS::ECS::Service
    DependsOn: AlbListener
    Properties:
      Cluster: !Ref EcsCluster
      TaskDefinition: !Ref WebappTaskDefinition
      DesiredCount: 1
      LaunchType: FARGATE
      NetworkConfiguration:
        AwsvpcConfiguration:
          Subnets: !Ref PrivateSubnetIds
          SecurityGroups: [!Ref EcsServiceSecurityGroup]
          AssignPublicIp: DISABLED
      LoadBalancers:
        - ContainerName: webapp
          ContainerPort: 8080
          TargetGroupArn: !Ref AlbTargetGroup
      HealthCheckGracePeriodSeconds: 60

  # ---------------------------------------------------------------------
  # ECS Fargate -- planning-service (chart vision, checkpoints, nav log)
  #
  # Fargate rather than SageMaker, unlike model-service: SageMaker's
  # contract is /ping + /invocations for model inference, and this does
  # I/O-heavy domain computation that *calls* a model rather than being
  # one. It reads FAA sectional raster tiles, walks great circles, selects
  # checkpoints and computes dead reckoning.
  #
  # No ALB listener rule and no public IP. The browser never reaches it;
  # webapp does, over service discovery, which is why the only ingress is
  # from EcsServiceSecurityGroup.
  #
  # More memory than webapp because a corridor's tiles are decoded into
  # numpy arrays block by block -- a long leg is a few hundred MB of
  # pixels in flight, and MAX_BLOCK_TILES bounds it (see
  # src/vfr/chartvision.py).
  # ---------------------------------------------------------------------
  PlanningServiceLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /ecs/vfr-route-planning-service
      RetentionInDays: 30

  PlanningServiceTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: vfr-route-planning-service
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: "1024"
      Memory: "4096"
      ExecutionRoleArn: !GetAtt EcsTaskExecutionRole.Arn
      TaskRoleArn: !GetAtt EcsTaskRole.Arn
      ContainerDefinitions:
        - Name: planning-service
          Image: !Ref PlanningServiceImageUri
          PortMappings:
            - ContainerPort: 8000
          Environment:
            # Locally this service bind-mounts the repo for data/. On
            # Fargate there is no repo, so the FAA datasets (NASR airports,
            # the obstacle file, Class airspace shapefiles) and the feature
            # stores are read from the same bucket the pipeline jobs use.
            # EcsTaskRole already carries the s3 permissions for it.
            - Name: VFR_DATA_S3_BUCKET
              Value: !Ref DataS3BucketName
            - Name: SAGEMAKER_ENDPOINT_NAME
              Value: !GetAtt SageMakerEndpoint.EndpointName
              # Same switch as webapp: presence alone routes scoring to
              # SageMaker Runtime instead of a local model-service HTTP call.
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref PlanningServiceLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: planning-service

  PlanningServiceService:
    Type: AWS::ECS::Service
    Properties:
      Cluster: !Ref EcsCluster
      TaskDefinition: !Ref PlanningServiceTaskDefinition
      DesiredCount: 1
      LaunchType: FARGATE
      NetworkConfiguration:
        AwsvpcConfiguration:
          Subnets: !Ref PrivateSubnetIds
          SecurityGroups: [!Ref PlanningServiceSecurityGroup]
          AssignPublicIp: DISABLED
      ServiceRegistries:
        - RegistryArn: !GetAtt PlanningServiceDiscoveryService.Arn

  # ---------------------------------------------------------------------
  # ECS Fargate -- nav-log-agent (LangGraph MCP server). Reached through
  # the same ALB as webapp via a path-based route (AlbMcpListenerRule,
  # /mcp/*) -- see app/main.py's sse_path/message_path for why those are
  # the real, stable routes this rule can target.
  # ---------------------------------------------------------------------
  NavLogAgentLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /ecs/vfr-route-nav-log-agent
      RetentionInDays: 30

  NavLogAgentTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: vfr-route-nav-log-agent
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: "512"
      Memory: "1024"
      ExecutionRoleArn: !GetAtt EcsTaskExecutionRole.Arn
      TaskRoleArn: !GetAtt GenAiTaskRole.Arn
      ContainerDefinitions:
        - Name: nav-log-agent
          Image: !Ref NavLogAgentImageUri
          PortMappings:
            - ContainerPort: 8000
          Environment:
            - Name: DB_HOST
              Value: !GetAtt Database.Endpoint.Address
            - Name: DB_PORT
              Value: !GetAtt Database.Endpoint.Port
            - Name: DB_NAME
              Value: !Ref DBName
            - Name: DB_USER
              Value: !Ref DBUsername
            - Name: SAGEMAKER_ENDPOINT_NAME
              Value: !GetAtt SageMakerEndpoint.EndpointName
          Secrets:
            - Name: DB_PASSWORD
              ValueFrom: !Sub "${Database.MasterUserSecret.SecretArn}:password::"
            - Name: ANTHROPIC_API_KEY
              ValueFrom: !Ref AnthropicApiKeySecretArn
            - Name: NAV_LOG_AGENT_API_KEY
              ValueFrom: !Ref NavLogAgentApiKeySecretArn
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref NavLogAgentLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: nav-log-agent

  NavLogAgentService:
    Type: AWS::ECS::Service
    DependsOn: AlbMcpListenerRule
    Properties:
      Cluster: !Ref EcsCluster
      TaskDefinition: !Ref NavLogAgentTaskDefinition
      DesiredCount: 1
      LaunchType: FARGATE
      NetworkConfiguration:
        AwsvpcConfiguration:
          Subnets: !Ref PrivateSubnetIds
          SecurityGroups: [!Ref NavLogAgentSecurityGroup]
          AssignPublicIp: DISABLED
      LoadBalancers:
        - ContainerName: nav-log-agent
          ContainerPort: 8000
          TargetGroupArn: !Ref AlbMcpTargetGroup
      HealthCheckGracePeriodSeconds: 60

  # ---------------------------------------------------------------------
  # ECS Fargate -- crewai-agent. A task definition only, no service: this
  # is a one-shot CLI locally (`docker compose run --rm crewai-agent ...`)
  # and stays that on AWS too -- run on demand with
  # `aws ecs run-task --cluster vfr-route --task-definition vfr-route-crewai-agent
  # --launch-type FARGATE --network-configuration ...`, not a standing service.
  # ---------------------------------------------------------------------
  CrewaiAgentLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /ecs/vfr-route-crewai-agent
      RetentionInDays: 30

  CrewaiAgentTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: vfr-route-crewai-agent
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: "512"
      Memory: "1024"
      ExecutionRoleArn: !GetAtt EcsTaskExecutionRole.Arn
      TaskRoleArn: !GetAtt GenAiTaskRole.Arn
      ContainerDefinitions:
        - Name: crewai-agent
          Image: !Ref CrewaiAgentImageUri
          Environment:
            - Name: SAGEMAKER_ENDPOINT_NAME
              Value: !GetAtt SageMakerEndpoint.EndpointName
          Secrets:
            - Name: ANTHROPIC_API_KEY
              ValueFrom: !Ref AnthropicApiKeySecretArn
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref CrewaiAgentLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: crewai-agent

  # ---------------------------------------------------------------------
  # ECS Fargate -- Airflow, self-hosted (the alternative was Amazon MWAA;
  # self-hosting was chosen to reuse the same Fargate/ECS pattern as every
  # other service here rather than bring in a second, differently-shaped
  # managed service for one component). Not reachable from the ALB --
  # only the Retrain Trigger Lambda talks to it, over Cloud Map (see
  # ServiceDiscoveryNamespace above).
  # ---------------------------------------------------------------------
  AirflowLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /ecs/vfr-route-airflow
      RetentionInDays: 30

  AirflowTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: vfr-route-airflow
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: "1024"
      Memory: "2048"
      ExecutionRoleArn: !GetAtt EcsTaskExecutionRole.Arn
      TaskRoleArn: !GetAtt AirflowTaskRole.Arn
      Volumes:
        - Name: airflow-home
          EFSVolumeConfiguration:
            FilesystemId: !Ref AirflowEfs
            TransitEncryption: ENABLED
            AuthorizationConfig:
              AccessPointId: !Ref AirflowEfsAccessPoint
              IAM: ENABLED
      ContainerDefinitions:
        - Name: airflow
          Image: !Ref AirflowImageUri
          Command: ["standalone"]
          PortMappings:
            - ContainerPort: 8080
          MountPoints:
            - SourceVolume: airflow-home
              ContainerPath: /opt/airflow
          Environment:
            - Name: AIRFLOW__CORE__LOAD_EXAMPLES
              Value: "false"
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref AirflowLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: airflow

  AirflowService:
    Type: AWS::ECS::Service
    Properties:
      Cluster: !Ref EcsCluster
      TaskDefinition: !Ref AirflowTaskDefinition
      DesiredCount: 1
      LaunchType: FARGATE
      # Lets `aws ecs execute-command` open a shell into the running task --
      # the way to run `airflow variables set ...` once, post-deploy (see
      # docs/README-AWS.md's deploy runbook), since there's no other shell
      # access to a Fargate task.
      EnableExecuteCommand: true
      NetworkConfiguration:
        AwsvpcConfiguration:
          Subnets: !Ref PrivateSubnetIds
          SecurityGroups: [!Ref AirflowSecurityGroup]
          AssignPublicIp: DISABLED
      ServiceRegistries:
        - RegistryArn: !GetAtt AirflowServiceDiscoveryService.Arn

  # ---------------------------------------------------------------------
  # ALB
  # ---------------------------------------------------------------------
  Alb:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Type: application
      Scheme: internet-facing
      Subnets: !Ref PublicSubnetIds
      SecurityGroups: [!Ref AlbSecurityGroup]

  AlbTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref VpcId
      Protocol: HTTP
      Port: 8080
      TargetType: ip
      # Matches webapp's actual Spring Boot Actuator readiness probe --
      # see springboot-app/src/main/resources/application.yml.
      HealthCheckPath: /actuator/health/readiness
      HealthCheckIntervalSeconds: 15
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3

  AlbListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref Alb
      Port: !If [HasCertificate, 443, 80]
      Protocol: !If [HasCertificate, HTTPS, HTTP]
      Certificates: !If
        - HasCertificate
        - [{ CertificateArn: !Ref CertificateArn }]
        - !Ref AWS::NoValue
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref AlbTargetGroup

  # nav-log-agent's MCP endpoint, reached through the same ALB as webapp
  # instead of a second load balancer -- see app/main.py for why /mcp/sse
  # and /mcp/messages/ are the two real routes this pattern has to match.
  AlbMcpTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref VpcId
      Protocol: HTTP
      Port: 8000
      TargetType: ip
      HealthCheckPath: /mcp/sse
      # An SSE connection is expected to hang open, not return a fast 200 --
      # ELB's health check just needs *a* response within the timeout to
      # consider the target healthy, which an SSE handshake satisfies.
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 10
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3

  AlbMcpListenerRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref AlbListener
      Priority: 10
      Conditions:
        - Field: path-pattern
          Values: ["/mcp/*"]
      Actions:
        - Type: forward
          TargetGroupArn: !Ref AlbMcpTargetGroup

  DnsRecord:
    Type: AWS::Route53::RecordSet
    Condition: HasDomainName
    Properties:
      HostedZoneName: !Sub "${DomainName}."
      Name: !Ref DomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt Alb.DNSName
        HostedZoneId: !GetAtt Alb.CanonicalHostedZoneID

  # ---------------------------------------------------------------------
  # SageMaker -- serves model-service's image, per that service's own
  # /ping + /invocations contract (see model-service/app/main.py).
  # ---------------------------------------------------------------------
  SageMakerModel:
    Type: AWS::SageMaker::Model
    Properties:
      ExecutionRoleArn: !GetAtt SageMakerExecutionRole.Arn
      PrimaryContainer:
        Image: !Ref ModelServiceImageUri
        ModelDataUrl: !Ref ModelArtifactS3Uri

  SageMakerEndpointConfig:
    Type: AWS::SageMaker::EndpointConfig
    Properties:
      ProductionVariants:
        - VariantName: primary
          ModelName: !GetAtt SageMakerModel.ModelName
          InstanceType: !Ref SageMakerInstanceType
          InitialInstanceCount: 1

  SageMakerEndpoint:
    Type: AWS::SageMaker::Endpoint
    Properties:
      EndpointConfigName: !GetAtt SageMakerEndpointConfig.EndpointConfigName

  # ---------------------------------------------------------------------
  # Retrain Trigger -- infra/lambda-retrain-trigger (Go), behind an HTTP
  # API. Triggers vfr_pipeline on demand instead of waiting on Airflow's
  # own schedule.
  # ---------------------------------------------------------------------
  RetrainTriggerFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: vfr-retrain-trigger
      Runtime: provided.al2023
      Architectures: [arm64]
      Handler: bootstrap
      Code:
        S3Bucket: !Ref LambdaCodeS3Bucket
        S3Key: !Ref LambdaCodeS3Key
      MemorySize: 128
      Timeout: 15
      Role: !GetAtt LambdaExecutionRole.Arn
      VpcConfig:
        SubnetIds: !Ref PrivateSubnetIds
        SecurityGroupIds: [!Ref LambdaSecurityGroup]
      Environment:
        Variables:
          # Matches ServiceDiscoveryNamespace + AirflowServiceDiscoveryService
          # above -- a fixed, predictable address rather than a
          # separately-supplied parameter, since this stack owns both ends.
          AIRFLOW_BASE_URL: http://airflow.vfr-route.internal:8080
          AIRFLOW_DAG_ID: !Ref AirflowDagId
          AIRFLOW_CREDENTIALS_SECRET_ARN: !Ref AirflowCredentialsSecretArn

  RetrainApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: vfr-retrain-api
      ProtocolType: HTTP

  RetrainApiIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref RetrainApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt RetrainTriggerFunction.Arn
      PayloadFormatVersion: "2.0"

  RetrainApiRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref RetrainApi
      RouteKey: "POST /retrain"
      Target: !Sub "integrations/${RetrainApiIntegration}"

  RetrainApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref RetrainApi
      StageName: $default
      AutoDeploy: true

  RetrainApiLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref RetrainTriggerFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${RetrainApi}/*/*/retrain"

Outputs:
  AlbDnsName:
    Value: !GetAtt Alb.DNSName
  AppUrl:
    Value: !If
      - HasDomainName
      - !Sub "https://${DomainName}"
      - !Sub
        - "${Scheme}://${DnsName}"
        - Scheme: !If [HasCertificate, "https", "http"]
          DnsName: !GetAtt Alb.DNSName
  DatabaseEndpoint:
    Value: !GetAtt Database.Endpoint.Address
  DatabaseSecretArn:
    Description: Fetch the actual generated password with `aws secretsmanager get-secret-value`.
    Value: !GetAtt Database.MasterUserSecret.SecretArn
  SageMakerEndpointName:
    Value: !GetAtt SageMakerEndpoint.EndpointName
  RetrainApiUrl:
    Value: !Sub "${RetrainApi.ApiEndpoint}/retrain"
  McpUrl:
    Description: nav-log-agent's MCP endpoint -- an MCP client connects to <this>/sse.
    Value: !If
      - HasDomainName
      - !Sub "https://${DomainName}/mcp"
      - !Sub
        - "${Scheme}://${DnsName}/mcp"
        - Scheme: !If [HasCertificate, "https", "http"]
          DnsName: !GetAtt Alb.DNSName
  CrewaiAgentTaskDefinitionArn:
    Description: Run with `aws ecs run-task --cluster vfr-route --task-definition <this> --launch-type FARGATE --network-configuration ...` -- not a standing service.
    Value: !Ref CrewaiAgentTaskDefinition
  SageMakerJobRoleArn:
    Description: Set as the `vfr_sagemaker_job_role_arn` Airflow Variable (airflow/dags/vfr_pipeline_aws_dag.py) once Airflow is up.
    Value: !GetAtt SageMakerJobRole.Arn
