AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Wingtip Maps on AWS, built for low cost: one EC2 server (webapp, planner,
  briefing agent, Postgres) behind CloudFront, FAA chart tiles drawn once
  per 56-day cycle by a Fargate Spot task into S3, and the web app's
  fingerprinted files cached at the edge. About $29 a month with the
  server on Spot capacity, the default (docs/README-AWS.md has the
  itemised cost and the runbook). Deploy in
  us-east-1: CloudFront's certificate must be there.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: { default: Domain }
        Parameters: [PublicHost, HostedZoneId, MailDomain]
      - Label: { default: Server }
        Parameters: [ServerPricing, ServerImageId, InstanceType, SpareInstanceType, DataVolumeGb, ImageTag, CloudFrontPrefixListId]
      - Label: { default: Deploys from GitHub }
        Parameters: [GitHubRepo, CreateGitHubOidcProvider]
      - Label: { default: Spending }
        Parameters: [BudgetEmail]

Parameters:
  PublicHost:
    Type: String
    Description: The app's domain, e.g. app.example.com. Its Route 53 zone must be HostedZoneId.
  HostedZoneId:
    Type: AWS::Route53::HostedZone::Id
    Description: The Route 53 zone the domain lives in (for the certificate, the DNS records and SES's DKIM).
  MailDomain:
    Type: String
    Default: ""
    Description: The domain sign-in mail is sent from (no-reply@MailDomain). Empty means PublicHost.
  ServerImageId:
    Type: AWS::EC2::Image::Id
    Description: >
      The server's Amazon Linux 2023 image (x86_64), named here rather
      than looked up, so the server changes only when this does (a new
      one replaces the server; the data disk moves to the next). The
      current one: aws ssm get-parameter --region us-east-1 --name
      /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
      --query Parameter.Value --output text
  ServerPricing:
    Type: String
    Default: spot
    AllowedValues: [spot, on-demand]
    Description: >
      spot: AWS's spare capacity, about a third of the price; a few times a
      year AWS takes it back, and a new server starts on the same data disk
      within minutes. on-demand: never taken back. Changing it replaces the
      server, keeping the data disk.
  InstanceType:
    Type: String
    Default: t3a.medium
    AllowedValues: [t3a.medium, t3a.large, t3.medium, t3.large, m6a.large, m7a.large]
    Description: >
      2 cores and 4 GB run the stack once the planner no longer draws tiles
      (the production stack held 1.8 GB at rest in the local rehearsal,
      2026-10-08). x86, so CI's images run as built; a large (8 GB) if it
      ever runs short.
  SpareInstanceType:
    Type: String
    Default: t3.medium
    AllowedValues: [t3a.medium, t3a.large, t3.medium, t3.large, m6a.large, m7a.large]
    Description: >
      A second type of the same size, for when Spot has none of the first:
      two pools are interrupted less often than one.
  DataVolumeGb:
    Type: Number
    Default: 30
    MinValue: 20
    Description: >
      The data disk, which outlives any one server: Postgres, the FAA data
      and the chart sheets the planner reads checkpoints off (6 GB for the
      whole country), the checkpoint notes. gp3 grows in place if it fills.
      The server's own 20 GB disk holds the system, the images and swap.
  ImageTag:
    Type: String
    Default: latest
  CloudFrontPrefixListId:
    Type: String
    Default: pl-3b927c52
    Description: CloudFront's origin-facing managed prefix list in us-east-1 (com.amazonaws.global.cloudfront.origin-facing).
  GitHubRepo:
    Type: String
    Default: asdaq-samir/flight_plan
  CreateGitHubOidcProvider:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: "false if the account already has token.actions.githubusercontent.com as an OIDC provider."
  BudgetEmail:
    Type: String
    Default: ""
    Description: Where the monthly budget alarm ($50, at 80% spent) and a failed nightly backup go. Empty for no alarm.

Rules:
  UsEast1:
    Assertions:
      - Assert: !Equals [!Ref AWS::Region, us-east-1]
        AssertDescription: Deploy in us-east-1, where CloudFront's certificate must live.

Conditions:
  HasBudget: !Not [!Equals [!Ref BudgetEmail, ""]]
  CreateOidc: !Equals [!Ref CreateGitHubOidcProvider, "true"]
  HasMailDomain: !Not [!Equals [!Ref MailDomain, ""]]
  SpotServer: !Equals [!Ref ServerPricing, spot]

Resources:
  # ---------------------------------------------------------------------
  # Network: one public subnet. The server and the refresh task reach the
  # FAA, NOAA, Anthropic and AWS's own APIs directly, so there is no NAT
  # gateway ($33 a month) and no VPC endpoints ($7 each).
  # ---------------------------------------------------------------------
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.20.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags: [{ Key: Name, Value: !Ref AWS::StackName }]

  InternetGateway:
    Type: AWS::EC2::InternetGateway

  VpcGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.20.0.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: true

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc

  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: VpcGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetRouteTable:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref PublicRouteTable

  # ---------------------------------------------------------------------
  # Images: the four the server runs, pushed by promote.yml's push-ecr.
  # ---------------------------------------------------------------------
  WebappRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: vfr-route/webapp
      EmptyOnDelete: true
      LifecyclePolicy:
        LifecyclePolicyText: '{"rules":[{"rulePriority":1,"description":"keep the last 20","selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":20},"action":{"type":"expire"}}]}'

  PlanningServiceRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: vfr-route/planning-service
      EmptyOnDelete: true
      LifecyclePolicy:
        LifecyclePolicyText: '{"rules":[{"rulePriority":1,"description":"keep the last 20","selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":20},"action":{"type":"expire"}}]}'

  NavLogAgentRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: vfr-route/nav-log-agent
      EmptyOnDelete: true
      LifecyclePolicy:
        LifecyclePolicyText: '{"rules":[{"rulePriority":1,"description":"keep the last 20","selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":20},"action":{"type":"expire"}}]}'

  ModelServiceRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: vfr-route/model-service
      EmptyOnDelete: true
      LifecyclePolicy:
        LifecyclePolicyText: '{"rules":[{"rulePriority":1,"description":"keep the last 20","selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":20},"action":{"type":"expire"}}]}'

  # ---------------------------------------------------------------------
  # Storage
  # ---------------------------------------------------------------------
  ChartTilesBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          # A cycle's tiles age out after the next two cycles have come:
          # a browser on an old serving.json for its five minutes still
          # finds its tiles.
          - Id: OldCycles
            Status: Enabled
            Prefix: tiles/
            ExpirationInDays: 120

  # The nightly backups (backups/, kept 14 days) and the chart
  # model the planner ranks checkpoints with (models/, uploaded by hand).
  # Kept if the stack goes: it is what a new server is restored from.
  ServerBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: NightlyBackups
            Status: Enabled
            Prefix: backups/
            ExpirationInDays: 14

  # ---------------------------------------------------------------------
  # Secrets: three the stack generates, one the owner fills in
  # (infra/server/env.example). deploy.sh reads all four.
  # ---------------------------------------------------------------------
  DbPasswordSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: Postgres password on the server.
      GenerateSecretString: { PasswordLength: 32, ExcludePunctuation: true }

  # nav-log-agent will not start without its key (an open MCP server),
  # and the webapp sends it.
  AgentKeySecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: The bearer token of nav-log-agent's MCP server.
      GenerateSecretString: { PasswordLength: 40, ExcludePunctuation: true }

  OriginSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: The header CloudFront sends and Caddy demands, so only CloudFront reaches the server.
      GenerateSecretString: { PasswordLength: 40, ExcludePunctuation: true }

  # Its keys only: the owner fills in the values in the console, and the
  # stack never writes it again unless this SecretString changes -- so
  # leave it as it is.
  AppSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: The owner's own values (infra/server/env.example). Fill in, then run deploy.sh.
      SecretString: '{"ANTHROPIC_API_KEY":"","MAIL_USERNAME":"","MAIL_PASSWORD":"","APP_DEVELOPER_EMAILS":""}'

  # ---------------------------------------------------------------------
  # The server
  # ---------------------------------------------------------------------
  ServerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: HTTPS from CloudFront only, HTTP from anywhere for the Lets Encrypt challenge (Caddy redirects the rest).
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, SourcePrefixListId: !Ref CloudFrontPrefixListId }
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0 }

  ServerRole:
    Type: AWS::IAM::Role
    Properties:
      Description: The server's own permissions -- pull its images, read its secrets, write its backups. Shell access through SSM, no SSH.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: Server
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              - Effect: Allow
                Action: [ecr:BatchGetImage, ecr:GetDownloadUrlForLayer, ecr:BatchCheckLayerAvailability]
                Resource:
                  - !GetAtt WebappRepository.Arn
                  - !GetAtt PlanningServiceRepository.Arn
                  - !GetAtt NavLogAgentRepository.Arn
                  - !GetAtt ModelServiceRepository.Arn
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: [!Ref DbPasswordSecret, !Ref AgentKeySecret, !Ref OriginSecret, !Ref AppSecret]
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject]
                Resource: !Sub "${ServerBucket.Arn}/*"
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt ServerBucket.Arn
              - !If
                - HasBudget
                - { Effect: Allow, Action: "sns:Publish", Resource: !Ref BackupAlertTopic }
                - !Ref AWS::NoValue
              # Its services' logs, to CloudWatch (docker-compose.prod.yml).
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt ServerLogGroup.Arn
              # Each new server takes over the stack's address and data disk.
              # The volume and the address are the stack's own; an instance
              # is allowed only if it carries the stack's server Name tag
              # (the launch template sets it), so a compromised server
              # cannot attach the disk to, or move the address onto, any
              # other instance. A condition on a tag applies to every
              # resource in its statement, so each kind has its own.
              - Effect: Allow
                Action: ec2:AttachVolume
                Resource: !Sub "arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:volume/${DataVolume}"
              - Effect: Allow
                Action: ec2:AssociateAddress
                Resource: !Sub "arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:elastic-ip/${ServerAddress.AllocationId}"
              - Effect: Allow
                Action: [ec2:AttachVolume, ec2:AssociateAddress]
                Resource: !Sub "arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:instance/*"
                Condition:
                  StringEquals:
                    "ec2:ResourceTag/Name": !Sub "${AWS::StackName}-server"
              # AssociateAddress also names the instance's network interface,
              # which has no tag to match on.
              - Effect: Allow
                Action: ec2:AssociateAddress
                Resource: !Sub "arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:network-interface/*"

  ServerInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref ServerRole]

  # The data disk: everything the server keeps -- Postgres, the planner's
  # data folder and checkpoint notes, the repository -- on a disk of its
  # own that outlives any one server. Each new server attaches it on its
  # first boot (the launch template's UserData); a snapshot is taken if
  # the stack is ever deleted, and SnapshotPolicy takes one daily.
  DataVolume:
    Type: AWS::EC2::Volume
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      AvailabilityZone: !GetAtt PublicSubnet.AvailabilityZone
      Size: !Ref DataVolumeGb
      VolumeType: gp3
      Encrypted: true
      Tags:
        - { Key: Name, Value: !Sub "${AWS::StackName}-data" }
        - { Key: Snapshot, Value: !Sub "${AWS::StackName}-daily" }

  ServerLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateData:
        ImageId: !Ref ServerImageId
        IamInstanceProfile: { Arn: !GetAtt ServerInstanceProfile.Arn }
        SecurityGroupIds: [!Ref ServerSecurityGroup]
        MetadataOptions: { HttpTokens: required, HttpEndpoint: enabled }
        BlockDeviceMappings:
          - DeviceName: /dev/xvda
            Ebs: { VolumeType: gp3, VolumeSize: 20, Encrypted: true, DeleteOnTermination: true }
        TagSpecifications:
          - ResourceType: instance
            Tags: [{ Key: Name, Value: !Sub "${AWS::StackName}-server" }]
        UserData:
          Fn::Base64: !Sub
            - |
              #!/bin/bash
              # Each server's first boot: the stack's address and data disk,
              # Docker, the repo's production files, the settings deploy.sh
              # reads, and the nightly backup. A Spot interruption, or a change
              # that replaces the server, starts a new one, which runs this
              # again and finds the data disk as the last one left it.
              set -euxo pipefail
              token=$(curl -fsS -X PUT http://169.254.169.254/latest/api/token -H "X-aws-ec2-metadata-token-ttl-seconds: 600")
              iid=$(curl -fsS -H "X-aws-ec2-metadata-token: $token" http://169.254.169.254/latest/meta-data/instance-id)
              aws ec2 associate-address --region ${AWS::Region} --allocation-id ${ServerAddress.AllocationId} --instance-id "$iid" --allow-reassociation
              # The disk is free once the last server has gone; until then, wait.
              until aws ec2 attach-volume --region ${AWS::Region} --volume-id ${DataVolume} --instance-id "$iid" --device /dev/sdf; do sleep 10; done
              disk=/dev/disk/by-id/nvme-Amazon_Elastic_Block_Store_$(echo ${DataVolume} | tr -d -)
              until [ -e "$disk" ]; do sleep 2; done
              # Formatted only when blkid positively finds no filesystem (exit
              # 2); any other failure stops the script rather than risk
              # wiping Postgres, and a disk that has one is mounted as it is.
              probe=0
              blkid -p "$disk" > /dev/null || probe=$?
              if [ "$probe" -eq 2 ]; then
                mkfs.xfs "$disk"
              elif [ "$probe" -ne 0 ]; then
                echo "blkid failed ($probe) on $disk: not formatting" >&2
                exit 1
              fi
              mkdir -p /srv/flight_plan
              echo "UUID=$(blkid -s UUID -o value "$disk") /srv/flight_plan xfs defaults,nofail 0 2" >> /etc/fstab
              mount /srv/flight_plan
              dnf install -y docker git cronie
              systemctl enable --now docker crond
              mkdir -p /usr/local/lib/docker/cli-plugins
              # A pinned release, checked against the checksum published
              # beside it, so a rebuild gets the plugin the first boot did.
              compose_url=https://github.com/docker/compose/releases/download/v2.40.3/docker-compose-linux-x86_64
              curl -fsSL "$compose_url" -o /usr/local/lib/docker/cli-plugins/docker-compose
              echo "$(curl -fsSL "$compose_url.sha256" | cut -d' ' -f1)  /usr/local/lib/docker/cli-plugins/docker-compose" | sha256sum -c -
              chmod +x /usr/local/lib/docker/cli-plugins/docker-compose
              # 2 GB of swap: headroom for a JVM, a planner and an agent on 4 GB.
              if [ ! -f /swapfile ]; then
                fallocate -l 2G /swapfile && chmod 600 /swapfile && mkswap /swapfile && swapon /swapfile
                echo '/swapfile none swap sw 0 0' >> /etc/fstab
              fi
              cat > /etc/flight_plan.conf <<'CONF'
              AWS_REGION=${AWS::Region}
              IMAGE_REGISTRY=${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/vfr-route
              IMAGE_TAG=${ImageTag}
              PUBLIC_HOST=${PublicHost}
              ORIGIN_HOST=origin.${PublicHost}
              SERVER_BUCKET=${ServerBucket}
              APP_SECRET_ARN=${AppSecret}
              DB_SECRET_ARN=${DbPasswordSecret}
              AGENT_SECRET_ARN=${AgentKeySecret}
              ORIGIN_SECRET_ARN=${OriginSecret}
              BACKUP_TOPIC_ARN=${BackupTopicArn}
              LOG_GROUP=${ServerLogGroup}
              MAIL_HOST=email-smtp.${AWS::Region}.amazonaws.com
              MAIL_FROM=no-reply@${MailFrom}
              CONF
              mkdir -p /srv/flight_plan/data /srv/flight_plan/postgres
              chown 1000:1000 /srv/flight_plan/data
              [ -d /srv/flight_plan/repo ] || git clone --depth 1 https://github.com/${GitHubRepo}.git /srv/flight_plan/repo
              echo '17 7 * * * root /srv/flight_plan/repo/infra/server/backup.sh >> /var/log/flight_plan-backup.log 2>&1' \
                > /etc/cron.d/flight_plan-backup
              # The images arrive with the first promote.yml push to ECR; until
              # then this fails, and deploy.sh is run again after that push.
              /srv/flight_plan/repo/infra/server/deploy.sh || echo "no images yet: run deploy.sh after the first push"
            - MailFrom: !If [HasMailDomain, !Ref MailDomain, !Ref PublicHost]
              BackupTopicArn: !If [HasBudget, !Ref BackupAlertTopic, ""]

  # One server at a time, kept running: if AWS takes a Spot server back,
  # or it fails its checks, the group starts another, which takes over
  # the address and the data disk. Spot from whichever of the two types
  # has the most spare capacity at the price (price-capacity-optimized);
  # on-demand when ServerPricing says so. A new launch template (a new
  # image, say) replaces the server the same way.
  ServerGroup:
    Type: AWS::AutoScaling::AutoScalingGroup
    DependsOn: PublicDefaultRoute
    UpdatePolicy:
      AutoScalingRollingUpdate: { MinInstancesInService: 0, MaxBatchSize: 1, PauseTime: PT0S }
    Properties:
      MinSize: "1"
      MaxSize: "1"
      DesiredCapacity: "1"
      VPCZoneIdentifier: [!Ref PublicSubnet]
      MixedInstancesPolicy:
        InstancesDistribution:
          OnDemandBaseCapacity: !If [SpotServer, 0, 1]
          OnDemandPercentageAboveBaseCapacity: !If [SpotServer, 0, 100]
          SpotAllocationStrategy: price-capacity-optimized
        LaunchTemplate:
          LaunchTemplateSpecification:
            LaunchTemplateId: !Ref ServerLaunchTemplate
            Version: !GetAtt ServerLaunchTemplate.LatestVersionNumber
          Overrides:
            - InstanceType: !Ref InstanceType
            - InstanceType: !Ref SpareInstanceType

  # Daily snapshots of the data disk, 7 kept (about $1 a month): a lost
  # disk does not mean restoring from a nightly dump alone.
  SnapshotRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Lets Data Lifecycle Manager snapshot the server's data disk.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - { Effect: Allow, Principal: { Service: dlm.amazonaws.com }, Action: "sts:AssumeRole" }
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSDataLifecycleManagerServiceRole

  SnapshotPolicy:
    Type: AWS::DLM::LifecyclePolicy
    Properties:
      Description: Daily snapshots of the Wingtip Maps data disk
      State: ENABLED
      ExecutionRoleArn: !GetAtt SnapshotRole.Arn
      PolicyDetails:
        ResourceTypes: [VOLUME]
        TargetTags: [{ Key: Snapshot, Value: !Sub "${AWS::StackName}-daily" }]
        Schedules:
          - Name: daily
            CreateRule: { Interval: 24, IntervalUnit: HOURS, Times: ["05:00"] }
            RetainRule: { Count: 7 }
            CopyTags: true

  # Every service's log on the server, the pilots' error reports among
  # them (ClientErrorController), kept a month.
  ServerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/${AWS::StackName}/server"
      RetentionInDays: 30

  # The server's fixed address, taken over by each new server on boot.
  ServerAddress:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc

  # ---------------------------------------------------------------------
  # Domain: the certificate (CloudFront's, so in us-east-1), the public
  # name on CloudFront, and origin.<domain> on the server for Caddy's own
  # Let's Encrypt certificate.
  # ---------------------------------------------------------------------
  Certificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref PublicHost
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref PublicHost
          HostedZoneId: !Ref HostedZoneId

  OriginRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Sub "origin.${PublicHost}"
      Type: A
      TTL: "300"
      ResourceRecords: [!Ref ServerAddress]

  PublicRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref PublicHost
      Type: A
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2  # CloudFront's own zone, the same for every distribution

  PublicRecordIpv6:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref PublicHost
      Type: AAAA
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2

  # ---------------------------------------------------------------------
  # CloudFront: one distribution on the app's domain.
  # - /tiles/*       S3, the chart tiles: a month at the edge (each tile
  #                  carries its own immutable Cache-Control).
  # - /app/assets/*  the server, cached: fingerprinted, a year, immutable
  #                  (WebMvcConfig's own header).
  # - the chart, the airport search, the stock aircraft
  #                  the server, cached by their own Cache-Control: the
  #                  same for every pilot (SharedAnswersCachePolicy).
  # - everything else the server, not cached: the app's pages, the API,
  #                  sign-in -- cookies and query strings go through.
  # One domain for all of it, so the session's Secure cookies work as
  # they do locally and the map's tile fetches are same-origin.
  # ---------------------------------------------------------------------
  TilesOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-tiles"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  ChartTilesBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ChartTilesBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub "${ChartTilesBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}"

  # The answers the same for every pilot (PlannerProxyController's
  # SHARED_PATHS, the planner's app.common SHARED_CACHE and CHART_CACHE):
  # kept for as long as their own Cache-Control says, a day at most, and
  # not at all when they say nothing. Keyed by path and query string alone
  # -- no cookie, no header -- so one pilot's search answers the next; and
  # nothing else goes to the server either, so no Set-Cookie can be kept
  # and handed on (CloudFront drops it where no cookie is forwarded).
  SharedAnswersCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: !Sub "${AWS::StackName}-shared-answers"
        MinTTL: 0
        DefaultTTL: 0
        MaxTTL: 86400
        ParametersInCacheKeyAndForwardedToOrigin:
          EnableAcceptEncodingGzip: true
          EnableAcceptEncodingBrotli: true
          HeadersConfig: { HeaderBehavior: none }
          CookiesConfig: { CookieBehavior: none }
          QueryStringsConfig: { QueryStringBehavior: all }

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub "Wingtip Maps (${AWS::StackName})"
        Aliases: [!Ref PublicHost]
        ViewerCertificate:
          AcmCertificateArn: !Ref Certificate
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        HttpVersion: http2and3
        IPV6Enabled: true
        # North America and Europe: where the pilots are, and the cheapest edges.
        PriceClass: PriceClass_100
        Origins:
          - Id: tiles
            DomainName: !GetAtt ChartTilesBucket.RegionalDomainName
            S3OriginConfig: { OriginAccessIdentity: "" }
            OriginAccessControlId: !GetAtt TilesOriginAccessControl.Id
          - Id: server
            DomainName: !Sub "origin.${PublicHost}"
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
              OriginReadTimeout: 60
            OriginCustomHeaders:
              - HeaderName: X-Origin-Secret
                HeaderValue: !Sub "{{resolve:secretsmanager:${OriginSecret}:SecretString}}"
        DefaultCacheBehavior:
          TargetOriginId: server
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
          CachedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad  # managed CachingDisabled
          # Managed AllViewerExceptHostHeader: every header, cookie and
          # query string, but Host -- CloudFront then names
          # origin.<domain>, the name Caddy holds a certificate for, and
          # Caddy tells the webapp the public one.
          OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
        CacheBehaviors:
          - PathPattern: tiles/*
            TargetOriginId: tiles
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD]
            CachedMethods: [GET, HEAD]
            Compress: false  # PNGs, already compressed
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6  # managed CachingOptimized
          - PathPattern: app/assets/*
            TargetOriginId: server
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD]
            CachedMethods: [GET, HEAD]
            Compress: true
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6  # managed CachingOptimized
          - PathPattern: api/planner/chart
            TargetOriginId: server
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD]
            CachedMethods: [GET, HEAD]
            Compress: true
            CachePolicyId: !Ref SharedAnswersCachePolicy
          - PathPattern: api/planner/airports/search
            TargetOriginId: server
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD]
            CachedMethods: [GET, HEAD]
            Compress: true
            CachePolicyId: !Ref SharedAnswersCachePolicy
          - PathPattern: api/planner/aircraft-profiles
            TargetOriginId: server
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD]
            CachedMethods: [GET, HEAD]
            Compress: true
            CachePolicyId: !Ref SharedAnswersCachePolicy
        # A server error is passed on, never kept: CloudFront would hold
        # one for ten seconds by default, and a planner restarting would
        # then outlast itself at the edge.
        CustomErrorResponses:
          - { ErrorCode: 500, ErrorCachingMinTTL: 0 }
          - { ErrorCode: 502, ErrorCachingMinTTL: 0 }
          - { ErrorCode: 503, ErrorCachingMinTTL: 0 }
          - { ErrorCode: 504, ErrorCachingMinTTL: 0 }

  # ---------------------------------------------------------------------
  # Chart tiles, once per cycle: a Fargate Spot task runs vfr.charts'
  # refresh every day -- a no-op until the FAA publishes a new cycle, then
  # it fetches the country's sheets, draws the pyramid and publishes it to
  # the tiles bucket (charts.publish), serving.json last, so every planner
  # and browser moves to the new cycle at once. Spot: an interrupted run
  # starts over the next day, the old cycle served until then. Under $1
  # a cycle.
  # ---------------------------------------------------------------------
  EcsCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub "${AWS::StackName}-jobs"

  EcsClusterCapacityProviders:
    Type: AWS::ECS::ClusterCapacityProviderAssociations
    Properties:
      Cluster: !Ref EcsCluster
      CapacityProviders: [FARGATE_SPOT, FARGATE]
      DefaultCapacityProviderStrategy:
        - { CapacityProvider: FARGATE_SPOT, Weight: 1 }

  TaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy

  ChartRefreshTaskRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Lets the refresh task publish tiles and read the pointer.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: PublishTiles
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [s3:PutObject, s3:GetObject]
                Resource: !Sub "${ChartTilesBucket.Arn}/*"
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt ChartTilesBucket.Arn

  ChartRefreshLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/ecs/${AWS::StackName}-chart-refresh"
      RetentionInDays: 30

  ChartRefreshSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: The refresh task reaches out (FAA, S3); nothing reaches in.
      VpcId: !Ref Vpc

  ChartRefreshTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "${AWS::StackName}-chart-refresh"
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      # Two workers drawing tiles, and the country's sheets plus their
      # pyramid on the task's own disk: 6 GB of sheets and 7.4 GB of
      # tiles (1.5 million of them) for the 09-03-2026 cycle.
      Cpu: "2048"
      Memory: "8192"
      EphemeralStorage: { SizeInGiB: 60 }
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      TaskRoleArn: !GetAtt ChartRefreshTaskRole.Arn
      ContainerDefinitions:
        - Name: chart-refresh
          Image: !Sub "${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/vfr-route/planning-service:${ImageTag}"
          Command: ["python", "-m", "vfr.charts", "refresh", "--workers", "2"]
          Environment:
            - { Name: CHART_TILES_BUCKET, Value: !Ref ChartTilesBucket }
            - { Name: CHART_TILES_URL, Value: !Sub "https://${PublicHost}/tiles" }
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref ChartRefreshLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: chart-refresh

  ChartRefreshSchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: events.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: RunChartRefresh
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ecs:RunTask
                Resource: !Ref ChartRefreshTaskDefinition
              - Effect: Allow
                Action: iam:PassRole
                Resource: [!GetAtt TaskExecutionRole.Arn, !GetAtt ChartRefreshTaskRole.Arn]

  ChartRefreshSchedule:
    Type: AWS::Events::Rule
    DependsOn: EcsClusterCapacityProviders
    Properties:
      Description: Publish the FAA's current chart cycle if it is not published yet; a no-op on the other 55 days.
      ScheduleExpression: cron(30 8 * * ? *)
      State: ENABLED
      Targets:
        - Id: chart-refresh
          Arn: !GetAtt EcsCluster.Arn
          RoleArn: !GetAtt ChartRefreshSchedulerRole.Arn
          EcsParameters:
            TaskDefinitionArn: !Ref ChartRefreshTaskDefinition
            CapacityProviderStrategy:
              - { CapacityProvider: FARGATE_SPOT, Weight: 1 }
            NetworkConfiguration:
              AwsVpcConfiguration:
                Subnets: [!Ref PublicSubnet]
                SecurityGroups: [!Ref ChartRefreshSecurityGroup]
                AssignPublicIp: ENABLED

  # ---------------------------------------------------------------------
  # Sign-in mail through SES: the domain identity with DKIM, its records
  # in Route 53. SMTP credentials and leaving SES's sandbox are the
  # owner's (docs/README-AWS.md).
  # ---------------------------------------------------------------------
  MailIdentity:
    Type: AWS::SES::EmailIdentity
    Properties:
      EmailIdentity: !If [HasMailDomain, !Ref MailDomain, !Ref PublicHost]
      DkimSigningAttributes: { NextSigningKeyLength: RSA_2048_BIT }

  MailDkimRecord1:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !GetAtt MailIdentity.DkimDNSTokenName1
      Type: CNAME
      TTL: "1800"
      ResourceRecords: [!GetAtt MailIdentity.DkimDNSTokenValue1]

  MailDkimRecord2:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !GetAtt MailIdentity.DkimDNSTokenName2
      Type: CNAME
      TTL: "1800"
      ResourceRecords: [!GetAtt MailIdentity.DkimDNSTokenValue2]

  MailDkimRecord3:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !GetAtt MailIdentity.DkimDNSTokenName3
      Type: CNAME
      TTL: "1800"
      ResourceRecords: [!GetAtt MailIdentity.DkimDNSTokenValue3]

  # ---------------------------------------------------------------------
  # Deploys from GitHub with no stored keys: promote.yml assumes this role
  # through GitHub's OIDC to push the images and run deploy.sh on the
  # server over SSM. Set its ARN as the repo variable AWS_ROLE_ARN.
  # ---------------------------------------------------------------------
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateOidc
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]

  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      Description: GitHub Actions on main pushes the images and runs deploy.sh on the server.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub "arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com"
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub: !Sub "repo:${GitHubRepo}:ref:refs/heads/main"
      Policies:
        - PolicyName: PushAndDeploy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:BatchGetImage
                  - ecr:CompleteLayerUpload
                  - ecr:GetDownloadUrlForLayer
                  - ecr:InitiateLayerUpload
                  - ecr:PutImage
                  - ecr:UploadLayerPart
                Resource:
                  - !GetAtt WebappRepository.Arn
                  - !GetAtt PlanningServiceRepository.Arn
                  - !GetAtt NavLogAgentRepository.Arn
                  - !GetAtt ModelServiceRepository.Arn
              # The server changes with each Spot interruption, so deploys
              # find it by its Name tag and may run only on that.
              - Effect: Allow
                Action: ec2:DescribeInstances
                Resource: "*"
              - Effect: Allow
                Action: ssm:SendCommand
                Resource: !Sub "arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:instance/*"
                Condition:
                  StringEquals:
                    ssm:resourceTag/Name: !Sub "${AWS::StackName}-server"
              - Effect: Allow
                Action: ssm:SendCommand
                Resource: !Sub "arn:aws:ssm:${AWS::Region}::document/AWS-RunShellScript"
              - Effect: Allow
                Action: [ssm:GetCommandInvocation, ssm:ListCommandInvocations]
                Resource: "*"

  # ---------------------------------------------------------------------
  # Spending: an email at 80% of $50 a month.
  # ---------------------------------------------------------------------
  # The owner's alerts by email: a failed nightly backup (backup.sh), and
  # the app not answering (HealthAlarm).
  BackupAlertTopic:
    Type: AWS::SNS::Topic
    Condition: HasBudget
    Properties:
      DisplayName: Wingtip Maps alerts
      Subscription: [{ Protocol: email, Endpoint: !Ref BudgetEmail }]

  # Is the app up, as a pilot reaches it: through CloudFront to the
  # webapp's health, which counts its database, every 30 seconds from
  # Route 53's checkers round the world. About $1.50 a month.
  HealthCheck:
    Type: AWS::Route53::HealthCheck
    Condition: HasBudget
    Properties:
      HealthCheckConfig:
        Type: HTTPS
        FullyQualifiedDomainName: !Ref PublicHost
        Port: 443
        ResourcePath: /actuator/health
        RequestInterval: 30
        FailureThreshold: 3
        # CloudFront is SNI-only; without this the handshake can fail and
        # the alarm would say down while the app is fine.
        EnableSNI: true
      HealthCheckTags: [{ Key: Name, Value: !Sub "${AWS::StackName}" }]

  # Not answering for three minutes running: an email, and another when
  # it is back. A Spot interruption's few minutes may send one pair.
  HealthAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: HasBudget
    Properties:
      AlarmDescription: Wingtip Maps is not answering its health check (Route 53, through CloudFront).
      Namespace: AWS/Route53
      MetricName: HealthCheckStatus
      Dimensions: [{ Name: HealthCheckId, Value: !Ref HealthCheck }]
      Statistic: Minimum
      Period: 60
      EvaluationPeriods: 3
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      AlarmActions: [!Ref BackupAlertTopic]
      OKActions: [!Ref BackupAlertTopic]

  MonthlyBudget:
    Type: AWS::Budgets::Budget
    Condition: HasBudget
    Properties:
      Budget:
        BudgetName: !Sub "${AWS::StackName}-monthly"
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit: { Amount: 50, Unit: USD }
      NotificationsWithSubscribers:
        - Notification: { NotificationType: ACTUAL, ComparisonOperator: GREATER_THAN, Threshold: 80, ThresholdType: PERCENTAGE }
          Subscribers: [{ SubscriptionType: EMAIL, Address: !Ref BudgetEmail }]

Outputs:
  PublicUrl:
    Value: !Sub "https://${PublicHost}/app/plan"
  DistributionId:
    Description: For cache invalidations.
    Value: !Ref Distribution
  ServerName:
    Description: The repo variable AWS_SERVER_NAME, for promote.yml's deploy -- the running server's Name tag.
    Value: !Sub "${AWS::StackName}-server"
  DataVolumeId:
    Value: !Ref DataVolume
  ServerAddress:
    Value: !Ref ServerAddress
  DeployRoleArn:
    Description: The repo variable AWS_ROLE_ARN (with AWS_REGION us-east-1).
    Value: !GetAtt DeployRole.Arn
  AppSecretArn:
    Description: Fill in the owner's values here (infra/server/env.example), then run deploy.sh.
    Value: !Ref AppSecret
  ServerBucketName:
    Description: The nightly backups (backups/<date>/) and the chart model (models/chart/current/).
    Value: !Ref ServerBucket
  ChartTilesBucketName:
    Value: !Ref ChartTilesBucket
  ChartRefreshNow:
    Description: Draws and publishes the current chart cycle now, rather than at the next 08:30 UTC run (the first deploy's tiles).
    Value: !Sub >-
      aws ecs run-task --region ${AWS::Region} --cluster ${EcsCluster}
      --task-definition ${ChartRefreshTaskDefinition}
      --capacity-provider-strategy capacityProvider=FARGATE_SPOT,weight=1
      --network-configuration "awsvpcConfiguration={subnets=[${PublicSubnet}],securityGroups=[${ChartRefreshSecurityGroup}],assignPublicIp=ENABLED}"
