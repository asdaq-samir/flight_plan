# Every version the native Android app builds with, in one place
# (docs/NATIVE-ANDROID.md). Kotlin's own Compose compiler and
# serialization plugins ride on Kotlin's version; the Compose libraries
# come from the BOM, so they are consistent with each other by
# construction and carry no version of their own here.
[versions]
agp = "8.13.0"
kotlin = "2.2.20"
coreKtx = "1.17.0"
activityCompose = "1.11.0"
lifecycle = "2.9.4"
composeBom = "2025.10.00"
serialization = "1.9.0"
coroutines = "1.10.2"
okhttp = "4.12.0"
maplibre = "11.8.0"
material = "1.12.0"
junit = "4.13.2"
androidxTestRunner = "1.7.0"
androidxTestJunit = "1.3.0"
# The flight pieces (flight/, records/, notify/): the fused location
# provider, Room for the records with KSP for its compiler (KSP's version
# is Kotlin's plus its own), DataStore for the few switches.
playServicesLocation = "21.3.0"
room = "2.7.2"
ksp = "2.2.20-2.0.3"
datastore = "1.1.7"
# The geoid model that turns the GPS's height above the ellipsoid into
# height above mean sea level, for phones below Android 14 (own ship's
# altitude, flight/OwnShip.kt).
coreLocationAltitude = "1.0.1"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
# The core icon set (the location arrow on the map); the BOM sets its version.
androidx-compose-material-icons-core = { group = "androidx.compose.material", name = "material-icons-core" }
# The full icon set, for the sparkle on Ask; R8 keeps only the icons used.
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
# MapLibre Native: the open native map, no key and no account, which is
# why it draws the chart rather than Google Maps (docs/NATIVE-ANDROID.md).
maplibre = { group = "org.maplibre.gl", name = "android-sdk", version.ref = "maplibre" }
# Material Components for Android, for the window's theme alone
# (res/values/themes.xml's Theme.Material3 parent); the screens are Compose's.
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
junit ={ group = "junit", name = "junit", version.ref = "junit" }
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "androidxTestRunner" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestJunit" }
# Google's fused location provider, for own ship (flight/OwnShip.kt): one
# fix a second from GPS with the phone's other sensors, as Core Location
# gives the iPhone's.
play-services-location = { group = "com.google.android.gms", name = "play-services-location", version.ref = "playServicesLocation" }
# Room, for the pilot's records on the device (records/Records.kt), the
# twin of the iOS app's SwiftData store; ktx for its suspending DAO and
# flows, the compiler through KSP.
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
# DataStore preferences, for a flight piece's switches (the traffic layer
# on or off, flight/Traffic.kt), in place of SharedPreferences.
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
# The process's lifecycle (ProcessLifecycleOwner), for the clock's
# background slowing (flight/Ticker.kt) and whether the app is in front
# (notify/Notifications.kt).
androidx-lifecycle-process = { group = "androidx.lifecycle", name = "lifecycle-process", version.ref = "lifecycle" }
# AltitudeConverterCompat: mean-sea-level altitude from the fix's
# ellipsoid height, Android 14's AltitudeConverter brought to older phones.
androidx-core-location-altitude = { group = "androidx.core", name = "core-location-altitude", version.ref = "coreLocationAltitude" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
