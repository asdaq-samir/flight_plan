# Gradle's memory for the build: the Kotlin and Compose compilers and the
# Android plugin together want more than the default, and the runner has it.
org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
# AndroidX, which every library here is; the old support library is not
# brought in beside it.
android.useAndroidX=true
# Each module's R class holds only its own resources, so a resource is
# named by the module that owns it and the build stays small.
android.nonTransitiveRClass=true
# The official Kotlin code style, which the Kotlin plugin otherwise asks for.
kotlin.code.style=official
