<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280">
<title>Wingtip Maps</title>
<style>
  html, body { margin: 0; height: 100%; }
  body { display: grid; place-items: center; font: 28px system-ui, sans-serif; color: #f2f2f7; background: #0b1220; text-align: center; }
  h1 { font-size: 40px; margin: 0 0 12px; }
  p { color: #aeb4c2; margin: 0 0 32px; max-width: 900px; }
  button { font: inherit; color: #fff; background: #0a84ff; border: 0; border-radius: 16px; padding: 16px 32px; }
  button:focus { outline: 4px solid #fff; outline-offset: 4px; }
  #offline { display: none; }
</style>
</head>
<body>
<!-- The TV app's own page (tv/, docs/TV.md): it goes to the site, which
     the app shows from then on, the platform said in its address so the
     site makes itself for the remote (web/src/lib/tv). Shown only while
     the site is asked for, or when it cannot be reached: then a Try
     again, focused, for the remote's OK. -->
<main id="opening"><h1>Wingtip Maps</h1><p>Opening…</p></main>
<main id="offline">
  <h1>No connection</h1>
  <p>Wingtip Maps needs the internet. Check the TV's network, then try again.</p>
  <button id="again">Try again</button>
</main>
<script src="site.js"></script>
<script>
  // site.js, written as the app is packaged (tv/package.sh): the site's
  // address and the TV's platform.
  var site = window.WINGTIP_URL || "https://wingtipmaps.app/app/plan";
  var platform = window.WINGTIP_TV || "webos";
  function offline() {
    document.getElementById("opening").style.display = "none";
    document.getElementById("offline").style.display = "block";
    document.getElementById("again").focus();
  }
  // A TV on a network without the internet, or with the site down, still
  // says it is online, and the engine's own error page has no Try again:
  // so the site is asked first (no-cors: only whether it answers matters).
  function go() {
    if (navigator.onLine === false) return offline();
    var done = false;
    var timer = setTimeout(function () { settle(offline); }, 8000);
    function settle(next) {
      if (done) return;
      done = true;
      clearTimeout(timer);
      next();
    }
    function open() {
      location.replace(site + (site.indexOf("?") < 0 ? "?" : "&") + "tv=" + platform);
    }
    if (window.fetch) fetch(site, { mode: "no-cors", cache: "no-store" }).then(function () { settle(open); }, function () { settle(offline); });
    else settle(open);
  }
  document.getElementById("again").onclick = go;
  window.addEventListener("online", go);
  go();
</script>
</body>
</html>
