name: iOS

# The iOS app (web/ios, web/capacitor.config.ts; docs/IOS.md). Every
# change to it is built for the simulator, unsigned, on GitHub's macOS
# runner (free for a public repository): proof that the project and its
# plugins compile. On main, once the owner has set the App Store Connect
# key, the app is archived, signed by Xcode's cloud-managed signing with
# that key, and uploaded to TestFlight -- nothing signs on a pull request.
#
# Actions are pinned as in ci.yml (its opening comment says why).
on:
  pull_request:
    paths:
      - web/ios/**
      - web/ios-offline/**
      - web/capacitor.config.ts
      - web/package.json
      - web/package-lock.json
      - .github/workflows/ios.yml
  push:
    branches: [main]
    paths:
      - web/ios/**
      - web/ios-offline/**
      - web/capacitor.config.ts
      - web/package.json
      - web/package-lock.json
      - .github/workflows/ios.yml
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The site the app wraps, and its host (the app-bound and associated
  # domain): the repo variable once the domain exists, a stand-in before.
  WINGTIP_URL: ${{ vars.WINGTIP_URL || 'https://wingtipmaps.app/app/plan' }}
  WINGTIP_BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID || 'app.wingtipmaps.ios' }}

jobs:
  simulator:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7
        with:
          node-version-file: .nvmrc
      - name: The shell, with its plugins
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npx cap sync ios
      - name: Built for the simulator, unsigned
        working-directory: web/ios/App
        run: |
          host=$(node -e 'console.log(new URL(process.env.WINGTIP_URL).host)')
          xcodebuild -project App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO WINGTIP_HOST="$host" PRODUCT_BUNDLE_IDENTIFIER="$WINGTIP_BUNDLE_ID" \
            build | tail -40

  testflight:
    needs: simulator
    # main only: a run started by hand from another branch builds for the
    # simulator but uploads nothing.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.APP_STORE_KEY_ID != ''
    runs-on: macos-26
    timeout-minutes: 45
    env:
      TEAM: ${{ vars.APPLE_TEAM_ID }}
      KEY_ID: ${{ vars.APP_STORE_KEY_ID }}
      ISSUER: ${{ vars.APP_STORE_ISSUER_ID }}
      KEY_P8: ${{ secrets.APP_STORE_KEY_P8 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7
        with:
          node-version-file: .nvmrc
      - name: The shell, with its plugins
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npx cap sync ios
      # Xcode signs with the team's own cloud-managed certificate and
      # profile, fetched with the App Store Connect key: no certificate
      # or profile is kept in the repository or its secrets. The build
      # number is this workflow's run number, which only grows.
      - name: Archived, signed and uploaded to TestFlight
        working-directory: web/ios/App
        run: |
          key="$RUNNER_TEMP/AuthKey_$KEY_ID.p8"
          # Gone however the step ends, a failed archive included.
          trap 'rm -f "$key"' EXIT
          printf '%s' "$KEY_P8" > "$key"
          host=$(node -e 'console.log(new URL(process.env.WINGTIP_URL).host)')
          auth=(-allowProvisioningUpdates -authenticationKeyPath "$key" -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER")
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" "${auth[@]}" \
            DEVELOPMENT_TEAM="$TEAM" PRODUCT_BUNDLE_IDENTIFIER="$WINGTIP_BUNDLE_ID" WINGTIP_HOST="$host" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" archive | tail -40
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM</string>
            <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" "${auth[@]}"
