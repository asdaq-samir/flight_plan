name: CI

# Every action below is pinned to a commit, with its release tag in the
# comment beside it. A tag is a movable pointer in someone else's
# repository: whoever can write there can repoint v4 at new code, and
# these jobs hold a registry token and, in the deploy job, AWS
# credentials. A commit cannot be repointed.
#
# All of them are on their newest major, because anything older still
# declares `runs: using: node20` in its own action.yml and the runner
# has begun force-upgrading those and warning about it. Every removal in
# those majors was checked against what this file passes: none of the
# dropped inputs or environment variables is used here, and the Java
# distribution is temurin rather than the Adopt builds setup-java v6
# removed. They all need Actions Runner v2.327.1 or newer, which the
# GitHub-hosted runners are well past.
#
# The comment is what to read; the SHA is what runs. To take a new
# release, resolve its tag to a commit
# (`gh api repos/<owner>/<repo>/git/ref/tags/<tag>`, following the
# object through `git/tags/<sha>` for an annotated tag) and update both.
# Dependabot updates a pinned action and its comment together.
#
# The runner image is named rather than `ubuntu-latest`, for a smaller
# version of the same reason: GitHub moves that label to a new Ubuntu
# over several weeks (24.04 to 26.04 from October 19, 2026), and while
# it does, one run's jobs can land on either image. The next LTS is a
# change to this file, tested like any other.

on:
  push:
    branches: [main]
  pull_request:
  # Startable by hand. A run can fail for reasons that have nothing to
  # do with the commit under it -- a runner that never started, an
  # account limit -- and without this the only way to ask again is an
  # empty commit on main.
  workflow_dispatch:

# A new push to an open PR should replace the run already queued for its
# previous commit, not queue behind it -- otherwise every fixup push pays
# for a run whose result nobody will read.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Stated here rather than left to the repository's own default, which is
# a setting outside this file that can change without a commit touching
# it. Every job gets read access to the code and nothing else; the three
# that need more say so themselves, next to the step that needs it.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-26.04
    needs: [changes]
    if: needs.changes.outputs.test-root == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            src/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check src/vfr tests
      - run: pytest tests/ -v
      # vfr's API documentation, from its docstrings. pdoc imports every
      # module, so one that stops importing fails the job here. It needs
      # vfr's own list, installed above, and the CPU torch wheel for
      # vfr.torch_model -- the one module that imports a framework at its
      # top; the rest import theirs inside the functions that use them.
      # After the tests, so they run with the packages they always had.
      - name: pdoc (src/vfr)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install pdoc
          PYTHONPATH=src python -m pdoc src/vfr -o /tmp/pdoc-vfr --no-show-source
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: pdoc-vfr
          path: /tmp/pdoc-vfr
          retention-days: 30

  # The web front end. Its own job because it needs Node rather than
  # Python, and worth having at all because that is where the faults have
  # been: a TypeError on every selection, a function written and never
  # called, state kept on one of two code paths, a page that fitted its
  # map against a container it had measured wrong.
  #
  # tsc is half the value. Renaming a field and missing one call site was
  # silent in the pages this replaced; here it fails the build. The tests
  # cover the pure decisions -- which points a filter admits, what counts
  # as rated, which way the arrows step, which leg leaves a checkpoint --
  # which need no browser and so run like anything else.
  test-web:
    runs-on: ubuntu-26.04
    needs: [changes]
    if: needs.changes.outputs.test-web == 'true'
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # The API types, generated from planning-service/openapi.json --
      # test-planning-service proves that file matches the running app.
      - run: npm run types
      - run: npx tsc --noEmit
      - run: npx eslint .
      - run: npx vitest run
      - run: npx vite build
      # Advisory only (continue-on-error): reports known-vulnerable
      # dependencies without blocking a merge on one this repo can't fix
      # immediately (e.g. a transitive dep with no patched release yet).
      # Promote to blocking once an initial backlog is triaged.
      - run: npm audit --audit-level=high
        continue-on-error: true

  # webapp's own JUnit suite. Separate from `test` above because it needs a
  # JDK rather than Python, and separate from the image build because
  # Dockerfile builds with -DskipTests on purpose (an image build shouldn't
  # be the thing that runs your tests). Testcontainers drives a real
  # Postgres for the migration/persistence tests; GitHub runners provide
  # the Docker daemon it needs.
  test-webapp:
    runs-on: ubuntu-26.04
    needs: [changes]
    if: needs.changes.outputs.test-webapp == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6  # v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: mvn test (webapp)
        working-directory: springboot-app
        run: mvn -B test
      # A job's log takes admin rights on the repository to read; an
      # annotation shows on the commit's checks to anyone who can see it.
      # So each failing test is one: its assertion or exception, and the
      # causes under it (the stack between them says little).
      - name: Failing tests, as annotations
        if: failure()
        working-directory: springboot-app
        run: |
          python3 - <<'EOF'
          import glob, xml.etree.ElementTree as ET
          for path in sorted(glob.glob("target/surefire-reports/TEST-*.xml")):
              for case in ET.parse(path).getroot().iter("testcase"):
                  for problem in [*case.iter("failure"), *case.iter("error")]:
                      lines = (problem.text or problem.get("message") or "").strip().splitlines()
                      kept = lines[:6] + [line for line in lines[6:] if line.startswith("Caused by")]
                      text = "\n".join(kept).replace("%", "%25").replace("\r", "").replace("\n", "%0A")
                      test = case.get("classname").rsplit(".", 1)[-1] + "." + case.get("name")
                      test = test.replace("%", "%25").replace(":", "%3A").replace(",", "%2C")
                      print(f"::error title={test}::{text}")
          EOF

  # planning-service's own FastAPI-layer suite. Separate job for the same
  # reason as test-webapp: its own dependency set (requirements-dev.txt,
  # on top of the service's own requirements.txt), and no reason to gate
  # it on the root `test` job's unrelated src/vfr dependencies.
  test-planning-service:
    runs-on: ubuntu-26.04
    needs: [changes]
    if: needs.changes.outputs.test-planning-service == 'true'
    defaults:
      run:
        working-directory: planning-service
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            planning-service/requirements*.txt
            src/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests
      - run: pytest tests/ -v

  # model-service's own suite. Its requirements carry torch and
  # tensorflow (the candidates it serves), which is most of this job's
  # time, and none of the other suites needs them.
  test-model-service:
    runs-on: ubuntu-26.04
    needs: [changes]
    if: needs.changes.outputs.test-model-service == 'true'
    defaults:
      run:
        working-directory: model-service
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: model-service/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests
      - run: pytest tests/ -v

  # The two agents' suites. Each installs its own service's requirements,
  # the way its image does -- nav-log-agent takes the CPU torch wheel
  # first for the same reason its Dockerfile does. The suites mock the
  # database, planning-service and Claude, so nothing here is billed.
  test-nav-log-agent:
    runs-on: ubuntu-26.04
    needs: [changes]
    if: needs.changes.outputs.test-nav-log-agent == 'true'
    defaults:
      run:
        working-directory: nav-log-agent
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: nav-log-agent/requirements*.txt
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests
      - run: pytest tests/ -v
      # The agent's API documentation, from the packages its tests just
      # ran with -- its image's own list. pdoc imports every module.
      - name: pdoc (nav-log-agent)
        run: |
          pip install pdoc
          PYTHONPATH="$GITHUB_WORKSPACE/src" python -m pdoc app -o /tmp/pdoc-nav-log-agent --no-show-source
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: pdoc-nav-log-agent
          path: /tmp/pdoc-nav-log-agent
          retention-days: 30

  test-crewai-agent:
    runs-on: ubuntu-26.04
    needs: [changes]
    if: needs.changes.outputs.test-crewai-agent == 'true'
    defaults:
      run:
        working-directory: crewai-agent
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: crewai-agent/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests
      - run: pytest tests/ -v
      - name: pdoc (crewai-agent)
        run: |
          pip install pdoc
          PYTHONPATH="$GITHUB_WORKSPACE/src" python -m pdoc app -o /tmp/pdoc-crewai-agent --no-show-source
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: pdoc-crewai-agent
          path: /tmp/pdoc-crewai-agent
          retention-days: 30

  # What this run has to do, from what changed: the one job everything
  # else waits on, and quick (a checkout and a diff). Each test job, the
  # browser suite and each image then runs only if something it reads
  # changed -- a change to the planner's Python runs the planner's tests,
  # the browser suite (the planner is in its stack) and the planner's
  # image, and none of the React, Spring or agent jobs.
  #
  # Changed since when: on main, since the last commit whose run went
  # green, not the commit before this push. A run that failed publishes
  # nothing, so the next one has to build what that one did not; "since
  # the previous commit" left an image unpublished for good whenever
  # the run that changed it failed. On a pull request, what the PR
  # changes. A run started by hand, a first run, or a main whose history
  # was rewritten past its last green commit does everything.
  changes:
    runs-on: ubuntu-26.04
    # paths-filter asks the API which files a PR touches, which the
    # default token cannot do ("Resource not accessible by integration"
    # otherwise); `actions: read` is for finding the last green run.
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      images: ${{ steps.plan.outputs.images }}
      test-root: ${{ steps.plan.outputs.test-root }}
      test-web: ${{ steps.plan.outputs.test-web }}
      test-webapp: ${{ steps.plan.outputs.test-webapp }}
      test-planning-service: ${{ steps.plan.outputs.test-planning-service }}
      test-model-service: ${{ steps.plan.outputs.test-model-service }}
      test-nav-log-agent: ${{ steps.plan.outputs.test-nav-log-agent }}
      test-crewai-agent: ${{ steps.plan.outputs.test-crewai-agent }}
      e2e: ${{ steps.plan.outputs.e2e }}
      docs: ${{ steps.plan.outputs.docs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: The last green commit on main
        id: base
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
        run: |
          sha=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?branch=main&status=success&per_page=1" --jq '.workflow_runs[0].head_sha // ""' || true)
          status=""
          [ -n "$sha" ] && status=$(gh api "repos/$REPO/compare/$sha...$GITHUB_SHA" --jq .status || true)
          if [ "$EVENT" = push ] && { [ "$status" = ahead ] || [ "$status" = identical ]; }; then
            echo "sha=$sha" >> "$GITHUB_OUTPUT"
            echo "since the last green commit, ${sha:0:7}"
          else
            echo "all=true" >> "$GITHUB_OUTPUT"
            echo "everything: event $EVENT, last green ${sha:0:7}, compare '$status'"
          fi
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4
        id: filter
        with:
          # Ignored on a pull request, which diffs against its base.
          base: ${{ steps.base.outputs.sha }}
          filters: |
            # A change here can change what any job does: all of them.
            global:
              - .github/workflows/ci.yml
              - .github/ci-images.hcl
              - .dockerignore
              - pyproject.toml
            test-root:
              - src/**
              - tests/**
              - requirements-dev.txt
              # tests/test_requirements.py reads these
              - model-service/requirements*.txt
              - docker/requirements*.txt
            test-web:
              - web/**
              - .nvmrc
              - planning-service/openapi.json
              - springboot-app/openapi.json
            test-webapp:
              - springboot-app/**
            test-planning-service:
              - planning-service/**
              - src/**
            test-model-service:
              - model-service/**
            test-nav-log-agent:
              - nav-log-agent/**
              - src/**
            test-crewai-agent:
              - crewai-agent/**
              - src/**
            # The browser suite runs the whole stack a pilot touches, so
            # it is due whenever any of that could have changed.
            e2e:
              - web/**
              - springboot-app/**
              - planning-service/**
              - model-service/**
              - src/**
              - docker-compose.yml
              - docker-compose.ci.yml
            # Javadoc and godoc; each Python suite's job makes its pdoc.
            docs:
              - springboot-app/**
              - infra/lambda-retrain-trigger/**
            # The images, each by what its Dockerfile reads.
            ml:
              - docker/Dockerfile.ml
              - docker/requirements-ml*.txt
              - src/**
            pipeline-processing:
              - docker/Dockerfile.processing
              - docker/requirements-processing.txt
              - src/**
            pipeline-training:
              - docker/Dockerfile.training
              - docker/requirements-training.txt
              - src/**
            airflow:
              - docker/Dockerfile.airflow
              - airflow/**
              - src/**
            airflow-aws:
              - docker/Dockerfile.airflow.aws
              - airflow/dags/vfr_pipeline_aws_dag.py
              - src/**
            nav-log-agent:
              - nav-log-agent/**
              - src/**
            crewai-agent:
              - crewai-agent/**
              - src/**
            planning-service:
              - planning-service/**
              - src/**
            model-service:
              - model-service/**
            # web/** rather than the files the Dockerfile copies: a file
            # left off a hand-made list would leave the image stale, and
            # a change the image does not read (a spec) is a cache hit.
            webapp:
              - web/**
              - springboot-app/**
              - planning-service/openapi.json
      - name: What this run builds and tests
        id: plan
        env:
          CHANGED: ${{ steps.filter.outputs.changes }}
          ALL: ${{ steps.base.outputs.all }}
        run: |
          python3 - <<'EOF'
          import json, os
          changed = set(json.loads(os.environ.get("CHANGED") or "[]"))
          everything = os.environ.get("ALL") == "true" or "global" in changed
          # Every image this workflow builds: its context and Dockerfile.
          # model-service's context is its own directory; every other
          # image reads from the repository root (the webapp builds web/
          # into its first stage, the Python images copy src/).
          IMAGES = {
              "ml": (".", "docker/Dockerfile.ml"),
              "pipeline-processing": (".", "docker/Dockerfile.processing"),
              "pipeline-training": (".", "docker/Dockerfile.training"),
              "airflow": (".", "docker/Dockerfile.airflow"),
              "airflow-aws": (".", "docker/Dockerfile.airflow.aws"),
              "nav-log-agent": (".", "nav-log-agent/Dockerfile"),
              "crewai-agent": (".", "crewai-agent/Dockerfile"),
              "planning-service": (".", "planning-service/Dockerfile"),
              "model-service": ("./model-service", "./model-service/Dockerfile"),
              "webapp": (".", "./springboot-app/Dockerfile"),
          }
          due = lambda name: everything or name in changed
          images = [{"service": s, "context": c, "dockerfile": d} for s, (c, d) in IMAGES.items() if due(s)]
          outputs = {"images": json.dumps(images)}
          for name in ("test-root", "test-web", "test-webapp", "test-planning-service", "test-model-service",
                       "test-nav-log-agent", "test-crewai-agent", "e2e", "docs"):
              outputs[name] = "true" if due(name) else "false"
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              for key, value in outputs.items():
                  out.write(f"{key}={value}\n")
          print(json.dumps({**outputs, "images": [i["service"] for i in images]}, indent=2))
          EOF

  # The browser suite (web/e2e, Playwright) against the stack a pilot
  # uses: the webapp, the planner and the model service built here from
  # this commit, Postgres and Mailpit as docker-compose.yml runs them,
  # under docker-compose.ci.yml. It is what catches what no unit test
  # can -- a tap lost to a race, a drawer that opens empty, a request
  # the phone's port dropped.
  #
  # Split six ways (`--shard`), each runner with a stack of its own:
  # the suite is 180 tests, four and a half minutes on one runner, 38 to
  # 78 seconds on each of four (the split is by test, so layout.spec's
  # forty-four spread over several shards). Six, not more: the account
  # runs twenty jobs at once, and six shards, the seven suites, the docs
  # and five image builds are nineteen. What each runner spends before
  # its first test is the rest, so that is done at once rather than in
  # turn: the three images are built (from the registry cache main
  # writes) and the Playwright, Postgres and Mailpit images pulled in the
  # background while the caches below are restored.
  #
  # The planner fetches its reference data for itself into data/raw:
  # the FAA obstacle file and the airport tables (about 800 MB, from an
  # FAA page that is the slow part) are kept in the Actions cache
  # between runs; its key names what is fetched, and a change to that
  # fetches afresh. The corridor's chart sheets and the tiles the suite
  # has had rendered from them are a second cache, keyed by the FAA
  # cycle: fetched once a cycle, not once a run. Only the first shard
  # saves them: the six would race to write the same keys.
  #
  # The tests run in the Playwright image, the same one web/README.md
  # runs them in locally, on the runner's network so localhost is the
  # stack's.
  e2e:
    name: e2e (${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-26.04
    needs: [changes]
    if: needs.changes.outputs.e2e == 'true'
    # packages: read -- the registry cache is private, like the images.
    permissions:
      contents: read
      packages: read
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4
        with:
          # The runner is thrown away after the job: removing the builder
          # first was ten seconds at the end of every shard.
          cleanup: false
      # In the background, each with its own log and its exit status in a
      # file (a later step waits on those): the three images, loaded into
      # this runner's Docker under the names docker-compose.ci.yml gives
      # them (.github/ci-images.hcl), and the three images pulled rather
      # than built -- Postgres and Mailpit started as soon as they are,
      # so the stack below waits only on the services built here. The model service is its `slim` stage, without the
      # torch and tensorflow the suite's scikit-learn fixture never loads.
      # No attestation: these are for this runner's Docker only, and the
      # docker exporter refuses one.
      - name: The images, in the background
        env:
          CACHE_REGISTRY: ghcr.io/${{ github.repository }}
          BUILDX_NO_DEFAULT_ATTESTATIONS: "1"
        run: |
          mkdir -p /tmp/e2e-out
          nohup bash -c 'docker buildx bake -f .github/ci-images.hcl ci --load > /tmp/e2e-out/bake.log 2>&1; r=$?; echo $SECONDS > /tmp/e2e-out/bake.secs; echo $r > /tmp/e2e-out/bake.exit' > /dev/null 2>&1 < /dev/null &
          nohup bash -c '{ docker compose -f docker-compose.yml -f docker-compose.ci.yml pull -q db mailpit && docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d db mailpit && docker pull -q mcr.microsoft.com/playwright:v1.55.1-noble; } > /tmp/e2e-out/pull.log 2>&1; r=$?; echo $SECONDS > /tmp/e2e-out/pull.secs; echo $r > /tmp/e2e-out/pull.exit' > /dev/null 2>&1 < /dev/null &

      # data/raw's entries, not data/raw itself: a directory the cache is
      # given is archived whole, and a "!" line drops only an entry the
      # patterns above it listed. Given `data/raw`, this cache held the
      # charts and tiles as well -- 2.4 GB of which 2.1 was the next
      # step's, restored twice on every shard. The same list is in the
      # step that saves it (the list is part of the cache's version).
      - name: Restore the planner's reference data
        id: data
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            data/raw/*
            !data/raw/charts.nosync
            !data/raw/chart_tiles.nosync
          key: planner-data-v1-${{ hashFiles('data/processed/candidates_*.csv', 'src/vfr/faa_data.py', 'src/vfr/airports.py', 'src/vfr/elevation.py', 'src/vfr/charts.py') }}
          restore-keys: planner-data-v1-
      - name: Restore the corridor's charts
        id: charts
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            data/raw/charts.nosync
            data/raw/chart_tiles.nosync
          key: planner-charts-v1-pending
          restore-keys: planner-charts-v1-
      # The suite's packages, as installed in the Playwright image before:
      # a restore of web/node_modules rather than an `npm ci` each run.
      - name: Restore the suite's packages
        id: packages
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: web/node_modules
          key: e2e-node-modules-pw1.55.1-${{ hashFiles('web/package-lock.json') }}

      - name: Wait for the images
        run: |
          for job in pull bake; do
            while [ ! -f /tmp/e2e-out/$job.exit ]; do sleep 1; done
            if [ "$(cat /tmp/e2e-out/$job.exit)" != 0 ]; then
              tail -40 /tmp/e2e-out/$job.log
              tail -25 /tmp/e2e-out/$job.log | python3 -c 'import sys; t=sys.stdin.read().replace("%","%25").replace("\n","%0A"); print(f"::error title='"$job"' failed::{t[:4000]}")'
              exit 1
            fi
          done
          grep -E "^#[0-9]+ (DONE|CACHED)" /tmp/e2e-out/bake.log | tail -3 || true
          # How long the background work took, beside the steps' own
          # times, which are all the checks page shows; from one shard.
          times="built and loaded in $(cat /tmp/e2e-out/bake.secs) s, pulled in $(cat /tmp/e2e-out/pull.secs) s, from the step that started them"
          echo "the images: $times"
          if [ "${{ matrix.shard }}" = 1 ]; then echo "::notice title=the images::$times"; fi

      # The planner runs as a user of its own and writes under data/:
      # what it fetches into data/raw, the ratings and notes the training
      # tests make in data/labels. The checkout is the runner's, and the
      # planner's first run here could not so much as create data/raw. So
      # the tree is opened to it first. And the route's elevations are
      # seeded from the suite's own copy (163 points of the C81-KDLH
      # corridor): the USGS lookup the planner would make for each
      # answers a GitHub runner with 403, and without them there is no
      # terrain, so no altitude, so no nav log.
      - name: Start the stack
        run: |
          mkdir -p data/raw
          cp -n web/e2e/fixtures/elevation_cache.csv data/raw/elevation_cache.csv
          chmod -R a+rwX data
          # All three named: under docker-compose.ci.yml none waits on
          # another, so they start together, and the webapp alone would
          # bring up only itself and the database.
          docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d --no-build --wait webapp planning-service model-service
      # Healthy is not ready: the webapp answers its readiness probe a
      # little before it serves the page, and the planner answers its
      # probe while still loading airspace and obstacles (and, from a
      # cold cache, fetching them) -- under which the first tests timed
      # out. So: the page, then the planner's own word that it is warm.
      - name: Wait for the page and a warm planner
        run: |
          for i in $(seq 1 120); do
            curl -sf -o /dev/null http://localhost:8080/app/plan && break
            sleep 2
          done
          for i in $(seq 1 450); do
            curl -sf http://localhost:8084/ | grep -q '"warm":true' && break
            sleep 2
          done
          curl -sf http://localhost:8084/ | grep -q '"warm":true' || { echo "the planner never reported itself warm"; exit 1; }
      # The cycle the planner is serving: what the charts cache is
      # keyed by, at the end of the job.
      - name: The chart cycle
        id: cycle
        if: matrix.shard == 1
        run: |
          cycle=$(curl -sf http://localhost:8084/api/status | python3 -c 'import json, sys; print(json.load(sys.stdin)["charts"]["cycle"])')
          echo "cycle=$cycle" >> "$GITHUB_OUTPUT"
          echo "serving cycle $cycle; restored ${{ steps.charts.outputs.cache-matched-key || 'no chart cache' }}"
      # What the planner has to work with, on the commit's checks: a
      # job's log takes admin rights to read, an annotation does not.
      # "Warm" means the warm-up finished, not that every fetch in it
      # succeeded, and a planner without its obstacle file or its charts
      # answers every nav log and tile slowly and wrongly. Once, from the
      # first shard: the shards' stacks are alike.
      - name: The planner's data, as annotations
        if: matrix.shard == 1
        run: |
          python3 - <<'EOF'
          import json, subprocess, urllib.request
          def notice(title, text):
              text = text.replace("%", "%25").replace("\r", "").replace("\n", "%0A")[:4000]
              print(f"::notice title={title}::{text}")
          try:
              s = json.load(urllib.request.urlopen("http://localhost:8084/api/status", timeout=60))
              notice("planner data", json.dumps({
                  "faa_files": [f["name"] for f in s["faa_files"]],
                  "weather": {w["name"]: w["fetched_at"] for w in s["weather"]},
                  "charts": s["charts"]["prepared"],
                  "corridors": len(s["corridors"]),
                  "services": {k: (v or {}).get("up") for k, v in s["services"].items()},
              }))
          except Exception as err:
              notice("planner status", f"unavailable: {err!r}")
          log = subprocess.run(["docker", "compose", "-f", "docker-compose.yml", "-f", "docker-compose.ci.yml",
                                "logs", "--no-color", "--tail", "400", "planning-service"], capture_output=True, text=True).stdout
          kept = [l.split("| ", 1)[-1] for l in log.splitlines()
                  if any(k in l for k in ("warm-up", "unavailable", "downloaded", "prepared ", "Error", "error", "Traceback", "refreshed"))]
          notice("planner log", "\n".join(kept[-40:]) or "(nothing matched)")
          reach = {}
          for url in ("https://www.faa.gov/air_traffic/flight_info/aeronav/aero_data/NASR_Subscription/",
                      "https://aeronav.faa.gov/visual/09-03-2026/sectional-files/Chicago.zip",
                      "https://epqs.nationalmap.gov/v1/json?x=-88.09&y=42.32&units=Feet&wkid=4326",
                      "https://davidmegginson.github.io/ourairports-data/airports.csv",
                      "https://aviationweather.gov/data/cache/metars.cache.csv.gz"):
              try:
                  r = urllib.request.Request(url, method="HEAD", headers={"User-Agent": "vfr-route-learning-project/0.1"})
                  reach[url] = urllib.request.urlopen(r, timeout=20).status
              except Exception as err:
                  reach[url] = repr(err)[:120]
          notice("reachable from the runner", json.dumps(reach))
          EOF

      - name: The suite's packages, when they were not restored
        if: steps.packages.outputs.cache-hit != 'true'
        run: |
          docker run --rm --network host -v "$PWD/web:/w" -v /tmp/e2e-out:/out -w /w \
            mcr.microsoft.com/playwright:v1.55.1-noble \
            sh -c "timeout 600 npm ci --no-audit --no-fund 2>&1 | tail -20 | tee /out/npm.log"
      - name: Browser tests
        id: tests
        # CI=1 is what playwright.config.ts doubles its waits on. The
        # github reporter puts each failure on the commit's checks, as
        # the webapp's job does for its tests; the list goes to a file
        # for the step below, since the job's log takes admin rights to
        # read. Thirty minutes, and then the step ends and says so.
        run: |
          docker run --rm --network host -e CI=1 \
            -v "$PWD/web:/w" -v /tmp/e2e-out:/out -w /w \
            mcr.microsoft.com/playwright:v1.55.1-noble \
            bash -o pipefail -c "timeout 1800 npx playwright test --shard=${{ matrix.shard }}/${{ strategy.job-total }} --reporter=list,github 2>&1 | tee /out/playwright.log"
      - name: How the tests went, as an annotation
        if: always()
        env:
          SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
        run: |
          python3 - <<'EOF'
          import os, re
          def say(level, title, text):
              text = text.replace("%", "%25").replace("\r", "").replace("\n", "%0A")[:4000]
              print(f"::{level} title={title}::{text}")
          shard = os.environ["SHARD"]
          path = "/tmp/e2e-out/playwright.log"
          if not os.path.exists(path):
              say("warning", f"shard {shard}: no output", "the tests never wrote their log")
          else:
              lines = open(path, errors="replace").read().splitlines()
              summary = [l for l in lines if re.match(r"\s*\d+ (passed|failed|flaky|skipped)", l)]
              say("notice" if summary else "warning", f"shard {shard}", "\n".join(summary + ["--"] + lines[-40:]))
          EOF
      - name: The stack's logs, when the tests did not pass
        if: always() && steps.tests.outcome != 'success'
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci.yml logs --no-color --tail 300 webapp planning-service model-service
          docker compose -f docker-compose.yml -f docker-compose.ci.yml logs --no-color --tail 60 planning-service \
            | grep -vE "GET /api/(chart-tile|tiles)|200 OK|404 Not Found" | tail -25 \
            | python3 -c 'import sys; t=sys.stdin.read().replace("%","%25").replace("\n","%0A"); print(f"::warning title=planner log, at the end::{t[:4000]}")'
      - name: Traces and screenshots, when the tests did not pass
        if: always() && steps.tests.outcome != 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: playwright-results-${{ matrix.shard }}
          path: web/test-results
          if-no-files-found: ignore

      - name: Keep the suite's packages
        if: matrix.shard == 1 && steps.packages.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: web/node_modules
          key: ${{ steps.packages.outputs.cache-primary-key }}
      # Saved whether or not the tests passed, so a run that failed on
      # a test does not fetch a gigabyte again next time.
      - name: Keep the planner's reference data
        if: always() && matrix.shard == 1 && steps.data.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            data/raw/*
            !data/raw/charts.nosync
            !data/raw/chart_tiles.nosync
          key: ${{ steps.data.outputs.cache-primary-key }}
      # The charts and tiles, once per FAA cycle: saved when what was
      # restored was another cycle's or nothing, with the tiles this
      # run rendered in it.
      - name: Keep the corridor's charts
        if: always() && matrix.shard == 1 && steps.cycle.outputs.cycle != '' && steps.charts.outputs.cache-matched-key != format('planner-charts-v1-{0}', steps.cycle.outputs.cycle)
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            data/raw/charts.nosync
            data/raw/chart_tiles.nosync
          key: planner-charts-v1-${{ steps.cycle.outputs.cycle }}

  # Every image whose inputs changed, built beside the tests rather than
  # after them, each on a runner of its own. On main each is pushed under
  # this commit's tag (`:sha-<commit>`), never `:latest`: `promote` gives
  # it that name once every test has passed, which is a copy of the
  # manifest, seconds. A pull request builds without pushing -- the build
  # is the check that its Dockerfile still builds.
  #
  # The layer cache lives in the registry (ghcr.io/…/<service>:buildcache,
  # every stage's layers, mode=max), written from main: not evicted, and
  # a pull request and the browser suite's runners read it. The Actions
  # cache it replaces is 10 GB for the whole repository, and the ML
  # images' torch and tensorflow layers evicted each other out of it, so
  # the ML image was built from nothing on most pushes (6.7 of a run's 15
  # minutes). Nothing reads that cache now: read second while it aged
  # out, it still held the index of the ML image's layers but not the
  # layers, so every step matched, no layer could be fetched, and the
  # image was built from nothing anyway -- 4.5 minutes, 2026-09-29.
  build-images:
    name: build (${{ matrix.service }})
    runs-on: ubuntu-26.04
    needs: [changes]
    if: needs.changes.outputs.images != '[]'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      # Five at a time. The account runs twenty jobs at once, and a run
      # that changes everything is seven test jobs, six shards, the docs
      # and ten images: with no cap, the last shard of four once waited
      # 1.8 minutes for a runner behind the image builds, which are not
      # what the run waits on. Seven, six, one and five are nineteen.
      max-parallel: 5
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.images) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Each Python image imports its own code, and the packages that code
      # imports lazily, as the last step of its build -- so a missing
      # dependency fails the build here and in a local `docker compose
      # build` alike, and a broken image is never pushed.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/${{ github.repository }}/${{ matrix.service }}:sha-${{ github.sha }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}/${{ matrix.service }}:buildcache
          # Written from main only: a pull request (a fork's included)
          # has no business writing what main's builds read.
          cache-to: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && format('type=registry,ref=ghcr.io/{0}/{1}:buildcache,mode=max,image-manifest=true,oci-mediatypes=true', github.repository, matrix.service) || '' }}

  # The images this run built become `:latest`, once every test has
  # passed: a copy of each manifest from its commit tag, which takes
  # seconds -- the build is not repeated. `!contains(… 'failure')`
  # rather than the implicit success(), which a skipped job fails: the
  # jobs whose inputs did not change are skipped, not failed.
  promote:
    runs-on: ubuntu-26.04
    needs: [changes, build-images, test, test-web, test-webapp, test-planning-service, test-model-service, test-nav-log-agent, test-crewai-agent, e2e]
    if: >-
      !cancelled() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
      && github.event_name == 'push' && github.ref == 'refs/heads/main'
      && needs.changes.outputs.images != '[]'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # `imagetools` needs no builder of its own: the runner's buildx
      # copies a manifest with the docker driver it already has. All at
      # once, and the step fails if any copy did.
      - name: This commit's images, as latest
        env:
          IMAGES: ${{ needs.changes.outputs.images }}
          REPO: ghcr.io/${{ github.repository }}
        run: |
          for service in $(jq -r '.[].service' <<<"$IMAGES"); do
            docker buildx imagetools create --tag "$REPO/$service:latest" "$REPO/$service:sha-$GITHUB_SHA" &
          done
          failed=0
          for job in $(jobs -p); do wait "$job" || failed=1; done
          exit "$failed"

  # Regenerates the webapp's and the retrain trigger's documentation, so
  # a broken {@link} or a Go package that stops building is caught here
  # rather than discovered later. Output is uploaded as a build artifact
  # (Actions -> this run -> Artifacts), so current docs are a click away
  # without regenerating them locally.
  #
  # The Python documentation (pdoc) is made by the test, test-nav-log-agent
  # and test-crewai-agent jobs, each from the packages its tests have just
  # installed, and uploaded as pdoc-vfr, pdoc-nav-log-agent and
  # pdoc-crewai-agent. This job used to build the ML, nav-log-agent and
  # crewai-agent images for pdoc's sake: the image builds' work a second
  # time, 3.6 to 9.8 minutes and the longest job of a run, and so on
  # pushes to main only. In the suites' jobs it takes seconds, and pull
  # requests get it too.
  docs:
    runs-on: ubuntu-26.04
    needs: [changes]
    if: needs.changes.outputs.docs == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6  # v6
        with:
          distribution: temurin
          java-version: "25"
          # As test-webapp does. Javadoc resolves the same dependency
          # tree, and without this it downloads all of it every run.
          cache: maven
      - name: Javadoc (webapp)
        working-directory: springboot-app
        run: mvn -q javadoc:javadoc

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7
        with:
          go-version: "1.25"
      - name: godoc (lambda-retrain-trigger)
        working-directory: infra/lambda-retrain-trigger
        run: |
          go build ./...
          go vet ./...
          go doc -all -u . > /tmp/godoc-retrain-trigger.txt

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: documentation
          retention-days: 30
          path: |
            springboot-app/target/reports/apidocs
            /tmp/godoc-retrain-trigger.txt

  # Pushes every image the CloudFormation stack actually deploys
  # (infra/cloudformation/template.yaml's *ImageUri parameters) to ECR,
  # alongside the GHCR publish above. Reads build-images' registry cache,
  # so this is a cache hit, not a second real build. Authenticates
  # via OIDC (no long-lived AWS keys stored as secrets) -- activates
  # automatically once AWS_ROLE_ARN/AWS_REGION are set as repo variables
  # (Settings -> Secrets and variables -> Actions -> Variables); skipped
  # entirely until then. ecrRepo is separate from the build-images `service`
  # name only for airflow-aws, whose ECR repo is named `airflow` (matching
  # AirflowImageUri) even though its registry cache stays `airflow-aws`
  # (distinct from the *local* airflow image also built above).
  push-ecr:
    runs-on: ubuntu-26.04
    needs: promote
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AWS_ROLE_ARN != ''
    permissions:
      contents: read
      id-token: write
      packages: read
    strategy:
      matrix:
        include:
          # Repo root as context, for the same reason as build-images:
          # the Dockerfile builds web/ as its first stage.
          - service: webapp
            ecrRepo: webapp
            context: .
            dockerfile: ./springboot-app/Dockerfile
          - service: planning-service
            ecrRepo: planning-service
            context: .
            dockerfile: planning-service/Dockerfile
          - service: model-service
            ecrRepo: model-service
            context: ./model-service
            dockerfile: ./model-service/Dockerfile
          - service: nav-log-agent
            ecrRepo: nav-log-agent
            context: .
            dockerfile: nav-log-agent/Dockerfile
          - service: crewai-agent
            ecrRepo: crewai-agent
            context: .
            dockerfile: crewai-agent/Dockerfile
          - service: airflow-aws
            ecrRepo: airflow
            context: .
            dockerfile: docker/Dockerfile.airflow.aws
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4
      # The registry cache is private, like the images: without this the
      # cache is refused, quietly, and every image built from nothing.
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd  # v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - id: ecr-login
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd  # v2
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.ecr-login.outputs.registry }}/vfr-route/${{ matrix.ecrRepo }}:latest
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}/${{ matrix.service }}:buildcache
