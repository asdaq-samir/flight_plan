name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: ruff check src/vfr tests
      - run: pytest tests/ -v

  build-images:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: ml
            context: .
            dockerfile: docker/Dockerfile.ml
          - service: pipeline-processing
            context: .
            dockerfile: docker/Dockerfile.processing
          - service: pipeline-training
            context: .
            dockerfile: docker/Dockerfile.training
          - service: airflow
            context: .
            dockerfile: docker/Dockerfile.airflow
          - service: nav-log-agent
            context: .
            dockerfile: nav-log-agent/Dockerfile
          - service: crewai-agent
            context: .
            dockerfile: crewai-agent/Dockerfile
          - service: model-service
            context: ./model-service
            dockerfile: ./model-service/Dockerfile
          - service: webapp
            context: ./springboot-app
            dockerfile: ./springboot-app/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Only authenticate/push on main -- PRs (including from forks) don't
      # get write-scoped tokens, and shouldn't publish images anyway.
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/${{ github.repository }}/${{ matrix.service }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
