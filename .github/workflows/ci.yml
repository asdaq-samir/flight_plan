name: CI

# Every action below is pinned to a commit, with its release tag in the
# comment beside it. A tag is a movable pointer in someone else's
# repository: whoever can write there can repoint v4 at new code, and
# these jobs hold a registry token and, in the deploy job, AWS
# credentials. A commit cannot be repointed.
#
# All of them are on their newest major, because anything older still
# declares `runs: using: node20` in its own action.yml and the runner
# has begun force-upgrading those and warning about it. Every removal in
# those majors was checked against what this file passes: none of the
# dropped inputs or environment variables is used here, and the Java
# distribution is temurin rather than the Adopt builds setup-java v6
# removed. They all need Actions Runner v2.327.1 or newer, which the
# GitHub-hosted runners are well past.
#
# The comment is what to read; the SHA is what runs. To take a new
# release, resolve its tag to a commit
# (`gh api repos/<owner>/<repo>/git/ref/tags/<tag>`, following the
# object through `git/tags/<sha>` for an annotated tag) and update both.
# Dependabot updates a pinned action and its comment together.
#
# The runner image is named rather than `ubuntu-latest`, for a smaller
# version of the same reason: GitHub moves that label to a new Ubuntu
# over several weeks (24.04 to 26.04 from October 19, 2026), and while
# it does, one run's jobs can land on either image. The next LTS is a
# change to this file, tested like any other.

on:
  push:
    branches: [main]
  pull_request:
  # Startable by hand. A run can fail for reasons that have nothing to
  # do with the commit under it -- a runner that never started, an
  # account limit -- and without this the only way to ask again is an
  # empty commit on main.
  workflow_dispatch:

# A new push to an open PR should replace the run already queued for its
# previous commit, not queue behind it -- otherwise every fixup push pays
# for a run whose result nobody will read.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Stated here rather than left to the repository's own default, which is
# a setting outside this file that can change without a commit touching
# it. Every job gets read access to the code and nothing else; the three
# that need more say so themselves, next to the step that needs it.
permissions:
  contents: read

# The image the browser suite runs in (the e2e job), named once for the
# jobs that pull it and the one that makes the slim copy the tests run
# in (.github/ci-images.hcl's `playwright`). Its version is
# web/package-lock.json's @playwright/test, and the e2e job's packages
# cache is keyed by it too.
env:
  PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright:v1.55.1-noble

jobs:
  test:
    runs-on: ubuntu-26.04
    needs: [changes]
    if: needs.changes.outputs.test-root == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            src/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check src/vfr tests
      - run: pytest tests/ -v
      # vfr's API documentation, from its docstrings. pdoc imports every
      # module, so one that stops importing fails the job here. It needs
      # vfr's own list, installed above, and the CPU torch wheel for
      # vfr.torch_model -- the one module that imports a framework at its
      # top; the rest import theirs inside the functions that use them.
      # After the tests, so they run with the packages they always had.
      - name: pdoc (src/vfr)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install pdoc
          PYTHONPATH=src python -m pdoc src/vfr -o /tmp/pdoc-vfr --no-show-source
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: pdoc-vfr
          path: /tmp/pdoc-vfr
          retention-days: 30

  # The web front end. Its own job because it needs Node rather than
  # Python, and worth having at all because that is where the faults have
  # been: a TypeError on every selection, a function written and never
  # called, state kept on one of two code paths, a page that fitted its
  # map against a container it had measured wrong.
  #
  # tsc is half the value. Renaming a field and missing one call site was
  # silent in the pages this replaced; here it fails the build. The tests
  # cover the pure decisions -- which points a filter admits, what counts
  # as rated, which way the arrows step, which leg leaves a checkpoint --
  # which need no browser and so run like anything else.
  test-web:
    runs-on: ubuntu-26.04
    needs: [changes]
    if: needs.changes.outputs.test-web == 'true'
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # The API types, generated from planning-service/openapi.json --
      # test-planning-service proves that file matches the running app.
      - run: npm run types
      - run: npx tsc --noEmit
      - run: npx eslint .
      - run: npx vitest run
      - run: npx vite build
      # Advisory only (continue-on-error): reports known-vulnerable
      # dependencies without blocking a merge on one this repo can't fix
      # immediately (e.g. a transitive dep with no patched release yet).
      # Promote to blocking once an initial backlog is triaged.
      - run: npm audit --audit-level=high
        continue-on-error: true

  # webapp's own JUnit suite. Separate from `test` above because it needs a
  # JDK rather than Python, and separate from the image build because
  # Dockerfile builds with -DskipTests on purpose (an image build shouldn't
  # be the thing that runs your tests). Testcontainers drives a real
  # Postgres for the migration/persistence tests; GitHub runners provide
  # the Docker daemon it needs.
  test-webapp:
    runs-on: ubuntu-26.04
    needs: [changes]
    if: needs.changes.outputs.test-webapp == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6  # v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: mvn test (webapp)
        working-directory: springboot-app
        run: mvn -B test
      # A job's log takes admin rights on the repository to read; an
      # annotation shows on the commit's checks to anyone who can see it.
      # So each failing test is one: its assertion or exception, and the
      # causes under it (the stack between them says little).
      - name: Failing tests, as annotations
        if: failure()
        working-directory: springboot-app
        run: |
          python3 - <<'EOF'
          import glob, xml.etree.ElementTree as ET
          for path in sorted(glob.glob("target/surefire-reports/TEST-*.xml")):
              for case in ET.parse(path).getroot().iter("testcase"):
                  for problem in [*case.iter("failure"), *case.iter("error")]:
                      lines = (problem.text or problem.get("message") or "").strip().splitlines()
                      kept = lines[:6] + [line for line in lines[6:] if line.startswith("Caused by")]
                      text = "\n".join(kept).replace("%", "%25").replace("\r", "").replace("\n", "%0A")
                      test = case.get("classname").rsplit(".", 1)[-1] + "." + case.get("name")
                      test = test.replace("%", "%25").replace(":", "%3A").replace(",", "%2C")
                      print(f"::error title={test}::{text}")
          EOF

  # planning-service's own FastAPI-layer suite. Separate job for the same
  # reason as test-webapp: its own dependency set (requirements-dev.txt,
  # on top of the service's own requirements.txt), and no reason to gate
  # it on the root `test` job's unrelated src/vfr dependencies.
  test-planning-service:
    runs-on: ubuntu-26.04
    needs: [changes]
    if: needs.changes.outputs.test-planning-service == 'true'
    defaults:
      run:
        working-directory: planning-service
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            planning-service/requirements*.txt
            src/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests
      - run: pytest tests/ -v

  # model-service's own suite. Its requirements carry torch and
  # tensorflow (the candidates it serves), which is most of this job's
  # time, and none of the other suites needs them.
  test-model-service:
    runs-on: ubuntu-26.04
    needs: [changes]
    if: needs.changes.outputs.test-model-service == 'true'
    defaults:
      run:
        working-directory: model-service
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: model-service/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests
      - run: pytest tests/ -v

  # The two agents' suites. Each installs its own service's requirements,
  # the way its image does -- nav-log-agent takes the CPU torch wheel
  # first for the same reason its Dockerfile does. The suites mock the
  # database, planning-service and Claude, so nothing here is billed.
  test-nav-log-agent:
    runs-on: ubuntu-26.04
    needs: [changes]
    if: needs.changes.outputs.test-nav-log-agent == 'true'
    defaults:
      run:
        working-directory: nav-log-agent
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: nav-log-agent/requirements*.txt
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests
      - run: pytest tests/ -v
      # The agent's API documentation, from the packages its tests just
      # ran with -- its image's own list. pdoc imports every module.
      - name: pdoc (nav-log-agent)
        run: |
          pip install pdoc
          PYTHONPATH="$GITHUB_WORKSPACE/src" python -m pdoc app -o /tmp/pdoc-nav-log-agent --no-show-source
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: pdoc-nav-log-agent
          path: /tmp/pdoc-nav-log-agent
          retention-days: 30

  test-crewai-agent:
    runs-on: ubuntu-26.04
    needs: [changes]
    if: needs.changes.outputs.test-crewai-agent == 'true'
    defaults:
      run:
        working-directory: crewai-agent
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: crewai-agent/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests
      - run: pytest tests/ -v
      - name: pdoc (crewai-agent)
        run: |
          pip install pdoc
          PYTHONPATH="$GITHUB_WORKSPACE/src" python -m pdoc app -o /tmp/pdoc-crewai-agent --no-show-source
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: pdoc-crewai-agent
          path: /tmp/pdoc-crewai-agent
          retention-days: 30

  # What this run has to do, from what changed: the one job everything
  # else waits on, and quick (a checkout and a diff). Each test job, the
  # browser suite and each image then runs only if something it reads
  # changed -- a change to the planner's Python runs the planner's tests,
  # the browser suite (the planner is in its stack) and the planner's
  # image, and none of the React, Spring or agent jobs.
  #
  # Changed since when: on main, since the last commit whose run went
  # green, not the commit before this push. A run that failed publishes
  # nothing, so the next one has to build what that one did not; "since
  # the previous commit" left an image unpublished for good whenever
  # the run that changed it failed. On a pull request, what the PR
  # changes. A run started by hand, a first run, or a main whose history
  # was rewritten past its last green commit does everything.
  changes:
    runs-on: ubuntu-26.04
    # paths-filter asks the API which files a PR touches, which the
    # default token cannot do ("Resource not accessible by integration"
    # otherwise); `actions: read` is for finding the last green run.
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      images: ${{ steps.plan.outputs.images }}
      test-root: ${{ steps.plan.outputs.test-root }}
      test-web: ${{ steps.plan.outputs.test-web }}
      test-webapp: ${{ steps.plan.outputs.test-webapp }}
      test-planning-service: ${{ steps.plan.outputs.test-planning-service }}
      test-model-service: ${{ steps.plan.outputs.test-model-service }}
      test-nav-log-agent: ${{ steps.plan.outputs.test-nav-log-agent }}
      test-crewai-agent: ${{ steps.plan.outputs.test-crewai-agent }}
      e2e: ${{ steps.plan.outputs.e2e }}
      docs: ${{ steps.plan.outputs.docs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: The last green commit on main
        id: base
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
        run: |
          sha=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?branch=main&status=success&per_page=1" --jq '.workflow_runs[0].head_sha // ""' || true)
          status=""
          [ -n "$sha" ] && status=$(gh api "repos/$REPO/compare/$sha...$GITHUB_SHA" --jq .status || true)
          if [ "$EVENT" = push ] && { [ "$status" = ahead ] || [ "$status" = identical ]; }; then
            echo "sha=$sha" >> "$GITHUB_OUTPUT"
            echo "since the last green commit, ${sha:0:7}"
          else
            echo "all=true" >> "$GITHUB_OUTPUT"
            echo "everything: event $EVENT, last green ${sha:0:7}, compare '$status'"
          fi
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4
        id: filter
        with:
          # Ignored on a pull request, which diffs against its base.
          base: ${{ steps.base.outputs.sha }}
          filters: |
            # A change here can change what any job does: all of them.
            global:
              - .github/workflows/ci.yml
              - .github/ci-images.hcl
              - .dockerignore
              - pyproject.toml
            test-root:
              - src/**
              - tests/**
              - requirements-dev.txt
              # tests/test_requirements.py reads these
              - model-service/requirements*.txt
              - docker/requirements*.txt
            test-web:
              - web/**
              - .nvmrc
              - planning-service/openapi.json
              - springboot-app/openapi.json
            test-webapp:
              - springboot-app/**
            test-planning-service:
              - planning-service/**
              - src/**
            test-model-service:
              - model-service/**
            test-nav-log-agent:
              - nav-log-agent/**
              - src/**
            test-crewai-agent:
              - crewai-agent/**
              - src/**
            # The browser suite runs the whole stack a pilot touches, so
            # it is due whenever any of that could have changed.
            e2e:
              - web/**
              - springboot-app/**
              - planning-service/**
              - model-service/**
              - src/**
              - docker-compose.yml
              - docker-compose.ci.yml
              - .github/e2e-keys.sh
            # Javadoc and godoc; each Python suite's job makes its pdoc.
            docs:
              - springboot-app/**
              - infra/lambda-retrain-trigger/**
            # The images, each by what its Dockerfile reads.
            ml:
              - docker/Dockerfile.ml
              - docker/requirements-ml*.txt
              - src/**
            pipeline-processing:
              - docker/Dockerfile.processing
              - docker/requirements-processing.txt
              - src/**
            pipeline-training:
              - docker/Dockerfile.training
              - docker/requirements-training.txt
              - src/**
            airflow:
              - docker/Dockerfile.airflow
              - airflow/**
              - src/**
            airflow-aws:
              - docker/Dockerfile.airflow.aws
              - airflow/dags/vfr_pipeline_aws_dag.py
              - src/**
            nav-log-agent:
              - nav-log-agent/**
              - src/**
            crewai-agent:
              - crewai-agent/**
              - src/**
            planning-service:
              - planning-service/**
              - src/**
            model-service:
              - model-service/**
            # web/** rather than the files the Dockerfile copies: a file
            # left off a hand-made list would leave the image stale, and
            # a change the image does not read (a spec) is a cache hit.
            webapp:
              - web/**
              - springboot-app/**
              - planning-service/openapi.json
      - name: What this run builds and tests
        id: plan
        env:
          CHANGED: ${{ steps.filter.outputs.changes }}
          ALL: ${{ steps.base.outputs.all }}
        run: |
          python3 - <<'EOF'
          import json, os
          changed = set(json.loads(os.environ.get("CHANGED") or "[]"))
          everything = os.environ.get("ALL") == "true" or "global" in changed
          # Every image this workflow builds: its context and Dockerfile.
          # model-service's context is its own directory; every other
          # image reads from the repository root (the webapp builds web/
          # into its first stage, the Python images copy src/).
          IMAGES = {
              "ml": (".", "docker/Dockerfile.ml"),
              "pipeline-processing": (".", "docker/Dockerfile.processing"),
              "pipeline-training": (".", "docker/Dockerfile.training"),
              "airflow": (".", "docker/Dockerfile.airflow"),
              "airflow-aws": (".", "docker/Dockerfile.airflow.aws"),
              "nav-log-agent": (".", "nav-log-agent/Dockerfile"),
              "crewai-agent": (".", "crewai-agent/Dockerfile"),
              "planning-service": (".", "planning-service/Dockerfile"),
              "model-service": ("./model-service", "./model-service/Dockerfile"),
              "webapp": (".", "./springboot-app/Dockerfile"),
          }
          due = lambda name: everything or name in changed
          images = [{"service": s, "context": c, "dockerfile": d} for s, (c, d) in IMAGES.items() if due(s)]
          outputs = {"images": json.dumps(images)}
          for name in ("test-root", "test-web", "test-webapp", "test-planning-service", "test-model-service",
                       "test-nav-log-agent", "test-crewai-agent", "e2e", "docs"):
              outputs[name] = "true" if due(name) else "false"
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              for key, value in outputs.items():
                  out.write(f"{key}={value}\n")
          print(json.dumps({**outputs, "images": [i["service"] for i in images]}, indent=2))
          EOF

  # The browser suite (web/e2e, Playwright) against the stack a pilot
  # uses: the webapp, the planner and the model service built from this
  # commit (by e2e-images, below), Postgres and Mailpit as
  # docker-compose.yml runs them, under docker-compose.ci.yml. It is what
  # catches what no unit test can -- a tap lost to a race, a drawer that
  # opens empty, a request the phone's port dropped.
  #
  # Split eight ways (`--shard`), each runner with a stack of its own:
  # the suite is 180 tests, four and a half minutes on one runner (the
  # split is by test, so layout.spec's forty-four spread over several
  # shards). Six were 37 to 92 seconds of tests each, the same shard the
  # longest in every run, and with the setup down to 35 to 60 seconds the
  # tests were most of the run. Eight, not more: the account runs twenty
  # jobs at once, and eight shards, the seven suites, the docs, the e2e
  # images and three image builds at a time are twenty. What each runner
  # spends before its first test is the rest, so that is done at once
  # rather than in turn: the three images and the Playwright, Postgres
  # and Mailpit images are pulled in the background while the caches
  # below are restored, and each service is started the moment it can
  # be.
  #
  # The planner fetches its reference data for itself into data/raw:
  # the FAA obstacle file and the airport tables (about 800 MB, from an
  # FAA page that is the slow part) are kept in the Actions cache
  # between runs; its key names what is fetched, and a change to that
  # fetches afresh. The corridor's chart sheets and the tiles the suite
  # has had rendered from them are a second cache, keyed by the FAA
  # cycle: fetched once a cycle, not once a run -- and only the
  # corridor's ten sheets, since a tile here never sends for one
  # (docker-compose.ci.yml). Only the first shard saves them: the eight
  # would race to write the same keys.
  #
  # The tests run in the Playwright image, the same one web/README.md
  # runs them in locally, on the runner's network so localhost is the
  # stack's -- in a copy of it without the browsers the suite never
  # launches, every other file the image's own (.github/ci-images.hcl's
  # `playwright`). They ran on the runner itself for three runs (c797718
  # to f1cf1b7), with Playwright's own Chromium and no image to pull: one
  # test -- a nav log row clicked in view stays where it is -- failed or
  # flaked in each of them, and had passed in every run in the image.
  # The image is pulled in the background and waited for only before
  # the tests.
  e2e:
    name: e2e (${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-26.04
    needs: [changes]
    if: needs.changes.outputs.e2e == 'true'
    # packages: read -- the images are private, like the registry cache a
    # pull request's shards build from; actions: read, to ask after the
    # job that pushes them (below).
    permissions:
      contents: read
      packages: read
      actions: read
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # What a shard fetches and starts, in the background, each piece
      # with its own log and its exit status in a file (later steps wait
      # on those), while the caches below are restored. Each piece also
      # notes when it was done, in seconds from here, and each shard's
      # annotation lists those: where its time before the first test
      # went. It starts with the kind of runner the shard got. They are
      # of two kinds: on a runner whose disk is an "NVMe Accelerator" the
      # disk writes at most about 230 MB/s, a quarter of the setup goes
      # on waiting for it, and a shard's setup takes 10 to 20 seconds
      # longer (runs 36738594839 and 36739489654). Docker's own image
      # store in place of containerd's made no difference there worth a
      # restart of Docker (ab57887's measurement).
      #
      # Postgres and Mailpit are pulled first, before any other image:
      # they are small, and among the large ones they were in last, 20 to
      # 37 seconds into the job -- and no other service had started
      # before Postgres did, though nothing here asked them to wait for it
      # (run 36742507724). Then Mailpit is started, which makes the
      # stack's network, which the other services' starts need there
      # before them (two at once each make it, and one fails), and then
      # Postgres; only the webapp waits for Postgres.
      #
      # And the image the tests run in: the slim copy of the Playwright
      # image that e2e-images makes once for each of its digests
      # (.github/ci-images.hcl's `playwright`: 1.5 GB unpacked rather than
      # 2.6, zstd rather than gzip), under the image's own name, or the
      # image itself until there is one. It is the largest thing a shard
      # fetches, and often the last in before the tests, which alone
      # want it -- so it is waited for just before them.
      - name: The public images, in the background
        env:
          REGISTRY: ghcr.io/${{ github.repository }}
        run: |
          # web/dist: where the page will be built, mounted into the
          # webapp -- made now, so that Docker does not make it, as root.
          mkdir -p /tmp/e2e-out web/dist
          # The caches below are restored into memory, not onto the disk:
          # the planner's data and charts, and the suite's packages, about
          # 1.6 GB. On a runner whose disk writes at most about 230 MB/s
          # (an "NVMe Accelerator"), they took it for the first seconds
          # that every image needed it too. The stack's containers see them
          # as before: Docker's bind mounts take the mounts under them. The
          # runner's user owns them, as it owns what it restores into them
          # (a restore sets the directory's own mode and times).
          mkdir -p data/raw web/node_modules
          sudo mount -t tmpfs -o "size=8g,mode=0777,uid=$(id -u),gid=$(id -g)" tmpfs data/raw
          sudo mount -t tmpfs -o "size=2g,mode=0777,uid=$(id -u),gid=$(id -g)" tmpfs web/node_modules
          # And what is written to the disk goes to it as it is written,
          # a few hundred MB behind at most, rather than up to a fifth of
          # the memory (3 GB). On a slow disk each service's start waited
          # 20 to 27 seconds (run 36743209328): starting a container
          # syncs a file or two, and ext4 syncs first everything written
          # before it -- there, the gigabytes of images just unpacked. The
          # writing is the disk's pace either way; the syncs no longer
          # wait behind it.
          sudo sysctl -q -w vm.dirty_bytes=$((256 << 20)) vm.dirty_background_bytes=$((64 << 20))
          T0=$(date +%s)
          export T0
          echo "T0=$T0" >> "$GITHUB_ENV"
          nohup vmstat -n 1 180 > /tmp/e2e-out/vmstat.log 2>&1 < /dev/null &
          echo "0 the runner's disk: $(lsblk -e 7 -dno NAME,MODEL | xargs)" >> /tmp/e2e-out/timeline
          cat > /tmp/e2e-out/playwright.sh <<'EOF'
          digest=$(docker buildx imagetools inspect --raw "$PLAYWRIGHT_IMAGE" | sha256sum | cut -c1-16)
          until [ -f /tmp/e2e-out/small.pulled ]; do sleep 0.5; done
          if docker pull -q "$REGISTRY/e2e-playwright:$digest" > /dev/null 2>&1; then
            docker tag "$REGISTRY/e2e-playwright:$digest" "$PLAYWRIGHT_IMAGE" && echo "its slim copy"
          else
            docker pull -q "$PLAYWRIGHT_IMAGE" > /dev/null && echo "the image itself"
          fi
          EOF
          cat > /tmp/e2e-out/public.sh <<'EOF'
          mark() { echo "$(($(date +%s) - T0)) $*" >> /tmp/e2e-out/timeline; }
          compose() { docker compose -f docker-compose.yml -f docker-compose.ci.yml "$@"; }
          compose pull -q db > /tmp/e2e-out/db.log 2>&1 &
          db=$!
          compose pull -q mailpit > /tmp/e2e-out/net.log 2>&1
          wait $db
          mark "Postgres and Mailpit pulled"
          touch /tmp/e2e-out/small.pulled
          compose up -d mailpit >> /tmp/e2e-out/net.log 2>&1
          r=$?; mark "Mailpit up"; echo $r > /tmp/e2e-out/net.exit
          compose up -d db >> /tmp/e2e-out/db.log 2>&1
          r=$?; mark "Postgres up"; echo $r > /tmp/e2e-out/db.exit
          EOF
          nohup bash /tmp/e2e-out/public.sh > /dev/null 2>&1 < /dev/null &
          nohup bash -c 'bash /tmp/e2e-out/playwright.sh > /tmp/e2e-out/playwright.log 2>&1; r=$?; echo "$(($(date +%s) - T0)) the Playwright image, $(tail -1 /tmp/e2e-out/playwright.log)" >> /tmp/e2e-out/timeline; echo $r > /tmp/e2e-out/playwright.exit' > /dev/null 2>&1 < /dev/null &
      # Then the three images this commit runs, under the names
      # docker-compose.ci.yml runs them by: each the one e2e-images built
      # for its key (.github/e2e-keys.sh), which nearly always an earlier
      # commit's run did, so it is pulled at once. Each shard used to
      # build all three itself: the same work six times over, on runners
      # restoring caches and starting Postgres at the same time, and when
      # web/ had changed (most commits) that was the webapp's npm install
      # and bundle, six times -- 50 to 70 seconds before a shard could
      # start its stack. When this commit has a new key, a shard does not
      # wait for e2e-images to start (`needs`): it pulls the last image
      # pushed (`e2e`), which has most of the layers the new one will,
      # and pulls the new one the moment it is there -- only what changed.
      # If that job ends without it, the shard stops waiting and says so.
      #
      # Each service is started the moment it can be, not once all three
      # images are in: the model service as soon as its image is here and
      # the stack's network is made (Mailpit's start, above), the planner
      # once its data has been restored too (a later step says so), the
      # webapp once Postgres is up. Under docker-compose.ci.yml none waits
      # on another to start.
      #
      # And once the planner is warm, the corridor's nav log is asked for,
      # rather than by whichever test asks first (the default aircraft,
      # this hour: the key a test's own default request shares). Nothing
      # waits for it; when it ended goes in the shard's annotation. Not
      # the corridor's detections, which fb03710 asked for the same way:
      # that read takes a minute or more of the planner's time on a busy
      # runner, so it was still running long after the tests had started,
      # on every shard, when only the dev page's training tests ask for
      # it (they start it themselves, and the planner shares it).
      #
      # A pull request's token cannot push, so a key no image has yet is
      # built by its shards themselves, from the registry cache main
      # writes: with the runner's own builder, Docker's, whose image store
      # is containerd's, so it reads the registry cache and builds straight
      # into Docker (a BuildKit container of setup-buildx's took 5 to 15
      # seconds to start and then copied each image into Docker as a
      # tarball).
      - name: The stack, in the background
        env:
          REGISTRY: ghcr.io/${{ github.repository }}
          EVENT: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          GH_TOKEN: ${{ github.token }}
          BUILDX_NO_DEFAULT_ATTESTATIONS: "1"
        run: |
          cat > /tmp/e2e-out/stack.sh <<'EOF'
          mark() { echo "$(($(date +%s) - T0)) $*" >> /tmp/e2e-out/timeline; }
          there() { docker buildx imagetools inspect --raw "$1" > /dev/null 2>&1; }
          # Until e2e-images has pushed $1. After a minute, ask after that
          # job every twenty seconds: once it has ended, it never will.
          await() {
            local built
            until there "$1"; do
              sleep 2
              if [ "$SECONDS" -ge 60 ]; then
                built=$(gh api "repos/$REPOSITORY/actions/runs/$RUN_ID/jobs?per_page=100" \
                  --jq '.jobs[] | select(.name == "build (e2e)") | .conclusion // "running"')
                if [ "$built" != running ] && [ -n "$built" ] && ! there "$1"; then
                  echo "no $1, and build (e2e) ended: $built"
                  return 1
                fi
                sleep 18
              fi
            done
          }
          # Until Postgres and Mailpit are pulled, which go first.
          small() { until [ -f /tmp/e2e-out/small.pulled ]; do sleep 0.5; done; }
          # One image, $1, for its key, $2.
          fetch() {
            local ref=$REGISTRY/$1 built=yes
            there "$ref:e2e-$2" || built=""
            small
            if [ -z "$built" ]; then
              if [ "$EVENT" = pull_request ]; then
                docker buildx bake -f .github/ci-images.hcl "$1" --load || return 1
                mark "$1 built"
                return 0
              fi
              docker pull -q "$ref:e2e" > /dev/null 2>&1
              await "$ref:e2e-$2" || return 1
            fi
            docker pull -q "$ref:e2e-$2" > /dev/null || return 1
            docker tag "$ref:e2e-$2" "flight_plan-$1:ci"
            mark "$1 pulled"
          }
          # The page, for its key, $1: copied out of the image e2e-images
          # made of it into web/dist, which the webapp serves.
          page() {
            local ref=$REGISTRY/webapp:e2e-page-$1
            await "$ref" || return 1
            docker pull -q "$ref" > /dev/null || return 1
            docker create --name e2e-page "$ref" none > /dev/null || return 1
            docker cp e2e-page:/page/. web/dist/ > /dev/null || return 1
            docker rm e2e-page > /dev/null
            mark "the page copied"
          }
          start() {
            local after=net
            if [ "$1" = planning-service ]; then
              until [ -f /tmp/e2e-out/data.ready ]; do sleep 1; done
            elif [ "$1" = webapp ]; then
              after=db
            fi
            until [ -f /tmp/e2e-out/$after.exit ]; do sleep 1; done
            [ "$(cat /tmp/e2e-out/$after.exit)" = 0 ] || return 1
            mark "$1 starting"
            docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d --no-build "$1" || return 1
            mark "$1 started"
            if [ "$1" = planning-service ]; then
              nohup bash /tmp/e2e-out/first-reads.sh > /tmp/e2e-out/first-reads.log 2>&1 < /dev/null &
            fi
          }
          keys=$(bash .github/e2e-keys.sh) || exit 1
          while read -r name key; do
            if [ "$name" != page ]; then
              { fetch "$name" "$key" && start "$name"; } &
            elif [ "$EVENT" != pull_request ]; then
              page "$key" &
            fi
          done <<< "$keys"
          failed=0
          for job in $(jobs -p); do wait "$job" || failed=1; done
          exit "$failed"
          EOF
          cat > /tmp/e2e-out/first-reads.sh <<'EOF'
          until curl -sf http://localhost:8084/ | grep -q '"warm":true'; do sleep 1; done
          curl -sf -o /dev/null --max-time 600 "http://localhost:8084/api/navlog?dep=C81&dest=KDLH"
          echo "$(($(date +%s) - T0)) the nav log read, the first time (curl $?)" >> /tmp/e2e-out/timeline
          EOF
          nohup bash -c 'bash /tmp/e2e-out/stack.sh > /tmp/e2e-out/stack.log 2>&1; echo $? > /tmp/e2e-out/stack.exit' > /dev/null 2>&1 < /dev/null &

      # The planner's two caches first, since the planner starts once they
      # are in; the suite's packages after them, while the stack starts.
      #
      # data/raw's entries, not data/raw itself: a directory the cache is
      # given is archived whole, and a "!" line drops only an entry the
      # patterns above it listed. Given `data/raw`, this cache held the
      # charts and tiles as well -- 2.4 GB of which 2.1 was the next
      # step's, restored twice on every shard. The same list is in the
      # step that saves it (the list is part of the cache's version).
      - name: Restore the planner's reference data
        id: data
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            data/raw/*
            !data/raw/charts.nosync
            !data/raw/chart_tiles.nosync
          key: planner-data-v1-${{ hashFiles('data/processed/candidates_*.csv', 'src/vfr/faa_data.py', 'src/vfr/airports.py', 'src/vfr/elevation.py', 'src/vfr/charts.py') }}
          restore-keys: planner-data-v1-
      # v4: the charts cache with the corridor's detections in it as well
      # -- the planner keeps a finished read of the corridor beside the
      # tiles it read (planning-service/app/detection.py), and replays it
      # rather than reading the corridor again: a minute of a busy shard's
      # processors, which the one test that waits for it (the waypoint
      # drawer's) spent on the critical path every run. So the cache is
      # keyed by the reader's code as well as the cycle, and saved again
      # when either changes. v3 was the charts cache without the 29 sheets
      # past the corridor that v1 carried (2.1 GB), now 0.3 GB; a v4 run
      # starts from it.
      - name: Restore the corridor's charts
        id: charts
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            data/raw/charts.nosync
            data/raw/chart_tiles.nosync
          key: planner-charts-v4-pending
          restore-keys: |
            planner-charts-v4-
            planner-charts-v3-

      # The planner runs as a user of its own and writes under data/:
      # what it fetches into data/raw, the ratings and notes the training
      # tests make in data/labels. The checkout is the runner's, and the
      # planner's first run here could not so much as create data/raw. So
      # the tree is opened to it first. And the route's elevations are
      # seeded from the suite's own copy (163 points of the C81-KDLH
      # corridor): the USGS lookup the planner would make for each
      # answers a GitHub runner with 403, and without them there is no
      # terrain, so no altitude, so no nav log. Then the planner can start
      # (the stack's background piece above starts it).
      - name: The planner's data, ready
        run: |
          mkdir -p data/raw
          cp -n web/e2e/fixtures/elevation_cache.csv data/raw/elevation_cache.csv
          chmod -R a+rwX data
          echo "$(($(date +%s) - T0)) the planner's data" >> /tmp/e2e-out/timeline
          touch /tmp/e2e-out/data.ready

      # The suite's packages, as installed in the Playwright image: a
      # restore of web/node_modules rather than an `npm ci` each run.
      - name: Restore the suite's packages
        id: packages
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: web/node_modules
          key: e2e-node-modules-pw1.55.1-${{ hashFiles('web/package-lock.json') }}

      # The page the webapp serves, from this commit's web/ -- `npm run
      # types` and `vite build`, as springboot-app/Dockerfile builds it --
      # in web/dist, mounted over the image's (docker-compose.ci.yml), as
      # the planner's code is mounted over its image's. So a change to the
      # page, which most commits make, needs no image built: the webapp's
      # is built again only for its jar (.github/e2e-keys.sh), and build
      # (webapp) still builds the whole image, page and all, whenever web/
      # changes. On a push, e2e-images builds the page once for its key
      # and the stack's background piece copies it in; on a pull request,
      # which e2e-images does not run for, it is built here, with Node as
      # .nvmrc has it and the suite's packages, from the same lock file.
      # The webapp reads the page from disk when it is asked for, so it is
      # started before the page is there, and the step below waits for it.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7
        if: github.event_name == 'pull_request'
        with:
          node-version-file: .nvmrc
      - name: The page, built from this commit
        if: github.event_name == 'pull_request'
        working-directory: web
        run: |
          [ -d node_modules ] || npm ci --no-audit --no-fund
          npm run types
          npx vite build --outDir dist --emptyOutDir
          echo "$(($(date +%s) - T0)) the page built" >> /tmp/e2e-out/timeline

      # Every piece of the stack started (a failed one ends the job here,
      # with its log as an annotation), then healthy -- `up --wait` starts
      # nothing that is running already, and waits. Healthy is not ready:
      # the webapp answers its readiness probe a little before it serves
      # the page, and the planner answers its probe while still loading
      # airspace and obstacles (and, from a cold cache, fetching them) --
      # under which the first tests timed out. So: the page, then the
      # planner's own word that it is warm.
      - name: Wait for the stack, the page and a warm planner
        run: |
          for job in net db stack; do
            while [ ! -f /tmp/e2e-out/$job.exit ]; do sleep 1; done
            if [ "$(cat /tmp/e2e-out/$job.exit)" != 0 ]; then
              tail -40 /tmp/e2e-out/$job.log
              tail -25 /tmp/e2e-out/$job.log | python3 -c 'import sys; t=sys.stdin.read().replace("%","%25").replace("\n","%0A"); print(f"::error title='"$job"' failed::{t[:4000]}")'
              exit 1
            fi
          done
          docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d --no-build --wait webapp planning-service model-service
          echo "$(($(date +%s) - T0)) healthy" >> /tmp/e2e-out/timeline
          for _ in $(seq 1 240); do
            curl -sf -o /dev/null http://localhost:8080/app/plan && break
            sleep 1
          done
          echo "$(($(date +%s) - T0)) the page" >> /tmp/e2e-out/timeline
          for _ in $(seq 1 900); do
            curl -sf http://localhost:8084/ | grep -q '"warm":true' && break
            sleep 1
          done
          curl -sf http://localhost:8084/ | grep -q '"warm":true' || { echo "the planner never reported itself warm"; exit 1; }
          echo "$(($(date +%s) - T0)) the planner warm" >> /tmp/e2e-out/timeline
      # The cycle the planner is serving and the corridor reader's code:
      # what the charts cache is keyed by, at the end of the job.
      - name: The chart cycle
        id: cycle
        if: matrix.shard == 1
        env:
          READER: ${{ hashFiles('src/vfr/chartvision.py', 'planning-service/app/detection.py') }}
        run: |
          cycle=$(curl -sf http://localhost:8084/api/status | python3 -c 'import json, sys; print(json.load(sys.stdin)["charts"]["cycle"])')
          echo "cycle=$cycle" >> "$GITHUB_OUTPUT"
          echo "key=planner-charts-v4-$cycle-${READER:0:16}" >> "$GITHUB_OUTPUT"
          echo "serving cycle $cycle; restored ${{ steps.charts.outputs.cache-matched-key || 'no chart cache' }}"
      # What the planner has to work with, on the commit's checks: a
      # job's log takes admin rights to read, an annotation does not.
      # "Warm" means the warm-up finished, not that every fetch in it
      # succeeded, and a planner without its obstacle file or its charts
      # answers every nav log and tile slowly and wrongly. Once, from the
      # first shard: the shards' stacks are alike.
      - name: The planner's data, as annotations
        if: matrix.shard == 1
        run: |
          python3 - <<'EOF'
          import json, subprocess, urllib.request
          def notice(title, text):
              text = text.replace("%", "%25").replace("\r", "").replace("\n", "%0A")[:4000]
              print(f"::notice title={title}::{text}")
          try:
              s = json.load(urllib.request.urlopen("http://localhost:8084/api/status", timeout=60))
              notice("planner data", json.dumps({
                  "faa_files": [f["name"] for f in s["faa_files"]],
                  "weather": {w["name"]: w["fetched_at"] for w in s["weather"]},
                  "charts": s["charts"]["prepared"],
                  "corridors": len(s["corridors"]),
                  "services": {k: (v or {}).get("up") for k, v in s["services"].items()},
              }))
          except Exception as err:
              notice("planner status", f"unavailable: {err!r}")
          log = subprocess.run(["docker", "compose", "-f", "docker-compose.yml", "-f", "docker-compose.ci.yml",
                                "logs", "--no-color", "--tail", "400", "planning-service"], capture_output=True, text=True).stdout
          kept = [l.split("| ", 1)[-1] for l in log.splitlines()
                  if any(k in l for k in ("warm-up", "unavailable", "downloaded", "prepared ", "Error", "error", "Traceback", "refreshed"))]
          notice("planner log", "\n".join(kept[-40:]) or "(nothing matched)")
          reach = {}
          for url in ("https://www.faa.gov/air_traffic/flight_info/aeronav/aero_data/NASR_Subscription/",
                      "https://aeronav.faa.gov/visual/09-03-2026/sectional-files/Chicago.zip",
                      "https://epqs.nationalmap.gov/v1/json?x=-88.09&y=42.32&units=Feet&wkid=4326",
                      "https://davidmegginson.github.io/ourairports-data/airports.csv",
                      "https://aviationweather.gov/data/cache/metars.cache.csv.gz"):
              try:
                  r = urllib.request.Request(url, method="HEAD", headers={"User-Agent": "vfr-route-learning-project/0.1"})
                  reach[url] = urllib.request.urlopen(r, timeout=20).status
              except Exception as err:
                  reach[url] = repr(err)[:120]
          notice("reachable from the runner", json.dumps(reach))
          EOF

      # The Playwright image, pulled since the job's first steps.
      - name: Wait for the Playwright image
        run: |
          while [ ! -f /tmp/e2e-out/playwright.exit ]; do sleep 1; done
          if [ "$(cat /tmp/e2e-out/playwright.exit)" != 0 ]; then
            tail -20 /tmp/e2e-out/playwright.log
            exit 1
          fi

      - name: The suite's packages, when they were not restored
        if: steps.packages.outputs.cache-hit != 'true'
        run: |
          docker run --rm --network host -v "$PWD/web:/w" -v /tmp/e2e-out:/out -w /w \
            "$PLAYWRIGHT_IMAGE" \
            sh -c "timeout 600 npm ci --no-audit --no-fund 2>&1 | tail -20 | tee /out/npm.log"
      - name: Browser tests
        id: tests
        # CI=1 is what playwright.config.ts doubles its waits on. The
        # github reporter puts each failure on the commit's checks, as
        # the webapp's job does for its tests; the list goes to a file
        # for the step below, since the job's log takes admin rights to
        # read. Thirty minutes, and then the step ends and says so.
        run: |
          echo "$(($(date +%s) - T0)) the tests" >> /tmp/e2e-out/timeline
          docker run --rm --network host -e CI=1 \
            -v "$PWD/web:/w" -v /tmp/e2e-out:/out -w /w \
            "$PLAYWRIGHT_IMAGE" \
            bash -o pipefail -c "timeout 1800 npx playwright test --shard=${{ matrix.shard }}/${{ strategy.job-total }} --reporter=list,github 2>&1 | tee /out/playwright.log"
      - name: How the tests went, as an annotation
        if: always()
        env:
          SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
        run: |
          python3 - <<'EOF'
          import os, re
          def say(level, title, text):
              text = text.replace("%", "%25").replace("\r", "").replace("\n", "%0A")[:4000]
              print(f"::{level} title={title}::{text}")
          shard = os.environ["SHARD"]
          # When each piece of the setup was done, from the background
          # pieces' and the steps' own notes: where the time before the
          # first test went.
          setup, events = "before the first test, seconds from the job's first step: ", []
          try:
              events = sorted((int(l.split(" ", 1)[0]), l.split(" ", 1)[1])
                              for l in open("/tmp/e2e-out/timeline").read().splitlines() if " " in l)
              setup += ", ".join(f"{t} {what}" for t, what in events)
          except (OSError, ValueError) as err:
              setup += f"unknown ({err})"
          # And how busy the runner was until then, from vmstat's samples
          # (one a second from the first step): whether the setup waits on
          # the processors or on the disk.
          try:
              rows = [l.split() for l in open("/tmp/e2e-out/vmstat.log").read().splitlines()]
              head = next(r for r in rows if "wa" in r and "bo" in r)
              data = [r for r in rows if len(r) == len(head) and r[0].isdigit()][1:]
              data = data[:next((t for t, what in events if what == "the tests"), len(data))] or data
              mean = lambda name: sum(float(r[head.index(name)]) for r in data) / len(data)
              peak = lambda name: max(float(r[head.index(name)]) for r in data)
              setup += (f"; meanwhile the processors {100 - mean('id'):.0f}% busy (user {mean('us'):.0f}, system "
                        f"{mean('sy'):.0f}, waiting on the disk {mean('wa'):.0f}), {mean('bo') / 1024:.0f} MB/s "
                        f"written ({peak('bo') / 1024:.0f} at most), {mean('bi') / 1024:.0f} read, over {len(data)} s")
          except (OSError, StopIteration, ValueError, ZeroDivisionError) as err:
              setup += f"; the runner's load unknown ({err!r})"
          path = "/tmp/e2e-out/playwright.log"
          if not os.path.exists(path):
              say("warning", f"shard {shard}: no output", "the tests never wrote their log\n" + setup)
          else:
              lines = open(path, errors="replace").read().splitlines()
              summary = [l for l in lines if re.match(r"\s*\d+ (passed|failed|flaky|skipped)", l)]
              # The shard's slowest tests, from the list reporter's
              # "✓ 12 [mobile] › e2e/x.spec.ts:40:1 › title (2.9s)": what
              # to look at first when a shard runs long.
              timed = []
              for l in lines:
                  m = re.search(r"\[(\w+)\] › e2e/(\S+?):\d+:\d+ › (.*) \((\d+(?:\.\d+)?)(ms|s|m)\)\s*$", l)
                  if m:
                      value = float(m[4]) * {"ms": 0.001, "s": 1, "m": 60}[m[5]]
                      timed.append((value, f"{value:5.1f}s {m[2]} [{m[1]}] {m[3][:70]}"))
              slowest = [text for _, text in sorted(timed, reverse=True)[:8]]
              say("notice" if summary else "warning", f"shard {shard}",
                  "\n".join(summary + [setup, "slowest:"] + slowest + ["--"] + lines[-25:]))
          EOF
      - name: The stack's logs, when the tests did not pass
        if: always() && steps.tests.outcome != 'success'
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci.yml logs --no-color --tail 300 webapp planning-service model-service
          docker compose -f docker-compose.yml -f docker-compose.ci.yml logs --no-color --tail 60 planning-service \
            | grep -vE "GET /api/(chart-tile|tiles)|200 OK|404 Not Found" | tail -25 \
            | python3 -c 'import sys; t=sys.stdin.read().replace("%","%25").replace("\n","%0A"); print(f"::warning title=planner log, at the end::{t[:4000]}")'
      - name: Traces and screenshots, when the tests did not pass
        if: always() && steps.tests.outcome != 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: playwright-results-${{ matrix.shard }}
          path: web/test-results
          if-no-files-found: ignore

      - name: Keep the suite's packages
        if: matrix.shard == 1 && steps.packages.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: web/node_modules
          key: ${{ steps.packages.outputs.cache-primary-key }}
      # Saved whether or not the tests passed, so a run that failed on
      # a test does not fetch a gigabyte again next time.
      - name: Keep the planner's reference data
        if: always() && matrix.shard == 1 && steps.data.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            data/raw/*
            !data/raw/charts.nosync
            !data/raw/chart_tiles.nosync
          key: ${{ steps.data.outputs.cache-primary-key }}
      # The charts and tiles, once per FAA cycle and reader: saved when
      # what was restored was another cycle's, another reader's or
      # nothing, with the tiles this run rendered in it -- and only this
      # cycle's. An earlier cycle's folders come back with the restore,
      # and would otherwise ride along into every cycle's cache after it.
      # (The planner made some of what is under them, as a user of its
      # own: hence sudo.) Only once the tests have run, passing or not:
      # the tiles are theirs, and a run that stopped before them saves a
      # cache without any. And with the corridor's detections read first,
      # for the tests that wait on them in the runs after this one: this
      # shard's own tests may never have asked for them (a replay, when
      # they are on disk already, is a second).
      - name: The corridor's detections, for the cache
        if: always() && matrix.shard == 1 && steps.cycle.outputs.cycle != '' && (steps.tests.outcome == 'success' || steps.tests.outcome == 'failure') && steps.charts.outputs.cache-matched-key != steps.cycle.outputs.key
        run: |
          start=$SECONDS
          curl -sf --max-time 600 -o /dev/null "http://localhost:8084/api/detect/stream?dep=C81&dest=KDLH"
          echo "read in $((SECONDS - start)) s: $(find data/raw/chart_tiles.nosync -path '*/detections/*.json' -printf '%f ')"
      - name: This cycle's charts only
        if: always() && matrix.shard == 1 && steps.cycle.outputs.cycle != '' && (steps.tests.outcome == 'success' || steps.tests.outcome == 'failure') && steps.charts.outputs.cache-matched-key != steps.cycle.outputs.key
        env:
          CYCLE: ${{ steps.cycle.outputs.cycle }}
        run: |
          for root in data/raw/charts.nosync data/raw/chart_tiles.nosync; do
            if [ -d "$root" ]; then sudo find "$root" -mindepth 1 -maxdepth 1 -type d ! -name "$CYCLE" -print -exec rm -rf {} +; fi
          done
      - name: Keep the corridor's charts
        if: always() && matrix.shard == 1 && steps.cycle.outputs.cycle != '' && (steps.tests.outcome == 'success' || steps.tests.outcome == 'failure') && steps.charts.outputs.cache-matched-key != steps.cycle.outputs.key
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            data/raw/charts.nosync
            data/raw/chart_tiles.nosync
          key: ${{ steps.cycle.outputs.key }}

  # The browser suite's three images (.github/ci-images.hcl) -- the
  # webapp, the planner, and the model service's `slim` stage, without the
  # torch and tensorflow the suite's scikit-learn fixture never loads --
  # and the page the webapp serves there. Each is built once per key, a
  # hash of what decides what it does in the suite's stack
  # (.github/e2e-keys.sh). The images are pushed under `e2e-<key>` and
  # `e2e`, the last pushed; never `latest`, which only promote gives an
  # image, and none of these is quite the image that ships. Most commits
  # change none of their keys (4 of the 59 before 1deccfc changed one),
  # and the shards pull what an earlier commit built. They were built on
  # every commit, the webapp's npm install and bundle included, and the
  # shards waited for them -- 1.8 minutes on fec57e0, which had changed
  # the planner's code and the page.
  #
  # The page's key changes on about half the commits (22 of 39). It is
  # built here, once, as the Dockerfile builds it (`npm run types`, `vite
  # build`) with the browser suite's own packages and Node from .nvmrc,
  # and pushed as an image of its files alone (webapp:e2e-page-<key>),
  # which each shard copies out and mounts over the webapp image's page
  # (docker-compose.ci.yml). Each shard built it itself in 1deccfc's run,
  # 10 to 20 seconds of processors already fully busy with its setup.
  #
  # And the image the tests run in: a slim copy of the Playwright image
  # (.github/ci-images.hcl's `playwright`), made once for each digest its
  # name points at -- after everything else here, since until it is there
  # the shards pull the image itself.
  #
  # Not after `changes`, as every other job is: a shard starts ten
  # seconds into the run, and a key's image, when there is one to build,
  # should be on its way by then. So it runs on every push, the suite due
  # or not; with nothing to build it is a checkout and four lookups. Not
  # on a pull request, whose token cannot push: its shards build what
  # they cannot pull. The images with a BuildKit container of
  # setup-buildx's rather than the runner's own builder: it pushes what
  # the registry cache already holds without first pulling it. No
  # attestation: nothing verifies these.
  e2e-images:
    name: build (e2e)
    runs-on: ubuntu-26.04
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: The keys nothing has been built for yet
        id: keys
        env:
          REGISTRY: ghcr.io/${{ github.repository }}
        run: |
          there() { docker buildx imagetools inspect --raw "$1" > /dev/null 2>&1; }
          keys=$(bash .github/e2e-keys.sh)
          missing=""
          while read -r name key; do
            if [ "$name" = page ]; then
              if there "$REGISTRY/webapp:e2e-page-$key"; then
                echo "the page: webapp:e2e-page-$key is there"
              else
                echo "the page: webapp:e2e-page-$key to build"
                echo "page=$REGISTRY/webapp:e2e-page-$key" >> "$GITHUB_OUTPUT"
              fi
              continue
            fi
            echo "$(echo "$name" | tr 'a-z-' 'A-Z_')_KEY=$key" >> "$GITHUB_ENV"
            if there "$REGISTRY/$name:e2e-$key"; then
              echo "$name: e2e-$key is there"
            else
              echo "$name: e2e-$key to build"
              missing="$missing $name"
            fi
          done <<< "$keys"
          echo "missing=${missing# }" >> "$GITHUB_OUTPUT"
          # And the slim copy of the Playwright image, for the image's
          # digest: made again whenever what its name points at changes.
          digest=$(docker buildx imagetools inspect --raw "$PLAYWRIGHT_IMAGE" | sha256sum | cut -d' ' -f1)
          if there "$REGISTRY/e2e-playwright:${digest:0:16}"; then
            echo "Playwright: e2e-playwright:${digest:0:16} is there"
          else
            echo "Playwright: e2e-playwright:${digest:0:16} to make"
            echo "playwright=$REGISTRY/e2e-playwright:${digest:0:16}" >> "$GITHUB_OUTPUT"
            echo "PLAYWRIGHT_FROM=$PLAYWRIGHT_IMAGE@sha256:$digest" >> "$GITHUB_ENV"
          fi
      - name: Restore the suite's packages, for the page
        if: steps.keys.outputs.page != ''
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: web/node_modules
          key: e2e-node-modules-pw1.55.1-${{ hashFiles('web/package-lock.json') }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7
        if: steps.keys.outputs.page != ''
        with:
          node-version-file: .nvmrc
      # Before setup-buildx, whose builder would otherwise be the one
      # `docker build` uses, and would leave the image out of Docker.
      - name: The page, built and pushed
        if: steps.keys.outputs.page != ''
        working-directory: web
        env:
          PAGE: ${{ steps.keys.outputs.page }}
        run: |
          [ -d node_modules ] || npm ci --no-audit --no-fund
          npm run types
          npx vite build --outDir dist --emptyOutDir
          printf 'FROM scratch\nCOPY . /page/\n' | docker build -q -t "$PAGE" -f - dist
          docker push -q "$PAGE"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4
        if: steps.keys.outputs.missing != '' || steps.keys.outputs.playwright != ''
      - name: Those images, built and pushed
        if: steps.keys.outputs.missing != ''
        env:
          REGISTRY: ghcr.io/${{ github.repository }}
          MISSING: ${{ steps.keys.outputs.missing }}
          BUILDX_NO_DEFAULT_ATTESTATIONS: "1"
        # Pushed by their own `output` (ci-images.hcl), with zstd layers:
        # `--push` would set one of its own, gzip.
        run: |
          read -ra targets <<< "$MISSING"
          docker buildx bake -f .github/ci-images.hcl "${targets[@]}"
      # After the images, which the shards may be waiting for; nothing
      # waits for this -- until it is there the shards pull the image
      # itself.
      - name: The Playwright image's slim copy, made and pushed
        if: steps.keys.outputs.playwright != ''
        env:
          PLAYWRIGHT_TAG: ${{ steps.keys.outputs.playwright }}
          BUILDX_NO_DEFAULT_ATTESTATIONS: "1"
        run: docker buildx bake -f .github/ci-images.hcl playwright

  # Every image whose inputs changed, built beside the tests rather than
  # after them, each on a runner of its own. On main each is pushed under
  # this commit's tag (`:sha-<commit>`), never `:latest`: `promote` gives
  # it that name once every test has passed, which is a copy of the
  # manifest, seconds. A pull request builds without pushing -- the build
  # is the check that its Dockerfile still builds.
  #
  # The layer cache lives in the registry (ghcr.io/…/<service>:buildcache,
  # every stage's layers, mode=max), written from main: not evicted, and
  # a pull request, e2e-images and a pull request's shards read it. The Actions
  # cache it replaces is 10 GB for the whole repository, and the ML
  # images' torch and tensorflow layers evicted each other out of it, so
  # the ML image was built from nothing on most pushes (6.7 of a run's 15
  # minutes). Nothing reads that cache now: read second while it aged
  # out, it still held the index of the ML image's layers but not the
  # layers, so every step matched, no layer could be fetched, and the
  # image was built from nothing anyway -- 4.5 minutes, 2026-09-29.
  build-images:
    name: build (${{ matrix.service }})
    runs-on: ubuntu-26.04
    needs: [changes]
    if: needs.changes.outputs.images != '[]'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      # Three at a time. The account runs twenty jobs at once, and a run
      # that changes everything is seven test jobs, eight shards, the docs,
      # the e2e images and ten images: with no cap, the last shard of four
      # once waited 1.8 minutes for a runner behind the image builds,
      # which are not what the run waits on. Seven, eight, one, one and
      # three are twenty.
      max-parallel: 3
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.images) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Each Python image imports its own code, and the packages that code
      # imports lazily, as the last step of its build -- so a missing
      # dependency fails the build here and in a local `docker compose
      # build` alike, and a broken image is never pushed.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/${{ github.repository }}/${{ matrix.service }}:sha-${{ github.sha }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}/${{ matrix.service }}:buildcache
          # Written from main only: a pull request (a fork's included)
          # has no business writing what main's builds read.
          cache-to: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && format('type=registry,ref=ghcr.io/{0}/{1}:buildcache,mode=max,image-manifest=true,oci-mediatypes=true', github.repository, matrix.service) || '' }}

  # The images this run built become `:latest`, once every test has
  # passed: a copy of each manifest from its commit tag, which takes
  # seconds -- the build is not repeated. `!contains(… 'failure')`
  # rather than the implicit success(), which a skipped job fails: the
  # jobs whose inputs did not change are skipped, not failed.
  promote:
    runs-on: ubuntu-26.04
    needs: [changes, build-images, test, test-web, test-webapp, test-planning-service, test-model-service, test-nav-log-agent, test-crewai-agent, e2e]
    if: >-
      !cancelled() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
      && github.event_name == 'push' && github.ref == 'refs/heads/main'
      && needs.changes.outputs.images != '[]'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # `imagetools` needs no builder of its own: the runner's buildx
      # copies a manifest with the docker driver it already has. All at
      # once, and the step fails if any copy did.
      - name: This commit's images, as latest
        env:
          IMAGES: ${{ needs.changes.outputs.images }}
          REPO: ghcr.io/${{ github.repository }}
        run: |
          for service in $(jq -r '.[].service' <<<"$IMAGES"); do
            docker buildx imagetools create --tag "$REPO/$service:latest" "$REPO/$service:sha-$GITHUB_SHA" &
          done
          failed=0
          for job in $(jobs -p); do wait "$job" || failed=1; done
          exit "$failed"

  # Regenerates the webapp's and the retrain trigger's documentation, so
  # a broken {@link} or a Go package that stops building is caught here
  # rather than discovered later. Output is uploaded as a build artifact
  # (Actions -> this run -> Artifacts), so current docs are a click away
  # without regenerating them locally.
  #
  # The Python documentation (pdoc) is made by the test, test-nav-log-agent
  # and test-crewai-agent jobs, each from the packages its tests have just
  # installed, and uploaded as pdoc-vfr, pdoc-nav-log-agent and
  # pdoc-crewai-agent. This job used to build the ML, nav-log-agent and
  # crewai-agent images for pdoc's sake: the image builds' work a second
  # time, 3.6 to 9.8 minutes and the longest job of a run, and so on
  # pushes to main only. In the suites' jobs it takes seconds, and pull
  # requests get it too.
  docs:
    runs-on: ubuntu-26.04
    needs: [changes]
    if: needs.changes.outputs.docs == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6  # v6
        with:
          distribution: temurin
          java-version: "25"
          # As test-webapp does. Javadoc resolves the same dependency
          # tree, and without this it downloads all of it every run.
          cache: maven
      - name: Javadoc (webapp)
        working-directory: springboot-app
        run: mvn -q javadoc:javadoc

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7
        with:
          go-version: "1.25"
      - name: godoc (lambda-retrain-trigger)
        working-directory: infra/lambda-retrain-trigger
        run: |
          go build ./...
          go vet ./...
          go doc -all -u . > /tmp/godoc-retrain-trigger.txt

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: documentation
          retention-days: 30
          path: |
            springboot-app/target/reports/apidocs
            /tmp/godoc-retrain-trigger.txt

  # Pushes every image the CloudFormation stack actually deploys
  # (infra/cloudformation/template.yaml's *ImageUri parameters) to ECR,
  # alongside the GHCR publish above. Reads build-images' registry cache,
  # so this is a cache hit, not a second real build. Authenticates
  # via OIDC (no long-lived AWS keys stored as secrets) -- activates
  # automatically once AWS_ROLE_ARN/AWS_REGION are set as repo variables
  # (Settings -> Secrets and variables -> Actions -> Variables); skipped
  # entirely until then. ecrRepo is separate from the build-images `service`
  # name only for airflow-aws, whose ECR repo is named `airflow` (matching
  # AirflowImageUri) even though its registry cache stays `airflow-aws`
  # (distinct from the *local* airflow image also built above).
  push-ecr:
    runs-on: ubuntu-26.04
    needs: promote
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AWS_ROLE_ARN != ''
    permissions:
      contents: read
      id-token: write
      packages: read
    strategy:
      matrix:
        include:
          # Repo root as context, for the same reason as build-images:
          # the Dockerfile builds web/ as its first stage.
          - service: webapp
            ecrRepo: webapp
            context: .
            dockerfile: ./springboot-app/Dockerfile
          - service: planning-service
            ecrRepo: planning-service
            context: .
            dockerfile: planning-service/Dockerfile
          - service: model-service
            ecrRepo: model-service
            context: ./model-service
            dockerfile: ./model-service/Dockerfile
          - service: nav-log-agent
            ecrRepo: nav-log-agent
            context: .
            dockerfile: nav-log-agent/Dockerfile
          - service: crewai-agent
            ecrRepo: crewai-agent
            context: .
            dockerfile: crewai-agent/Dockerfile
          - service: airflow-aws
            ecrRepo: airflow
            context: .
            dockerfile: docker/Dockerfile.airflow.aws
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4
      # The registry cache is private, like the images: without this the
      # cache is refused, quietly, and every image built from nothing.
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd  # v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - id: ecr-login
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd  # v2
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.ecr-login.outputs.registry }}/vfr-route/${{ matrix.ecrRepo }}:latest
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}/${{ matrix.service }}:buildcache
