name: CI

# Every action below is pinned to a commit, with its release tag in the
# comment beside it. A tag is a movable pointer in someone else's
# repository: whoever can write there can repoint v4 at new code, and
# these jobs hold a registry token and, in the deploy job, AWS
# credentials. A commit cannot be repointed.
#
# All of them are on their newest major, because anything older still
# declares `runs: using: node20` in its own action.yml and the runner
# has begun force-upgrading those and warning about it. Every removal in
# those majors was checked against what this file passes: none of the
# dropped inputs or environment variables is used here, and the Java
# distribution is temurin rather than the Adopt builds setup-java v6
# removed. They all need Actions Runner v2.327.1 or newer, which the
# GitHub-hosted runners are well past.
#
# The comment is what to read; the SHA is what runs. To take a new
# release, resolve its tag to a commit
# (`gh api repos/<owner>/<repo>/git/ref/tags/<tag>`, following the
# object through `git/tags/<sha>` for an annotated tag) and update both.
# Dependabot updates a pinned action and its comment together.
#
# The runner image is named rather than `ubuntu-latest`, for a smaller
# version of the same reason: GitHub moves that label to a new Ubuntu
# over several weeks (24.04 to 26.04 from October 19, 2026), and while
# it does, one run's jobs can land on either image. The next LTS is a
# change to this file, tested like any other.

on:
  push:
    branches: [main]
  pull_request:
  # Startable by hand. A run can fail for reasons that have nothing to
  # do with the commit under it -- a runner that never started, an
  # account limit -- and without this the only way to ask again is an
  # empty commit on main.
  workflow_dispatch:

# A new push to an open PR should replace the run already queued for its
# previous commit, not queue behind it -- otherwise every fixup push pays
# for a run whose result nobody will read.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Stated here rather than left to the repository's own default, which is
# a setting outside this file that can change without a commit touching
# it. Every job gets read access to the code and nothing else; the three
# that need more say so themselves, next to the step that needs it.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            src/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check src/vfr tests
      - run: pytest tests/ -v

  # The web front end. Its own job because it needs Node rather than
  # Python, and worth having at all because that is where the faults have
  # been: a TypeError on every selection, a function written and never
  # called, state kept on one of two code paths, a page that fitted its
  # map against a container it had measured wrong.
  #
  # tsc is half the value. Renaming a field and missing one call site was
  # silent in the pages this replaced; here it fails the build. The tests
  # cover the pure decisions -- which points a filter admits, what counts
  # as rated, which way the arrows step, which leg leaves a checkpoint --
  # which need no browser and so run like anything else.
  test-web:
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # The API types, generated from planning-service/openapi.json --
      # test-planning-service proves that file matches the running app.
      - run: npm run types
      - run: npx tsc --noEmit
      - run: npx eslint .
      - run: npx vitest run
      - run: npx vite build
      # Advisory only (continue-on-error): reports known-vulnerable
      # dependencies without blocking a merge on one this repo can't fix
      # immediately (e.g. a transitive dep with no patched release yet).
      # Promote to blocking once an initial backlog is triaged.
      - run: npm audit --audit-level=high
        continue-on-error: true

  # webapp's own JUnit suite. Separate from `test` above because it needs a
  # JDK rather than Python, and separate from the image build because
  # Dockerfile builds with -DskipTests on purpose (an image build shouldn't
  # be the thing that runs your tests). Testcontainers drives a real
  # Postgres for the migration/persistence tests; GitHub runners provide
  # the Docker daemon it needs.
  test-webapp:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6  # v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: mvn test (webapp)
        working-directory: springboot-app
        run: mvn -B test
      # A job's log takes admin rights on the repository to read; an
      # annotation shows on the commit's checks to anyone who can see it.
      # So each failing test is one: its assertion or exception, and the
      # causes under it (the stack between them says little).
      - name: Failing tests, as annotations
        if: failure()
        working-directory: springboot-app
        run: |
          python3 - <<'EOF'
          import glob, xml.etree.ElementTree as ET
          for path in sorted(glob.glob("target/surefire-reports/TEST-*.xml")):
              for case in ET.parse(path).getroot().iter("testcase"):
                  for problem in [*case.iter("failure"), *case.iter("error")]:
                      lines = (problem.text or problem.get("message") or "").strip().splitlines()
                      kept = lines[:6] + [line for line in lines[6:] if line.startswith("Caused by")]
                      text = "\n".join(kept).replace("%", "%25").replace("\r", "").replace("\n", "%0A")
                      test = case.get("classname").rsplit(".", 1)[-1] + "." + case.get("name")
                      test = test.replace("%", "%25").replace(":", "%3A").replace(",", "%2C")
                      print(f"::error title={test}::{text}")
          EOF

  # planning-service's own FastAPI-layer suite. Separate job for the same
  # reason as test-webapp: its own dependency set (requirements-dev.txt,
  # on top of the service's own requirements.txt), and no reason to gate
  # it on the root `test` job's unrelated src/vfr dependencies.
  test-planning-service:
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: planning-service
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            planning-service/requirements*.txt
            src/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests
      - run: pytest tests/ -v

  # model-service's own suite. Its requirements carry torch and
  # tensorflow (the candidates it serves), which is most of this job's
  # time, and none of the other suites needs them.
  test-model-service:
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: model-service
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: model-service/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests
      - run: pytest tests/ -v

  # The two agents' suites. Each installs its own service's requirements,
  # the way its image does -- nav-log-agent takes the CPU torch wheel
  # first for the same reason its Dockerfile does. The suites mock the
  # database, planning-service and Claude, so nothing here is billed.
  test-nav-log-agent:
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: nav-log-agent
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: nav-log-agent/requirements*.txt
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests
      - run: pytest tests/ -v

  test-crewai-agent:
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: crewai-agent
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: crewai-agent/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests
      - run: pytest tests/ -v

  # Path-aware build-images below: on a PR, most of those 10 images have
  # nothing in their own build context changed, so building all 10 anyway
  # (this repo's biggest CI cost -- torch/tensorflow/Spark images among
  # them) buys nothing over building only the ones this PR could have
  # broken. Always "true" outside a PR (push to main), so main's images
  # stay fully in sync with every dependency bump merged, path-filter
  # blind spots included.
  changes:
    runs-on: ubuntu-26.04
    # Runs on pushes as well, where it compares against the previous
    # commit. `build-images` ignores it outside a PR on purpose (see
    # above), but `docs` uses it either way: three of its steps build
    # torch/tensorflow-sized images to run pdoc inside, and a push that
    # only touched web/ has no reason to pay for any of them.
    #
    # paths-filter asks the API which files the PR touches, which the
    # default token cannot do. Without this the job fails with "Resource
    # not accessible by integration" and, because build-images is gated
    # on it, every image build on every PR is blocked behind it.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      ml: ${{ steps.filter.outputs.ml }}
      pipeline-processing: ${{ steps.filter.outputs.pipeline-processing }}
      pipeline-training: ${{ steps.filter.outputs.pipeline-training }}
      airflow: ${{ steps.filter.outputs.airflow }}
      airflow-aws: ${{ steps.filter.outputs.airflow-aws }}
      nav-log-agent: ${{ steps.filter.outputs.nav-log-agent }}
      crewai-agent: ${{ steps.filter.outputs.crewai-agent }}
      planning-service: ${{ steps.filter.outputs.planning-service }}
      model-service: ${{ steps.filter.outputs.model-service }}
      webapp: ${{ steps.filter.outputs.webapp }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4
        id: filter
        with:
          filters: |
            ml:
              - docker/Dockerfile.ml
              - docker/requirements-ml.txt
              - src/vfr/**
              - src/requirements*.txt
            pipeline-processing:
              - docker/Dockerfile.processing
              - docker/requirements-processing.txt
              - src/vfr/**
              - src/requirements*.txt
            pipeline-training:
              - docker/Dockerfile.training
              - docker/requirements-training.txt
              - src/vfr/**
              - src/requirements*.txt
            airflow:
              - docker/Dockerfile.airflow
              - airflow/**
              - src/vfr/**
            airflow-aws:
              - docker/Dockerfile.airflow.aws
              - airflow/dags/vfr_pipeline_aws_dag.py
              - src/vfr/**
            nav-log-agent:
              - nav-log-agent/**
              - src/vfr/**
            crewai-agent:
              - crewai-agent/**
              - src/vfr/**
            planning-service:
              - planning-service/**
              - src/vfr/**
              - src/requirements*.txt
            model-service:
              - model-service/**
            webapp:
              - web/**
              - springboot-app/**
            # The browser suite runs the whole stack a pilot touches, so
            # it is due whenever any of that could have changed.
            e2e:
              - web/**
              - springboot-app/**
              - planning-service/**
              - model-service/**
              - src/vfr/**
              - src/requirements*.txt
              - docker-compose.yml
              - docker-compose.ci.yml
              - .github/workflows/ci.yml

  # The browser suite (web/e2e, Playwright) against the stack a pilot
  # uses: the webapp, the planner and the model service built here from
  # this commit, Postgres and Mailpit as docker-compose.yml runs them,
  # under docker-compose.ci.yml. It is what catches what no unit test
  # can -- a tap lost to a race, a drawer that opens empty, a request
  # the phone's port dropped -- and until this job it ran only by hand.
  #
  # The planner fetches its reference data for itself into data/raw:
  # the FAA obstacle file and the airport tables (about 800 MB, from an
  # FAA page that is the slow part) are kept in the Actions cache
  # between runs, restored in under a minute; its key names what is
  # fetched, and a change to that fetches afresh. The corridor's chart
  # sheets (half a gigabyte from aeronav.faa.gov, and two and a half
  # minutes to prepare) and the tiles the suite has had rendered from
  # them are a second cache, keyed by the FAA cycle: fetched once a
  # cycle, not once a run, and without them the planner rendered every
  # tile from a cold sheet while two browsers waited, which is where
  # the suite's timeouts came from.
  #
  # The tests run in the Playwright image, the same one web/README.md
  # runs them in locally, on the runner's network so localhost is the
  # stack's.
  e2e:
    runs-on: ubuntu-26.04
    needs: [changes]
    if: github.event_name != 'pull_request' || needs.changes.outputs.e2e == 'true'
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4
      # The same images build-images builds, from the same cache scopes,
      # loaded into this runner's Docker under the names
      # docker-compose.ci.yml gives them (.github/ci-images.hcl). One
      # bake of the three rather than three build steps: bake builds
      # them at once, and the planner's image alone took as long as the
      # other two together. The cache is written as well as read, so
      # build-images, which runs once this job has passed, finds every
      # layer of these three already there.
      - uses: docker/bake-action@018cb6412ab401ebaa809aa5f85966b74628600f  # v7.4.0
        with:
          source: .
          files: .github/ci-images.hcl
          targets: ci
          load: true
          # Images for this runner's Docker only: an attestation is
          # for a registry, and the docker exporter refuses one.
          provenance: false
          set: |
            webapp.cache-from=type=gha,scope=webapp
            webapp.cache-to=type=gha,mode=max,scope=webapp
            planning-service.cache-from=type=gha,scope=planning-service
            planning-service.cache-to=type=gha,mode=max,scope=planning-service
            model-service.cache-from=type=gha,scope=model-service
            model-service.cache-to=type=gha,mode=max,scope=model-service

      - name: Restore the planner's reference data
        id: data
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            data/raw
            !data/raw/charts.nosync
            !data/raw/chart_tiles.nosync
          key: planner-data-v1-${{ hashFiles('data/processed/candidates_*.csv', 'src/vfr/faa_data.py', 'src/vfr/airports.py', 'src/vfr/elevation.py', 'src/vfr/charts.py') }}
          restore-keys: planner-data-v1-
      # The corridor's chart sheets, and the tiles rendered from them,
      # kept between runs as well: preparing the sheets was two and a
      # half minutes of every run's warm-up, and rendering tiles from
      # cold GeoTIFFs while two browsers asked for them is what starved
      # the planner into the suite's timeouts. Keyed by the FAA cycle the
      # planner reports once it is warm (below): a new cycle is fetched
      # once and then kept, and a restore takes the newest cycle saved.
      - name: Restore the corridor's charts
        id: charts
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            data/raw/charts.nosync
            data/raw/chart_tiles.nosync
          key: planner-charts-v1-pending
          restore-keys: planner-charts-v1-

      # The planner runs as a user of its own and writes under data/:
      # what it fetches into data/raw, the ratings and notes the training
      # tests make in data/labels. The checkout is the runner's, and the
      # planner's first run here could not so much as create data/raw. So
      # the tree is opened to it first. And the route's elevations are
      # seeded from the suite's own copy (163 points of the C81-KDLH
      # corridor): the USGS lookup the planner would make for each
      # answers a GitHub runner with 403, and without them there is no
      # terrain, so no altitude, so no nav log.
      - name: Start the stack
        run: |
          mkdir -p data/raw
          cp -n web/e2e/fixtures/elevation_cache.csv data/raw/elevation_cache.csv
          chmod -R a+rwX data
          docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d --no-build --wait webapp
      # Healthy is not ready: the webapp answers its readiness probe a
      # little before it serves the page, and the planner answers its
      # probe while still loading airspace and obstacles (and, from a
      # cold cache, fetching them) -- under which the first tests timed
      # out. So: the page, then the planner's own word that it is warm.
      - name: Wait for the page and a warm planner
        run: |
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:8080/app/plan && break
            sleep 5
          done
          for i in $(seq 1 180); do
            curl -sf http://localhost:8084/ | grep -q '"warm":true' && break
            sleep 5
          done
          curl -sf http://localhost:8084/ | grep -q '"warm":true' || { echo "the planner never reported itself warm"; exit 1; }
      # The cycle the planner is serving: what the charts cache is
      # keyed by, at the end of the job.
      - name: The chart cycle
        id: cycle
        run: |
          cycle=$(curl -sf http://localhost:8084/api/status | python3 -c 'import json, sys; print(json.load(sys.stdin)["charts"]["cycle"])')
          echo "cycle=$cycle" >> "$GITHUB_OUTPUT"
          echo "serving cycle $cycle; restored ${{ steps.charts.outputs.cache-matched-key || 'no chart cache' }}"
      # What the planner has to work with, on the commit's checks: a
      # job's log takes admin rights to read, an annotation does not.
      # "Warm" means the warm-up finished, not that every fetch in it
      # succeeded, and a planner without its obstacle file or its charts
      # answers every nav log and tile slowly and wrongly.
      - name: The planner's data, as annotations
        run: |
          python3 - <<'EOF'
          import json, subprocess, urllib.request
          def notice(title, text):
              text = text.replace("%", "%25").replace("\r", "").replace("\n", "%0A")[:4000]
              print(f"::notice title={title}::{text}")
          try:
              s = json.load(urllib.request.urlopen("http://localhost:8084/api/status", timeout=60))
              notice("planner data", json.dumps({
                  "faa_files": [f["name"] for f in s["faa_files"]],
                  "weather": {w["name"]: w["fetched_at"] for w in s["weather"]},
                  "charts": s["charts"]["prepared"],
                  "corridors": len(s["corridors"]),
                  "services": {k: (v or {}).get("up") for k, v in s["services"].items()},
              }))
          except Exception as err:
              notice("planner status", f"unavailable: {err!r}")
          log = subprocess.run(["docker", "compose", "-f", "docker-compose.yml", "-f", "docker-compose.ci.yml",
                                "logs", "--no-color", "--tail", "400", "planning-service"], capture_output=True, text=True).stdout
          kept = [l.split("| ", 1)[-1] for l in log.splitlines()
                  if any(k in l for k in ("warm-up", "unavailable", "downloaded", "prepared ", "Error", "error", "Traceback", "refreshed"))]
          notice("planner log", "\n".join(kept[-40:]) or "(nothing matched)")
          reach = {}
          for url in ("https://www.faa.gov/air_traffic/flight_info/aeronav/aero_data/NASR_Subscription/",
                      "https://aeronav.faa.gov/visual/09-03-2026/sectional-files/Chicago.zip",
                      "https://epqs.nationalmap.gov/v1/json?x=-88.09&y=42.32&units=Feet&wkid=4326",
                      "https://davidmegginson.github.io/ourairports-data/airports.csv",
                      "https://aviationweather.gov/data/cache/metars.cache.csv.gz"):
              try:
                  r = urllib.request.Request(url, method="HEAD", headers={"User-Agent": "vfr-route-learning-project/0.1"})
                  reach[url] = urllib.request.urlopen(r, timeout=20).status
              except Exception as err:
                  reach[url] = repr(err)[:120]
          notice("reachable from the runner", json.dumps(reach))
          EOF

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      # The suite's packages into the checkout, from the runner's npm
      # cache (mounted as the container's), so this is a copy, not a
      # download; and each half of the step under its own time limit, so
      # that whichever hangs is named rather than the job's limit cutting
      # both off unsaid.
      - name: The suite's packages
        run: |
          mkdir -p /tmp/e2e-out
          docker run --rm --network host -v "$PWD/web:/w" -v "$HOME/.npm:/root/.npm" -v /tmp/e2e-out:/out -w /w \
            mcr.microsoft.com/playwright:v1.55.1-noble \
            sh -c "timeout 600 npm ci --prefer-offline --no-audit --no-fund 2>&1 | tail -20 | tee /out/npm.log"
      - name: Browser tests
        id: tests
        # CI=1 is what playwright.config.ts doubles its waits on. The
        # github reporter puts each failure on the commit's checks, as
        # the webapp's job does for its tests; the list goes to a file
        # for the step below, since the job's log takes admin rights to
        # read. Thirty-five minutes, five more than the suite gives
        # itself (globalTimeout), and then the step ends and says so.
        run: |
          docker run --rm --network host -e CI=1 \
            -v "$PWD/web:/w" -v /tmp/e2e-out:/out -w /w \
            mcr.microsoft.com/playwright:v1.55.1-noble \
            bash -o pipefail -c "timeout 2100 npx playwright test --reporter=list,github 2>&1 | tee /out/playwright.log"
      - name: How the tests went, as an annotation
        if: always()
        run: |
          python3 - <<'EOF'
          import os, re
          def say(level, title, text):
              text = text.replace("%", "%25").replace("\r", "").replace("\n", "%0A")[:4000]
              print(f"::{level} title={title}::{text}")
          for name in ("npm", "playwright"):
              path = f"/tmp/e2e-out/{name}.log"
              if not os.path.exists(path):
                  say("warning", f"{name}: no output", "the step never wrote its log")
                  continue
              lines = open(path, errors="replace").read().splitlines()
              summary = [l for l in lines if re.match(r"\s*\d+ (passed|failed|flaky|skipped)", l)]
              say("notice" if summary else "warning", f"{name} output", "\n".join(summary + ["--"] + lines[-40:]))
          EOF
      - name: The stack's logs, when the tests did not pass
        if: always() && steps.tests.outcome != 'success'
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci.yml logs --no-color --tail 300 webapp planning-service model-service
          docker compose -f docker-compose.yml -f docker-compose.ci.yml logs --no-color --tail 60 planning-service \
            | grep -vE "GET /api/(chart-tile|tiles)|200 OK|404 Not Found" | tail -25 \
            | python3 -c 'import sys; t=sys.stdin.read().replace("%","%25").replace("\n","%0A"); print(f"::warning title=planner log, at the end::{t[:4000]}")'
      - name: Traces and screenshots, when the tests did not pass
        if: always() && steps.tests.outcome != 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: playwright-results
          path: web/test-results
          if-no-files-found: ignore

      # Saved whether or not the tests passed, so a run that failed on
      # a test does not fetch a gigabyte again next time.
      - name: Keep the planner's reference data
        if: always() && steps.data.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            data/raw
            !data/raw/charts.nosync
            !data/raw/chart_tiles.nosync
          key: ${{ steps.data.outputs.cache-primary-key }}
      # The charts and tiles, once per FAA cycle: saved when what was
      # restored was another cycle's or nothing, with the tiles this
      # run rendered in it.
      - name: Keep the corridor's charts
        if: always() && steps.cycle.outputs.cycle != '' && steps.charts.outputs.cache-matched-key != format('planner-charts-v1-{0}', steps.cycle.outputs.cycle)
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            data/raw/charts.nosync
            data/raw/chart_tiles.nosync
          key: planner-charts-v1-${{ steps.cycle.outputs.cycle }}

  build-images:
    runs-on: ubuntu-26.04
    # One list, and no `if:` -- the implicit success() is the rule: every
    # test job passed and `changes` ran. It used to be written twice,
    # here and again in an `always() && …` condition, and the two had
    # drifted: test-web was in neither, so a red front-end suite still
    # published the webapp image. (The condition existed because
    # `changes` was once skipped outside a PR; it runs on every event
    # now.) Should a need ever become skippable, the one-list form is
    # `!cancelled() && !contains(needs.*.result, 'failure')`.
    needs: [test, test-web, test-webapp, test-planning-service, test-model-service, test-nav-log-agent, test-crewai-agent, e2e, changes]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Each Python image imports its own code, and the packages that
          # code imports lazily, as the last step of its build -- so a
          # missing dependency fails the build here and in a local
          # `docker compose build` alike, and a broken image is never
          # pushed.
          - service: ml
            context: .
            dockerfile: docker/Dockerfile.ml
          - service: pipeline-processing
            context: .
            dockerfile: docker/Dockerfile.processing
          - service: pipeline-training
            context: .
            dockerfile: docker/Dockerfile.training
          - service: airflow
            context: .
            dockerfile: docker/Dockerfile.airflow
          - service: airflow-aws
            context: .
            dockerfile: docker/Dockerfile.airflow.aws
          - service: nav-log-agent
            context: .
            dockerfile: nav-log-agent/Dockerfile
          - service: crewai-agent
            context: .
            dockerfile: crewai-agent/Dockerfile
          - service: planning-service
            context: .
            dockerfile: planning-service/Dockerfile
          - service: model-service
            context: ./model-service
            dockerfile: ./model-service/Dockerfile
          # Context is the repo root, not ./springboot-app: the Dockerfile's
          # first stage builds the React app from web/ and bakes the bundle
          # into the jar, so it COPYs from both directories.
          - service: webapp
            context: .
            dockerfile: ./springboot-app/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        if: github.event_name != 'pull_request' || needs.changes.outputs[matrix.service] == 'true'
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4
        if: github.event_name != 'pull_request' || needs.changes.outputs[matrix.service] == 'true'
      # Only authenticate/push on main -- PRs (including from forks) don't
      # get write-scoped tokens, and shouldn't publish images anyway.
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7
        if: github.event_name != 'pull_request' || needs.changes.outputs[matrix.service] == 'true'
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/${{ github.repository }}/${{ matrix.service }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # Regenerates documentation so a broken {@link}, an import that stops
  # working under pdoc, or a docstring regression is caught here rather
  # than discovered later. Output is uploaded as a build artifact
  # (Actions -> this run -> Artifacts), so current docs are a click away
  # without regenerating them locally.
  #
  # Split by cost on purpose: Javadoc and godoc need only a JDK/Go
  # toolchain and run in seconds, so they gate every push and PR. pdoc has
  # to *import* every module, which means building this repo's heavy ML
  # images (torch/tensorflow/jupyter) -- even as a GHA cache hit that's
  # minutes per run, so it's scoped to pushes to main rather than charged
  # to every PR.
  docs:
    runs-on: ubuntu-26.04
    needs: [test, changes]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6  # v6
        with:
          distribution: temurin
          java-version: "25"
          # As test-webapp does. Javadoc resolves the same dependency
          # tree, and without this it downloads all of it every run.
          cache: maven
      - name: Javadoc (webapp)
        working-directory: springboot-app
        run: mvn -q javadoc:javadoc

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7
        with:
          go-version: "1.25"
      - name: godoc (lambda-retrain-trigger)
        working-directory: infra/lambda-retrain-trigger
        run: |
          go build ./...
          go vet ./...
          go doc -all -u . > /tmp/godoc-retrain-trigger.txt

      - name: Build ml image (for pdoc's full src/vfr dependency set)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.ml == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7
        with:
          context: .
          file: docker/Dockerfile.ml
          tags: vfr-docs-ml:latest
          load: true
          cache-from: type=gha,scope=ml
      - name: pdoc (src/vfr)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.ml == 'true'
        run: |
          docker run --rm --entrypoint sh -v "$PWD":/workspace -w /workspace vfr-docs-ml:latest -c \
            "pip install -q pdoc && PYTHONPATH=src python -m pdoc src/vfr -o /tmp/pdoc-vfr --no-show-source"

      - name: Build nav-log-agent image (for pdoc's full app dependency set)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs['nav-log-agent'] == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7
        with:
          context: .
          file: nav-log-agent/Dockerfile
          tags: vfr-docs-navlog:latest
          load: true
          cache-from: type=gha,scope=nav-log-agent
      - name: pdoc (nav-log-agent)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs['nav-log-agent'] == 'true'
        run: |
          docker run --rm --entrypoint sh -v "$PWD":/workspace -w /workspace/nav-log-agent vfr-docs-navlog:latest -c \
            "pip install -q pdoc && PYTHONPATH=/workspace/src python -m pdoc app -o /tmp/pdoc-navlog --no-show-source"

      - name: Build crewai-agent image (for pdoc's full app dependency set)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs['crewai-agent'] == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7
        with:
          context: .
          file: crewai-agent/Dockerfile
          tags: vfr-docs-crewai:latest
          load: true
          cache-from: type=gha,scope=crewai-agent
      - name: pdoc (crewai-agent)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs['crewai-agent'] == 'true'
        run: |
          docker run --rm --entrypoint sh -v "$PWD":/workspace -w /workspace/crewai-agent vfr-docs-crewai:latest -c \
            "pip install -q pdoc && PYTHONPATH=/workspace/src python -m pdoc app -o /tmp/pdoc-crewai --no-show-source"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: documentation
          retention-days: 30
          # pdoc output only exists on pushes to main (see above), so a PR
          # run uploads just the Javadoc/godoc portion rather than failing.
          if-no-files-found: ignore
          path: |
            springboot-app/target/reports/apidocs
            /tmp/godoc-retrain-trigger.txt
            /tmp/pdoc-vfr
            /tmp/pdoc-navlog
            /tmp/pdoc-crewai

  # Pushes every image the CloudFormation stack actually deploys
  # (infra/cloudformation/template.yaml's *ImageUri parameters) to ECR,
  # alongside the GHCR publish above. Reuses build-images' GHA cache by
  # scope, so this is a cache hit, not a second real build. Authenticates
  # via OIDC (no long-lived AWS keys stored as secrets) -- activates
  # automatically once AWS_ROLE_ARN/AWS_REGION are set as repo variables
  # (Settings -> Secrets and variables -> Actions -> Variables); skipped
  # entirely until then. ecrRepo is separate from the build-images `service`
  # name only for airflow-aws, whose ECR repo is named `airflow` (matching
  # AirflowImageUri) even though its GHA cache scope stays `airflow-aws`
  # (distinct from the *local* airflow image also built above).
  push-ecr:
    runs-on: ubuntu-26.04
    needs: build-images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AWS_ROLE_ARN != ''
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix:
        include:
          # Repo root as context, for the same reason as build-images:
          # the Dockerfile builds web/ as its first stage.
          - service: webapp
            ecrRepo: webapp
            context: .
            dockerfile: ./springboot-app/Dockerfile
          - service: planning-service
            ecrRepo: planning-service
            context: .
            dockerfile: planning-service/Dockerfile
          - service: model-service
            ecrRepo: model-service
            context: ./model-service
            dockerfile: ./model-service/Dockerfile
          - service: nav-log-agent
            ecrRepo: nav-log-agent
            context: .
            dockerfile: nav-log-agent/Dockerfile
          - service: crewai-agent
            ecrRepo: crewai-agent
            context: .
            dockerfile: crewai-agent/Dockerfile
          - service: airflow-aws
            ecrRepo: airflow
            context: .
            dockerfile: docker/Dockerfile.airflow.aws
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd  # v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - id: ecr-login
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd  # v2
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.ecr-login.outputs.registry }}/vfr-route/${{ matrix.ecrRepo }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
