name: Promote

# What a green CI run on main publishes: each image it built becomes
# `:latest`, and, once the AWS variables are set, the images the stack
# deploys go to ECR. It was CI's last job, and every run's last seven to
# nine seconds; CI is how long it takes to learn whether a commit is
# good, and this is what happens once it is. So it follows CI rather
# than ending it -- only after a run that succeeded, and only for a push
# to main (a pull request builds its images without pushing them).
#
# Actions are pinned as in ci.yml (its opening comment says why).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

# In the order the runs finished, one at a time, none cancelled: a later
# commit's promotion must not be overtaken by an earlier one's.
concurrency:
  group: promote
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Each image the run built is under the commit's tag (`:sha-<commit>`,
  # ci.yml's build-images); it becomes `:latest` by a copy of its
  # manifest, which takes seconds -- the build is not repeated. Which
  # images those are is what the registry has under the tag: every image
  # of .github/images.hcl is asked after, and the ones the commit did not
  # rebuild have none. All at once, three tries each, with the
  # registry's answer on the checks page when all three fail -- a job's
  # log takes admin rights to read. A promotion that failed stays
  # failed: the next CI run builds only what changed after this commit
  # (its last green one), so re-run this one.
  promote:
    runs-on: ubuntu-26.04
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: This commit's images, as latest
        env:
          REPO: ghcr.io/${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          promote() {
            if ! docker buildx imagetools inspect --raw "$REPO/$1:sha-$SHA" > /dev/null 2>&1; then
              echo "$1: not built by this commit"
              return 0
            fi
            for try in 1 2 3; do
              if docker buildx imagetools create --tag "$REPO/$1:latest" "$REPO/$1:sha-$SHA" > "/tmp/promote-$1.log" 2>&1; then
                echo "$1: promoted"
                return 0
              fi
              sleep $((try * 5))
            done
            echo "::error title=$1 not promoted::$(tail -5 "/tmp/promote-$1.log" | tr '\n' ' ' | sed 's/%/%25/g')"
            return 1
          }
          for service in $(docker buildx bake -f .github/images.hcl --print 2>/dev/null | jq -r '.target | keys[]'); do
            promote "$service" &
          done
          failed=0
          for job in $(jobs -p); do wait "$job" || failed=1; done
          exit "$failed"

  # Pushes every image the production server runs
  # (docker-compose.prod.yml; the stack's ECR repositories in
  # infra/cloudformation/template.yaml) to ECR, alongside the GHCR
  # publish above. Reads build-images' registry cache, so this is a cache
  # hit, not a second real build -- of the commit CI passed, not of
  # whatever main is by now. Authenticates via OIDC (no long-lived AWS
  # keys stored as secrets) -- activates automatically once
  # AWS_ROLE_ARN/AWS_REGION are set as repo variables (Settings ->
  # Secrets and variables -> Actions -> Variables; the stack's
  # DeployRoleArn output); skipped entirely until then. The role's trust
  # policy sees this workflow on main (`workflow_run` runs on the default
  # branch).
  push-ecr:
    runs-on: ubuntu-26.04
    needs: promote
    if: vars.AWS_ROLE_ARN != ''
    permissions:
      contents: read
      id-token: write
      packages: read
    strategy:
      matrix:
        include:
          # Repo root as context, for the same reason as images.hcl:
          # the Dockerfile builds web/ as its first stage.
          - service: webapp
            ecrRepo: webapp
            context: .
            dockerfile: ./springboot-app/Dockerfile
          - service: planning-service
            ecrRepo: planning-service
            context: .
            dockerfile: planning-service/Dockerfile
          - service: nav-log-agent
            ecrRepo: nav-log-agent
            context: .
            dockerfile: nav-log-agent/Dockerfile
          # The four images the production server runs
          # (docker-compose.prod.yml). crewai-agent and Airflow stay out
          # of production: the same briefing nav-log-agent writes, and
          # retraining run on the owner's machine (docs/README-AWS.md).
          - service: model-service
            ecrRepo: model-service
            context: model-service
            dockerfile: model-service/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4
      # The registry cache is private, like the images: without this the
      # cache is refused, quietly, and every image built from nothing.
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd  # v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - id: ecr-login
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd  # v2
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.ecr-login.outputs.registry }}/vfr-route/${{ matrix.ecrRepo }}:latest
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}/${{ matrix.service }}:buildcache

  # Then the server takes them: deploy.sh over SSM Run Command (no SSH,
  # no open port), which pulls the new images and restarts what changed.
  # Only once AWS_INSTANCE_ID is set as a repo variable (the stack's
  # ServerInstanceId output).
  deploy:
    runs-on: ubuntu-26.04
    needs: push-ecr
    if: vars.AWS_INSTANCE_ID != ''
    permissions:
      id-token: write
    steps:
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd  # v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Run deploy.sh on the server
        env:
          INSTANCE: ${{ vars.AWS_INSTANCE_ID }}
        run: |
          id=$(aws ssm send-command --instance-ids "$INSTANCE" --document-name AWS-RunShellScript \
            --comment "deploy ${GITHUB_SHA::7}" --parameters 'commands=["/srv/flight_plan/repo/infra/server/deploy.sh"]' \
            --query Command.CommandId --output text)
          aws ssm wait command-executed --command-id "$id" --instance-id "$INSTANCE" || true
          aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCE" \
            --query '[Status, StandardOutputContent, StandardErrorContent]' --output text
          test "$(aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCE" --query Status --output text)" = Success
