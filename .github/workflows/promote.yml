name: Promote

# What a green CI run on main publishes: each image it built becomes
# `:latest`, and, once the AWS variables are set, the images the stack
# deploys go to ECR. It was CI's last job, and every run's last seven to
# nine seconds; CI is how long it takes to learn whether a commit is
# good, and this is what happens once it is. So it follows CI rather
# than ending it -- only after a run that succeeded, and only for a push
# to main (a pull request builds its images without pushing them).
#
# Actions are pinned as in ci.yml (its opening comment says why).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

# In the order the runs finished, one at a time, none cancelled: a later
# commit's promotion must not be overtaken by an earlier one's.
concurrency:
  group: promote
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Each image the run built is under the commit's tag (`:sha-<commit>`,
  # ci.yml's build-images); it becomes `:latest` by a copy of its
  # manifest, which takes seconds -- the build is not repeated. Which
  # images those are is what the registry has under the tag: every image
  # of .github/images.hcl is asked after, and the ones the commit did not
  # rebuild have none. All at once, three tries each, with the
  # registry's answer on the checks page when all three fail -- a job's
  # log takes admin rights to read. A promotion that failed stays
  # failed: the next CI run builds only what changed after this commit
  # (its last green one), so re-run this one.
  promote:
    # GitHub's runner, not LINUX_RUNNER (the Mac mini, Apple silicon): it
    # builds and pushes images for AWS's x86 machines.
    runs-on: ubuntu-26.04
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: This commit's images, as latest
        env:
          REPO: ghcr.io/${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          promote() {
            if ! docker buildx imagetools inspect --raw "$REPO/$1:sha-$SHA" > /dev/null 2>&1; then
              echo "$1: not built by this commit"
              return 0
            fi
            for try in 1 2 3; do
              if docker buildx imagetools create --tag "$REPO/$1:latest" "$REPO/$1:sha-$SHA" > "/tmp/promote-$1.log" 2>&1; then
                echo "$1: promoted"
                return 0
              fi
              sleep $((try * 5))
            done
            echo "::error title=$1 not promoted::$(tail -5 "/tmp/promote-$1.log" | tr '\n' ' ' | sed 's/%/%25/g')"
            return 1
          }
          for service in $(docker buildx bake -f .github/images.hcl --print 2>/dev/null | jq -r '.target | keys[]'); do
            promote "$service" &
          done
          failed=0
          for job in $(jobs -p); do wait "$job" || failed=1; done
          exit "$failed"

  # Copies every image the production server runs
  # (docker-compose.prod.yml; the stack's ECR repositories in
  # infra/cloudformation/template.yaml) from GHCR to ECR, as
  # `sha-<commit>` and `latest`: the very images CI tested, by a copy of
  # their manifests and layers, not a second build that only hoped to hit
  # the cache. An image this commit did not rebuild has no `sha-` tag in
  # GHCR (build-images builds what changed), so its `latest` there, which
  # the promote job above moves in commit order, is the one copied: the
  # image of the last commit that changed it. Authenticates via OIDC (no
  # long-lived AWS keys stored as secrets) -- activates once
  # AWS_ROLE_ARN/AWS_REGION are set as repo variables (Settings ->
  # Secrets and variables -> Actions -> Variables; the stack's
  # DeployRoleArn output); skipped entirely until then. The role trusts
  # only jobs in the `production` environment (template.yaml's
  # DeployRole), which only main may deploy to (docs/README-AWS.md).
  push-ecr:
    # GitHub's runner, not LINUX_RUNNER (the Mac mini): AWS's machines
    # are x86, and so is everything this job touches.
    runs-on: ubuntu-26.04
    needs: promote
    if: vars.AWS_ROLE_ARN != ''
    environment: production
    permissions:
      id-token: write
      packages: read
    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd  # v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - id: ecr-login
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd  # v2
      - name: CI's images, to ECR
        env:
          GHCR: ghcr.io/${{ github.repository }}
          ECR: ${{ steps.ecr-login.outputs.registry }}/wingtip
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          # The two images the production server runs
          # (docker-compose.prod.yml). The pipeline stays out of
          # production (docs/README-AWS.md).
          for service in webapp planning-service; do
            source="$GHCR/$service:sha-$SHA"
            if ! docker buildx imagetools inspect --raw "$source" > /dev/null 2>&1; then
              source="$GHCR/$service:latest"
            fi
            echo "$service: $source"
            docker buildx imagetools create --tag "$ECR/$service:sha-$SHA" --tag "$ECR/$service:latest" "$source"
          done

  # Then the server takes them: deploy.sh over SSM Run Command (no SSH,
  # no open port), which pulls the new images and restarts what changed.
  # The server is whichever one is running under the stack's name (a Spot
  # interruption replaces it), so it is looked up each time. Only once
  # AWS_SERVER_NAME is set as a repo variable (the stack's ServerName
  # output).
  deploy:
    # GitHub's runner, not LINUX_RUNNER: the production credentials stay
    # off the machine the branches' code runs on.
    runs-on: ubuntu-26.04
    needs: push-ecr
    if: vars.AWS_SERVER_NAME != ''
    environment: production
    permissions:
      id-token: write
    steps:
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd  # v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      # deploy.sh is given the commit CI passed: the server checks it out
      # and runs its `sha-` images (infra/server/deploy.sh).
      - name: Run deploy.sh on the server
        env:
          SERVER: ${{ vars.AWS_SERVER_NAME }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          instance=$(aws ec2 describe-instances --filters "Name=tag:Name,Values=$SERVER" Name=instance-state-name,Values=running \
            --query 'Reservations[0].Instances[0].InstanceId' --output text)
          if [ "$instance" = None ]; then echo "::error title=No server::none running as $SERVER"; exit 1; fi
          id=$(aws ssm send-command --instance-ids "$instance" --document-name AWS-RunShellScript \
            --comment "deploy ${SHA::7}" --parameters "commands=[\"/srv/wingtip/repo/infra/server/deploy.sh $SHA\"]" \
            --query Command.CommandId --output text)
          # Pulling new images can outlast the CLI's own wait (100 s), so
          # the status is asked after for up to 15 minutes.
          for _ in $(seq 90); do
            status=$(aws ssm get-command-invocation --command-id "$id" --instance-id "$instance" --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in Pending|InProgress|Delayed) sleep 10 ;; *) break ;; esac
          done
          aws ssm get-command-invocation --command-id "$id" --instance-id "$instance" \
            --query '[Status, StandardOutputContent, StandardErrorContent]' --output text
          test "$status" = Success
