name: Native Android

# The native Android app (android/, docs/NATIVE-ANDROID.md): Compose over
# the same planner and gateway as the website, with the shared Rust engine
# linked in. Its build -- the engine for the three ABIs, the unit tests,
# lint and a debug APK -- is native-android-build.yml, which ci.yml calls
# on a pull request that touches the app, so "CI passed" covers it. Here,
# that build again on main and on claude/native-*, and every night (or by
# hand) the instrumented tests after it: the engine held to the web's
# shared fixtures through the app's own bridge, on an emulator. No Google
# Play lane yet.
#
# Actions are pinned as in ci.yml (its opening comment says why).
on:
  # Not pull_request: ci.yml runs the build for one (its `changes` job's
  # `android`), where "CI passed" waits for it.
  push:
    # And a native-app branch of Claude's: its builds run from the branch
    # itself (a dispatch by name needs the file on main first).
    branches: [main, "claude/native-*"]
    paths:
      - android/**
      - native/**
      - web/src/lib/fixtures/**
      - scripts/api-models-apps.*
      - .github/workflows/native-android.yml
      - .github/workflows/native-android-build.yml
  workflow_dispatch:
  # The instrumented tests on an emulator, every night: ten minutes and
  # more of a runner, so not on each change (the owner, 2026-11-06:
  # lighter CI). A change still gets the unit tests, lint and an APK.
  schedule:
    - cron: "47 9 * * *"

# Its own runs only: a pull request's build runs inside CI's run and
# under CI's group.
concurrency:
  group: native-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The site the app talks to and whose links open it (App Links): the
  # repo variable once it exists, a stand-in before; its host is the
  # build's WINGTIP_HOST (android/app/build.gradle.kts).
  WINGTIP_URL: ${{ vars.WINGTIP_URL || 'https://wingtipmaps.app/app/plan' }}

jobs:
  build:
    uses: ./.github/workflows/native-android-build.yml

  device:
    needs: build
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    # GitHub's runner, not LINUX_RUNNER (the Mac mini, Apple silicon): the
    # Android SDK's Linux tools and its emulator are x86 only.
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad  # v6
        with:
          distribution: temurin
          java-version: "21"
      - name: The SDK's licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
      # The engine's libraries as the last run that built this engine left
      # them: built here for three ABIs in 90 s, and again in the device
      # job in 81 s (run 42110144706), though the engine changes far less
      # often than the app. Keyed on the engine's own files; the device job
      # finds what the build job kept a minute before.
      - name: The engine, as last built
        id: engine
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: android/app/engine
          key: engine-android-${{ hashFiles('native/engine/**', 'native/crates/**', 'native/ffi/**', 'native/Cargo.*') }}
      - name: The engine, for the app
        # wingtip-engine through its C functions (native/ffi), for each
        # ABI, with the runner's own rustup and NDK, where the engine changed.
        if: steps.engine.outputs.cache-hit != 'true'
        run: native/ffi/build-android.sh
      - name: The site's host
        id: site
        run: echo "host=$(python3 -c "from urllib.parse import urlparse; print(urlparse('$WINGTIP_URL').hostname)")" >> "$GITHUB_OUTPUT"
      # The emulator runs on the runner's KVM, which the runner's user
      # may not open by default (the emulator action's README).
      - name: KVM, for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: The instrumented tests, on an emulator
        # The engine held to the shared fixtures through the app's own
        # bridge (EngineTest), on the x86_64 image the engine is built for.
        uses: reactivecircus/android-emulator-runner@1dcd0090116d15e7c562f8db72807de5e036a4ed  # v2.34.0
        env:
          WINGTIP_HOST: ${{ steps.site.outputs.host }}
        with:
          api-level: 35
          arch: x86_64
          working-directory: android
          script: ./gradlew --no-daemon --stacktrace connectedDebugAndroidTest
      - name: The test reports, on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: wingtip-native-device-tests
          path: android/app/build/reports/androidTests
          if-no-files-found: ignore
          retention-days: 7
