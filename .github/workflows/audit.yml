name: Audit

# Claude audits the code on main every week, three ways, and puts right
# what it finds in pull requests that merge like any of its own once CI
# passes (auto-merge-agents.yml):
#
# - design: the app as a pilot meets it on an iPhone, against Apple's
#   Human Interface Guidelines and CLAUDE.md's rules -- a decision that
#   is wrong for the pilot, not a matter of taste;
# - code: the same thing written twice, hand-rolled where a stock
#   component or library does it, code nothing calls -- made one;
# - speed: the build, the tests, the app's first load, the planner's
#   answers and the hand-offs to other apps, measured, the slowest put
#   right.
#
# Each audit opens at most one pull request, on one theme, small enough
# to read, with what it measured before and after; what it should not
# change by itself (moving a panel, a product decision, anything bigger
# than one pull request) it opens as an issue for the owner instead,
# labelled "audit". Started by hand from the Actions tab too, one audit
# or all. Needs what claude.yml needs; without a key it says so and stops.

on:
  schedule:
    - cron: "41 10 * * 1"
  workflow_dispatch:
    inputs:
      audit:
        description: Which audit
        type: choice
        options: [all, design, code, speed]
        default: all

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: read

jobs:
  audit:
    strategy:
      fail-fast: false
      matrix:
        audit: [design, code, speed]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    env:
      HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' || secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
      CHOSEN: ${{ github.event.inputs.audit || 'all' }}
    steps:
      - name: This audit, or not
        id: run
        run: |
          if [ "$HAS_KEY" != true ]; then
            echo "::notice::No ANTHROPIC_API_KEY or CLAUDE_CODE_OAUTH_TOKEN secret, so no audit."
          elif [ "$CHOSEN" = all ] || [ "$CHOSEN" = "${{ matrix.audit }}" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        if: steps.run.outputs.go == 'true'
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7
        if: steps.run.outputs.go == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        if: steps.run.outputs.go == 'true'
        with:
          python-version: "3.13"
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6  # v6
        if: steps.run.outputs.go == 'true'
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: The web app's packages
        if: steps.run.outputs.go == 'true'
        working-directory: web
        run: npm ci
      - name: What this audit looks for
        id: brief
        if: steps.run.outputs.go == 'true'
        run: |
          case "${{ matrix.audit }}" in
            design) brief="Audit the design: every screen and control as a pilot meets it on an iPhone (web/src), against Apple's Human Interface Guidelines and the rules in CLAUDE.md -- hit areas, type sizes, tint, Liquid Glass sheets and detents, errors shown in context, what a pilot needs in flight being one tap away, nothing a pilot must read being cut off or covered. Find the decisions that are wrong for the pilot, not matters of taste." ;;
            code) brief="Audit the code for what can be one: logic written twice or more (in web/src, between planning-service and src/vfr, between the services), components hand-rolled where shadcn/ui, Radix or a library already in package.json or a requirements file does it, code nothing calls any more. Make it one shared piece, in the place the code around it would look for it; delete what nothing uses. Behaviour stays the same and the tests prove it." ;;
            speed) brief="Audit the speed: the web build and the critical path's size (npx vite build; the critical path's budget is 1.00 MB), the test suites' run times, the app's first load and its map points (airports, checkpoints) arriving, the planner's answers (planning-service), and the hand-offs to other apps (ForeFlight's pack and links, the files the plan exports). Measure first, with the numbers in the pull request, before and after; put right the slowest thing measured. A change that is not measurably faster is not made." ;;
          esac
          echo "brief=$brief" >> "$GITHUB_OUTPUT"
      - uses: anthropics/claude-code-action@86d88e619d8e6caf07b5c3944dd14f441c533718  # v1.0.243
        if: steps.run.outputs.go == 'true'
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}

            ${{ steps.brief.outputs.brief }}

            CLAUDE.md has the project's rules; follow them. First read the
            open pull requests and issues labelled "audit" (gh pr list, gh
            issue list --label audit) and leave alone what one of them
            already covers.

            Then put right the single most valuable thing you found, on one
            theme: on a new branch claude/audit-${{ matrix.audit }}-<today's date>,
            with tests for what changed, the checks CLAUDE.md names passing,
            committed and pushed, and a pull request to main that says what
            was wrong, why, and what proves the change right (for speed, the
            numbers before and after). Keep it to what one person can review
            in ten minutes.

            Anything else worth doing, and anything you must not change by
            yourself -- moving a panel or a control, a product decision, a
            change bigger than one pull request -- goes in one issue per
            finding, labelled "audit" (create the label if it is missing),
            with where, why and what you would do. If you find nothing worth
            changing, say so in the job's summary and open nothing.
          claude_args: |
            --allowedTools "Edit,MultiEdit,Write,Read,Glob,Grep,LS,Bash(git:*),Bash(gh:*),Bash(npm:*),Bash(npx:*),Bash(node:*),Bash(python:*),Bash(python3:*),Bash(pip:*),Bash(mvn:*),Bash(time:*),Bash(du:*),Bash(ls:*)"
