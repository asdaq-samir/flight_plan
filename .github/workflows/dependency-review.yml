name: Dependency review

# Every pull request's new or changed dependencies (npm, pip, Maven,
# GitHub Actions, Docker) against GitHub's advisory database: one with a
# known high or critical vulnerability fails this check, and the pull
# request says which and what version fixes it. Dependabot's own updates
# go through it too. GitHub's dependency graph does the work; no secret is
# needed.

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294  # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
