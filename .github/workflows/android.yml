name: Android

# The Android app (web/android, web/capacitor.config.ts; docs/ANDROID.md).
# Every change to it is built on GitHub's Linux runner into a debug APK:
# proof that the project and its plugins compile, and an app a tester can
# install by hand (the run's artifact). On main, once the owner has set up
# Google Play, a release bundle is signed with the owner's upload key and
# sent to Google Play's internal testing track -- nothing signs on a pull
# request.
#
# Actions are pinned as in ci.yml (its opening comment says why).
on:
  pull_request:
    paths:
      - web/android/**
      - web/ios-offline/**
      - web/capacitor.config.ts
      - web/package.json
      - web/package-lock.json
      - .github/workflows/android.yml
      - .github/android/**
  push:
    branches: [main]
    paths:
      - web/android/**
      - web/ios-offline/**
      - web/capacitor.config.ts
      - web/package.json
      - web/package-lock.json
      - .github/workflows/android.yml
      - .github/android/**
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The site the app wraps, whose links open it (App Links), and the
  # app's package name on Google Play: the repo variables once they
  # exist, stand-ins before (android/app/build.gradle reads both).
  WINGTIP_URL: ${{ vars.WINGTIP_URL || 'https://wingtipmaps.app/app/plan' }}
  ANDROID_APP_ID: ${{ vars.ANDROID_APP_ID || 'app.wingtipmaps.android' }}

jobs:
  debug:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7
        with:
          node-version-file: .nvmrc
      # Capacitor 8's Android build compiles for Java 21.
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6  # v6
        with:
          distribution: temurin
          java-version: "21"
      - name: The shell, with its plugins
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npx cap sync android
      # The runner's Android SDK; what the build lacks (its platform and
      # build tools) the Gradle plugin fetches once the licences are taken.
      - name: The SDK's licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
      - name: Built, a debug APK
        working-directory: web/android
        run: ./gradlew --no-daemon --stacktrace assembleDebug
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: wingtip-maps-debug-apk
          path: web/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

  play:
    needs: debug
    # main only, and only once the owner has named the app's package (the
    # repo variable): a run started by hand from another branch builds
    # the debug APK but signs and uploads nothing.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.ANDROID_APP_ID != ''
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ vars.ANDROID_UPLOAD_KEY_ALIAS || 'upload' }}
      # Google Play wants each upload's version code above the last one's:
      # this workflow's run number, which only grows.
      ANDROID_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6  # v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.13"
      - name: The shell, with its plugins
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npx cap sync android
      - name: The SDK's licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
      # Signed with the upload key; Google Play re-signs it with the app
      # signing key it keeps (Play App Signing), so a lost upload key is
      # reset with Google rather than the app lost.
      - name: Built and signed, a release bundle
        working-directory: web/android
        run: |
          export ANDROID_KEYSTORE="$RUNNER_TEMP/upload.jks"
          # Gone however the step ends, a failed build included.
          trap 'rm -f "$ANDROID_KEYSTORE"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE"
          ./gradlew --no-daemon --stacktrace bundleRelease
      # Kept with the run: Google Play takes an app's very first bundle
      # only through its Console, by hand (docs/ANDROID.md).
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: wingtip-maps-release-aab
          path: web/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
      - name: Sent to Google Play
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          # "draft" until the app's first release is rolled out in the
          # Console; then the owner sets the variable to "completed".
          TRACK: ${{ vars.PLAY_TRACK || 'internal' }}
          STATUS: ${{ vars.PLAY_RELEASE_STATUS || 'draft' }}
        run: |
          pip install --quiet google-auth==2.58.1 requests==2.34.2
          python .github/android/play_upload.py web/android/app/build/outputs/bundle/release/app-release.aab \
            "$ANDROID_APP_ID" "$TRACK" "$STATUS"
