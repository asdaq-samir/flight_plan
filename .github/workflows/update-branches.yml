name: Update branches

# Each push to main brings the open claude/ pull requests up to date with
# it, so their CI runs against what they will merge into and a conflict
# shows the moment main makes it, not when the pull request is next
# looked at (the owner, 2026-11-06: development faster). GitHub's "update
# branch" merges main in -- never a rebase, as CLAUDE.md asks of a pushed
# branch.
#
# Gently, as CLAUDE.md's "write to GitHub gently" says: one write at a
# time, ten seconds or more apart, at most ten updates a run (the rest
# wait for main's next push), and a pull request pushed to in the last
# five minutes is left alone, since its session may be pushing again.
#
# A pull request that cannot be updated for a conflict gets the one label
# needs-merge, which comes off when its branch is next current.
#
# The token: a push made with the workflow's own GITHUB_TOKEN starts no
# workflow (GitHub's rule against loops; ci.yml says the same of the
# branches Auto-merge moved), so the pull request would sit with no checks
# and never merge. The update is made with MERGE_TOKEN, the owner's
# fine-grained token Auto-merge already uses, so its merge commit is the
# owner's push and starts CI like any other. Without MERGE_TOKEN it falls
# back on GITHUB_TOKEN and starts CI on the branch by hand
# (workflow_dispatch, which that token may start), whose "CI passed" lands
# on the same commit.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

# One run at a time; a second push to main while one runs waits for it,
# so two runs never write at once.
concurrency:
  group: update-branches
  cancel-in-progress: false

jobs:
  update:
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-26.04' }}
    timeout-minutes: 15
    steps:
      - name: Update the claude/ pull requests that are behind main
        env:
          UPDATE_TOKEN: ${{ secrets.MERGE_TOKEN || github.token }}
          HAS_MERGE_TOKEN: ${{ secrets.MERGE_TOKEN != '' }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          MAX_UPDATES: 10
          QUIET_MINUTES: 5
          GAP_SECONDS: 10
          LABEL: needs-merge
        run: |
          set -uo pipefail
          now=$(date -u +%s)
          wrote=0
          updates=0

          # Ten seconds or more between any two writes this run makes.
          gentle() {
            if [ "$wrote" -gt 0 ]; then sleep "$GAP_SECONDS"; fi
            wrote=$((wrote + 1))
          }

          prs=$(gh pr list --base main --state open --limit 100 \
            --json number,headRefName,isDraft,updatedAt,isCrossRepository,labels \
            --jq '.[] | select((.isDraft | not) and (.isCrossRepository | not) and (.headRefName | startswith("claude/")))
                  | [.number, .headRefName, .updatedAt, ([.labels[].name] | index(env.LABEL) != null)] | @tsv')

          while IFS=$'\t' read -r pr branch updated labelled; do
            [ -n "$pr" ] || continue
            behind=$(gh api "repos/$GH_REPO/compare/main...$branch" --jq '.behind_by' 2>/dev/null) || { echo "#$pr: could not compare $branch with main"; continue; }

            if [ "$behind" = "0" ]; then
              echo "#$pr $branch: current"
              if [ "$labelled" = "true" ]; then
                gentle
                gh api -X DELETE "repos/$GH_REPO/issues/$pr/labels/$LABEL" >/dev/null && echo "#$pr: $LABEL removed"
              fi
              continue
            fi

            age=$(( now - $(date -u -d "$updated" +%s) ))
            if [ "$age" -lt $(( QUIET_MINUTES * 60 )) ]; then
              echo "#$pr $branch: $behind behind, but changed $((age / 60)) min ago; left for the next run"
              continue
            fi
            if [ "$updates" -ge "$MAX_UPDATES" ]; then
              echo "#$pr $branch: $behind behind; this run's $MAX_UPDATES updates are spent"
              continue
            fi

            gentle
            updates=$((updates + 1))
            if out=$(GH_TOKEN=$UPDATE_TOKEN gh api -X PUT "repos/$GH_REPO/pulls/$pr/update-branch" -f update_method=merge 2>&1); then
              echo "#$pr $branch: was $behind behind, main merged in"
              if [ "$HAS_MERGE_TOKEN" != "true" ]; then
                gentle
                gh workflow run ci.yml --ref "$branch" && echo "#$pr: CI started by hand (no MERGE_TOKEN)"
              fi
              if [ "$labelled" = "true" ]; then
                gentle
                gh api -X DELETE "repos/$GH_REPO/issues/$pr/labels/$LABEL" >/dev/null && echo "#$pr: $LABEL removed"
              fi
            elif grep -qi "conflict" <<<"$out"; then
              echo "#$pr $branch: main does not merge in cleanly"
              if [ "$labelled" != "true" ]; then
                gentle
                gh api -X POST "repos/$GH_REPO/issues/$pr/labels" -f "labels[]=$LABEL" >/dev/null && echo "#$pr: $LABEL added"
              fi
            else
              echo "::warning title=Update branches::#$pr $branch: $out"
              # A 403 or a 429 is GitHub asking for fewer writes: stop.
              if grep -qE "HTTP (403|429)" <<<"$out"; then exit 0; fi
            fi
          done <<<"$prs"
          echo "Updated $updates pull request(s)."
