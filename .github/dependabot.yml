# Dependabot, kept quiet (the owner, 2026-11-06: "make it quieter"): one
# pull request a month with every minor and patch update across the
# repository's ecosystems, which auto-merge-agents.yml merges once CI
# passes. Major versions are not proposed here: they change behaviour and
# are taken up on purpose. Security fixes are separate from all of this --
# Dependabot security updates, on in the repository's settings, open as
# soon as an advisory lands, majors included.
version: 2

multi-ecosystem-groups:
  monthly:
    schedule:
      interval: monthly

updates:
  - package-ecosystem: github-actions
    directory: /
    multi-ecosystem-group: monthly
    patterns: ["*"]

  - package-ecosystem: npm
    directory: /web
    multi-ecosystem-group: monthly
    patterns: ["*"]
    ignore:
      # Pinned with the browser image CI runs it in (ci.yml PLAYWRIGHT_IMAGE).
      - dependency-name: "@playwright/test"
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: maven
    directory: /springboot-app
    multi-ecosystem-group: monthly
    patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: pip
    directories:
      - /
      - /docker
      - /planning-service
      - /src
    multi-ecosystem-group: monthly
    patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directories:
      - /docker
      - /planning-service
      - /springboot-app
    multi-ecosystem-group: monthly
    patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
