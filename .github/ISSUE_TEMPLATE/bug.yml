name: Bug
description: Something in the app is wrong or broken.
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you saw, and what you expected instead.
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Where
      description: The screen, the route or airport, and the device (iPhone, Android, desktop browser).
  - type: textarea
    id: evidence
    attributes:
      label: Screenshot or log
      description: Optional.
