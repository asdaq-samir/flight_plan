<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Wingtip Maps' mark at a tab's size: the airplane in the dashed
       airspace ring, eight dashes and a heavier airplane so it holds at
       16 pixels. White on a dark browser. -->
  <style>
    .ring { stroke: #A3266F; }
    .ship { fill: #14284B; stroke: #14284B; }
    @media (prefers-color-scheme: dark) {
      .ring { stroke: #E37BB5; }
      .ship { fill: #FFFFFF; stroke: #FFFFFF; }
    }
  </style>
  <circle class="ring" cx="16" cy="16" r="13" fill="none" stroke-width="2.6" stroke-dasharray="7 3.2" transform="rotate(-112.5 16 16)"/>
  <g class="ship" transform="translate(16 16.3) scale(0.36) translate(-32 -31.5)" stroke-width="3.5" stroke-linejoin="round">
    <path d="M32 12 C34.2 12 35 14.5 35 18 L34.2 44 L33 51 L31 51 L29.8 44 L29 18 C29 14.5 29.8 12 32 12 Z"/>
    <rect x="9" y="23" width="46" height="6.5" rx="3"/>
    <rect x="23" y="45" width="18" height="4.5" rx="2.2"/>
  </g>
</svg>
