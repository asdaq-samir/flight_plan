# The settings of the root suite (tests/). planning-service has a
# pyproject.toml of its own, which pytest takes instead of this one, so it
# repeats addopts and markers and its
# conftest.py imports the guards in pytest_guards.py. No cache of the last run's failures,
# which would carry one run's order into the next (docs/CI.md, "Flaky
# tests"), and a mark nobody declared is an error rather than a test
# silently left unmarked.
[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-p no:cacheprovider --strict-markers"
markers = [
    "order_dependent: passes only in the order it was written in; kept out of the random order (pytest_guards.py), and listed to be fixed",
]

[tool.ruff]
line-length = 140
extend-exclude = ["notebooks", "*.ipynb"]

[tool.ruff.lint]
# Default (E/F: pyflakes + pycodestyle errors) is enough for CI to catch
# real bugs (unused imports, undefined names, syntax issues) without also
# relitigating this codebase's existing style choices on day one of CI.
select = ["E", "F"]
