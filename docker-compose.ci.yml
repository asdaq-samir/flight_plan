# The stack the browser suite runs against in CI (the e2e job in
# .github/workflows/ci.yml), on top of docker-compose.yml: the three
# images that job built and loaded, under the names it gave them, and
# the suite's own small trained model in place of data/models/current,
# which is not in git. Everything else is the local stack's own
# defaults -- Mailpit for the sign-in link, developer@example.com a
# developer, no agents (their profile is not asked for), no charts on
# disk -- and the FAA and airport data the planner fetches for itself
# into data/raw, which the job keeps between runs, with the corridor's
# elevations seeded from web/e2e/fixtures (the USGS lookup refuses a
# GitHub runner).
#
# The stack starts at once rather than in turn. docker-compose.yml has
# the webapp wait for a healthy planner, which waits for a healthy
# model service, each noticed at the next of its five-second checks:
# the three one after the other were most of the half-minute before
# the first test. Neither wait is needed to start. The webapp's
# readiness is its own and the database's (application.yml), and
# nothing in its startup calls the planner; the planner's warm-up loads
# airspace, obstacles, weather and charts, and asks the model service
# only when a route is scored. So here all three start together, and
# the job waits for all three to be healthy, and the planner warm,
# before the suite asks anything. While each service starts, its check
# runs every second (start_interval): healthy when it is ready, not up
# to five seconds later.
services:
  webapp:
    image: flight_plan-webapp:ci
    depends_on: !override
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      start_interval: 1s
  planning-service:
    image: flight_plan-planning-service:ci
    depends_on: !reset {}
    healthcheck:
      start_period: 60s
      start_interval: 1s
    environment:
      # The hourly check that fetches and renders the FAA's whole chart
      # set (7 GB, hours) is off: the corridor's own sheets, which the
      # planner prepares at startup, are all the suite needs. The daily
      # refresh is the local stack's and AWS's job, not a test run's.
      CHARTS_AUTO_REFRESH: "0"
      # And a tile never sends for a sheet: the warm-up's are all it
      # draws on (vfr.charts.FETCH_FOR_TILES). A zoomed-out view used to
      # send for 29 sheets past the corridor's 10 -- minutes of downloads
      # and preparation in the first run of an FAA cycle, and 2.1 GB of
      # charts cache that every shard of every run then restored. Past
      # the corridor the suite's map is left blank, which is all its
      # assertions need (they are on structure, never on pixels).
      CHARTS_FETCH_FOR_TILES: "0"
      # One chart sheet prepared at a time: preparing one (its overviews,
      # its neatline) takes the planner to about 3 GB, and the runner has
      # 16 GB for the whole stack and the browsers; the default of two is
      # for a machine of one's own.
      CHARTS_PREPARE_AT_ONCE: "1"
  model-service:
    image: flight_plan-model-service:ci
    healthcheck:
      start_period: 60s
      start_interval: 1s
    volumes:
      - ./web/e2e/fixtures/model:/opt/ml/model:ro
